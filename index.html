    buzzOrderRef.current = newOrder;
    setBuzzOrder(newOrder);
    if (activeGroupRef.current === null) {
      activeGroupRef.current = group;
      clearRetryTimer();
      if (audioRef.current) audioRef.current.pause();
      setSpeaking(false);
      setActiveGroup(group);
    }
  }

  function releaseTurn() { activeGroupRef.current = null; setActiveGroup(null); setSelStart(null); }

  // FITUR BARU: klik lagi tombol kelompok yang SEDANG antre (aktif MAUPUN masih menunggu giliran)
  // akan MEMBATALKAN penunjukan itu — dikeluarkan dari antrean. Berguna kalau guru salah pencet
  // kelompok, atau ternyata urutannya perlu diubah (di mode Manual, guru sendiri yang menentukan
  // urutan lewat klik — jadi wajar kalau perlu dibatalkan/diulang kapan saja, bukan cuma untuk
  // kelompok yang kebetulan sedang aktif). Berlaku di kedua mode (Digital & Manual) karena
  // keduanya berbagi tombol K1–K6 & fungsi antrean (`buzz`) yang sama.
  function cancelActiveGroup(group) {
    const newOrder = buzzOrderRef.current.filter((o) => o.group !== group);
    buzzOrderRef.current = newOrder;
    setBuzzOrder(newOrder);
    // BUGFIX: dulu activeGroup SELALU dikosongkan di sini tanpa syarat, walau grup yang dibatalkan
    // BUKAN grup yang sedang aktif menjawab (mis. guru membatalkan kelompok KEDUA yang masih
    // menunggu giliran) — akibatnya giliran kelompok PERTAMA yang justru sedang aktif ikut
    // terbatalkan tanpa sengaja. Ini juga penyebab tombol kelompok ke-2/ke-3 dst di antrean
    // sebelumnya terlihat abu-abu/tidak bisa diklik sama sekali (lihat kondisi `locked` di
    // render tombol) — sekarang activeGroup cuma dikosongkan kalau grup yang dibatalkan memang
    // grup yang sedang aktif; kelompok lain di antrean bisa dibatalkan sendiri-sendiri tanpa
    // mengganggu giliran yang sedang berjalan.
    if (activeGroupRef.current === group) {
      activeGroupRef.current = null;
      setActiveGroup(null);
      setSelStart(null);
    }
    // BUGFIX: dulu pembatalan ini cuma mengubah state LOKAL di layar guru — dokumen room di
    // Firestore (yang dibaca langsung oleh HP kelompok itu sendiri lewat listener room.buzzOrder,
    // lihat pressBuzz di StudentJoinScreen) TIDAK ikut diperbarui. Akibatnya kelompok yang baru
    // dibatalkan tetap melihat badge posisi antre ("#1"/"#2" dst) & tombolnya tetap terkunci di
    // HP mereka SENDIRI, padahal panel guru sudah menganggap mereka tidak antre sama sekali —
    // desync yang bikin kelompok itu terjebak menunggu tanpa pernah dipanggil. Sekarang entri
    // kelompok ini juga dihapus dari buzzOrder di Firestore (pakai transaction, konsisten dengan
    // pola yang sama dipakai pressBuzz, supaya tidak tabrakan kalau kebetulan kelompok itu sedang
    // menekan buzzer di saat yang sama persis).
    if (roomCode) {
      const ref = db.collection("rooms").doc(roomCode);
      db.runTransaction((tx) => tx.get(ref).then((snap) => {
        const data = snap.data();
        if (!data || !Array.isArray(data.buzzOrder)) return;
        const cleaned = data.buzzOrder.filter((o) => o.group !== group);
        if (cleaned.length !== data.buzzOrder.length) tx.set(ref, { buzzOrder: cleaned }, { merge: true });
      })).catch(() => {});
    }
  }

  // FITUR BARU: koreksi skor manual — dulu skor cuma bisa naik lewat jawaban benar yang dieksekusi
  // sistem (handleCellClick). Kalau guru salah menilai (mis. jawaban kelompok sebenarnya benar tapi
  // guru terlanjur menyalahkan), tidak ada cara memperbaikinya selain kejadian itu dibiarkan salah
  // terus. Sekarang guru bisa menambah/mengurangi skor kelompok mana pun secara langsung, sebesar
  // poin babak yang sedang berjalan (unit yang sama dengan 1 jawaban benar), kapan saja — tidak
  // terikat harus ada soal aktif atau giliran tertentu.
  function adjustScore(group, delta) {
    setScores((s) => ({ ...s, [group]: Math.max(0, (s[group] || 0) + delta) }));
  }

  // FITUR BARU: "Guru" adalah pseudo-kelompok — begitu diaktifkan, guru sendiri yang klik huruf
  // di papan (persis seperti kelompok biasa), tapi TIDAK ADA kelompok yang dapat poin. Dipakai
  // untuk (1) mengungkap/menjawab soal yang tidak bisa dijawab murid (menggantikan "Lewati soal"
  // dengan cara yang lebih langsung), dan (2) memperbaiki kesalahan eksekusi guru sendiri secara
  // umum. Sengaja TIDAK lewat buzz()/antrean — guru berwenang penuh, tidak perlu antre atau
  // tunduk pada aturan "sudah pernah salah" seperti kelompok asli.
  function activateGuru() {
    if (!currentWord) return;
    clearRetryTimer();
    if (audioRef.current) audioRef.current.pause();
    setSpeaking(false);
    activeGroupRef.current = "guru";
    setActiveGroup("guru");
    setSelStart(null);
  }

  // FITUR DIPERBAIKI (koreksi dari override "▶" per-tombol sebelumnya): ini sekarang dipicu dari
  // Mode Guru (klik langsung tombol K1–K6 saat Mode Guru menyala, bukan ikon kecil terpisah) — dan
  // yang penting, BISA dipakai untuk kembali ke kelompok yang gilirannya SUDAH LEWAT/dianggap salah
  // di ronde ini (bukan cuma menyela kelompok yang lagi aktif), lewat mekanisme openToAll yang
  // sudah ada (bukan menghapus status triedSet — lihat BUGFIX di bawah kenapa itu salah). Kalau
  // kelompok ini salah lagi, giliran tetap lanjut normal ke kelompok berikutnya di antrean sesuai
  // urutan angkat tangan asli (persis seperti biasa).
  function forceSetActiveGroup(group) {
    if (!currentWord) return;
    clearRetryTimer();
    if (audioRef.current) audioRef.current.pause();
    setSpeaking(false);
    activeGroupRef.current = group;
    setActiveGroup(group);
    setSelStart(null);
    if (!buzzOrderRef.current.some((o) => o.group === group)) {
      const newOrder = [...buzzOrderRef.current, { group }];
      buzzOrderRef.current = newOrder;
      setBuzzOrder(newOrder);
    }
    // BUGFIX: sebelumnya baris ini MENGHAPUS grup dari triedSet supaya "benar-benar dapat
    // kesempatan baru". Niatnya benar, tapi caranya salah — ini bikin DESYNC dengan HP siswa:
    // pressBuzz() di HP (lihat StudentJoinScreen) cuma mengizinkan tekan ulang buzzer kalau grup
    // ADA di triedGroups DAN openToAll aktif (dua syarat sekaligus). Kalau grup malah DIHAPUS dari
    // triedGroups (bukan tetap ada + openToAll diaktifkan), justru gagal memenuhi syarat itu — HP
    // asli kelompok itu diam-diam tidak bisa menekan buzzer lagi, walau di layar guru terlihat
    // baik-baik saja (karena override ini memang langsung mengeset giliran di layar guru, tidak
    // lewat pressBuzz sama sekali). Diperbaiki dengan memakai openToAll — mekanisme retry yang
    // SUDAH ADA & sudah terbukti tersinkron benar ke HP — bukan menciptakan kondisi baru.
    setOpenToAll(true); openToAllRef.current = true;
  }

  // BUGFIX: dulu tombol Digital/Manual cuma panggil releaseTurn() (batalkan giliran AKTIF saja).
  // Tapi kalau ganti mode DI TENGAH soal yang sudah ada kelompok lain yang sempat angkat tangan
  // lebih dulu (buzzOrder tidak kosong), kelompok-kelompok itu tetap tersimpan di buzzOrder —
  // tombol mereka jadi TERKUNCI PERMANEN ("sudah pernah angkat tangan") untuk sisa soal ini,
  // padahal giliran mereka baru saja dibatalkan paksa oleh pergantian mode, bukan karena mereka
  // menjawab salah. triedSet (kelompok yang BENAR-BENAR sudah menjawab salah) sengaja TIDAK ikut
  // direset di sini — aturan "tidak bisa mencoba lagi" untuk jawaban yang memang salah tetap berlaku.
  function switchInputMode(newMode) {
    setMode(newMode);
    activeGroupRef.current = null; setActiveGroup(null); setSelStart(null);
    buzzOrderRef.current = []; setBuzzOrder([]);
  }

  function triggerCelebration(group) {
    const accent = GROUP_COLORS[(group - 1 + GROUP_COLORS.length) % GROUP_COLORS.length];
    setConfetti(makeConfettiBurst(accent));
    playCorrectSound();
    if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current);
    confettiTimerRef.current = setTimeout(() => setConfetti(null), 1300);
  }

  // FIX (fitur baru — mode Guru Bebas): dulu nextQuestion() selalu mengambil kata PERTAMA di
  // antrean (q.slice(1)) karena semua mode lain memang menjawab soal berurutan sesuai antrean.
  // Mode Guru Bebas tidak begitu — guru bisa membacakan petunjuk kata mana pun duluan (tidak
  // berurutan), jadi kata yang perlu dihapus dari antrean adalah kata yang BENAR-BENAR terjawab/
  // dilewati (wordId), bukan selalu yang pertama. Parameter wordId opsional: kalau tidak diisi,
  // perilakunya sama persis seperti sebelumnya (mode Audio/Teks tetap berurutan seperti biasa).
  function nextQuestion(wordId) {
    setQueue((q) => (wordId ? q.filter((id) => id !== wordId) : q.slice(1)));
    setClueRevealed(false); setTriedSet(new Set()); setOpenToAll(false);
    clearRetryTimer(); releaseTurn(); setSpeaking(false);
    setBuzzOrder([]);
    buzzOrderRef.current = []; triedSetRef.current = new Set(); openToAllRef.current = false;
    if (audioRef.current) audioRef.current.pause();
    clearHintOverlayTimer(); setHintOverlayVisible(false);
  }
  function skipWord(word) {
    const target = word || currentWord;
    if (!target) return;
    // Ungkap jawabannya: sorot posisi kata di papan (warna netral abu-abu putus-putus, beda dari
    // warna kelompok yang benar-benar menjawab) + tampilkan banner "Jawaban: ...". Posisi kata
    // diambil dari puzzle.placements — data penempatan asli saat papan dibangun (bukan dari seleksi
    // siswa, karena soal ini memang tidak pernah terjawab).
    const cells = puzzle && puzzle.placements ? puzzle.placements[target.id] : null;
    if (cells) {
      setFoundMap((f) => ({ ...f, [target.id]: { cells, color: REVEALED_COLOR, revealed: true } }));
    }
    setFlash({ type: "revealed", word: target.letters });
    setTimeout(() => setFlash(null), 2400);
    nextQuestion(target.id);
  }

  // FITUR BARU: kadang ada kelompok yang angkat tangan (buzz) padahal cuma iseng pencet tanpa
  // benar-benar tahu jawabannya. Ini beda dari "Lewati soal" (yang mengungkap jawaban & ganti
  // soal) — ini cuma melewati SATU kelompok itu dari antrean angkat tangan, soal & antrean
  // kelompok lain tetap jalan seperti biasa. Dipakai lewat tombol kecil di sebelah tiap nama
  // kelompok di daftar "Urutan angkat tangan". Kalau kelompok yang dilewati kebetulan yang SEDANG
  // pegang giliran, giliran langsung dilempar ke kelompok berikutnya di antrean (persis seperti
  // kalau kelompok itu baru saja menjawab salah) — kalau bukan yang sedang aktif, cukup dicoret
  // dari antrean tanpa mengganggu apa pun yang sedang berjalan.
  function skipGroupFromQueue(group) {
    if (!currentWord) return;
    const wasActive = activeGroup === group;
    const newOrder = buzzOrderRef.current.filter((o) => o.group !== group);
    buzzOrderRef.current = newOrder;
    setBuzzOrder(newOrder);
    const updatedTried = new Set(triedSetRef.current);
    updatedTried.add(group);
    triedSetRef.current = updatedTried;
    setTriedSet(updatedTried);
    if (wasActive) {
      const next = newOrder.find((o) => !updatedTried.has(o.group));
      if (next) {
        activeGroupRef.current = next.group;
        setActiveGroup(next.group);
        setSelStart(null);
      } else {
        releaseTurn();
        scheduleRetry();
      }
    }
  }

  // Dipakai mode Guru Bebas (cek seluruh kata tersisa, bukan cuma currentWord) DAN oleh Guru
  // (pseudo-kelompok) di mode manapun — sama-sama butuh "kata mana pun di papan yang cocok".
  function findMatchInQueue(str) {
    const wid = queue.find((id) => { const w = babak.words.find((x) => x.id === id); return w && w.letters === str; });
    return wid ? babak.words.find((w) => w.id === wid) : null;
  }

  function handleCellClick(r, c) {
    if (!currentWord || activeGroup === null || !puzzle) return;
    if (!selStart) { setSelStart([r, c]); return; }
    const [sr, sc] = selStart;
    const sameCell = r === sr && c === sc;
    // BUGFIX (regresi — ini sempat diperbaiki lalu hilang lagi karena versi ini dibangun dari
    // basis kode yang lebih lama): kata SATU HURUF (wajar untuk kosakata hiragana, mis. "め",
    // "て", "き") sebelumnya MUSTAHIL dijawab benar sama sekali. Satu-satunya cara memilih
    // rentang 1 huruf adalah klik sel yang sama dua kali, tapi validLine di bawah mewajibkan ada
    // PERGERAKAN (dr atau dc harus bukan 0), jadi klik kedua di sel yang sama selalu dianggap
    // "batal, mulai ulang pilihan" — tidak pernah "kunci jawaban". Sekarang klik kedua di sel
    // yang sama dianggap kunci jawaban HANYA kalau memang ada kata 1-huruf yang masih mungkin
    // jadi jawabannya (currentWord di mode biasa, atau salah satu kata di antrean untuk mode
    // Guru Bebas / pseudo-kelompok Guru yang bisa mencocokkan kata mana pun); kalau tidak ada
    // kemungkinan itu, perilaku lama (klik sel sama = mulai ulang pilihan) tetap dipertahankan
    // supaya klik ganda pada kata biasa tidak sengaja disalahartikan.
    const isFreeMatchMode = activeGroup === "guru" || audioMode === "bebas";
    const singleLetterPossible = isFreeMatchMode
      ? queue.some((id) => { const w = babak.words.find((x) => x.id === id); return w && w.letters.length === 1; })
      : currentWord.letters.length === 1;
    if (sameCell && !singleLetterPossible) { setSelStart([r, c]); return; }
    const dr = sameCell ? 0 : Math.sign(r - sr), dc = sameCell ? 0 : Math.sign(c - sc);
    const len = sameCell ? 1 : Math.max(Math.abs(r - sr), Math.abs(c - sc)) + 1;
    const validLine = sameCell || (dr === 0 && dc !== 0 && r === sr) || (dc === 0 && dr !== 0 && c === sc) || (dr !== 0 && dc !== 0 && Math.abs(r - sr) === Math.abs(c - sc));
    if (!validLine) { setSelStart([r, c]); return; }
    const cells = Array.from({ length: len }, (_, i) => [sr + dr * i, sc + dc * i]);
    const str = cells.map(([rr, cc]) => puzzle.grid[rr][cc]).join("");

    // FITUR BARU: "Guru" (pseudo-kelompok) menjawab/mengoreksi LANGSUNG di papan, menggantikan
    // "Lewati soal" dengan cara yang lebih intuitif — cek terhadap SEMUA kata tersisa (berlaku di
    // mode apa pun, tidak cuma Guru Bebas), dan TIDAK ADA kelompok yang dapat poin sama sekali.
    // Diperlakukan identik dengan "diungkap" (garis abu-abu putus-putus + banner "Jawaban: ...").
    if (activeGroup === "guru") {
      const matchedWord = findMatchInQueue(str);
      if (matchedWord) {
        setFoundMap((f) => ({ ...f, [matchedWord.id]: { cells, color: REVEALED_COLOR, revealed: true } }));
        setFlash({ type: "revealed", word: matchedWord.letters });
        setTimeout(() => setFlash(null), 2400);
        nextQuestion(matchedWord.id);
      }
      setSelStart(null);
      return;
    }

    // FIX: sebelumnya jawaban yang dibalik arahnya (mis. "まど" dipilih dari "ど" ke "ま", kanan-ke-kiri)
    // ikut dianggap benar karena ada fallback "reversed === currentWord.letters". Kata di papan cuma
    // pernah ditempatkan dalam 4 arah maju (lihat DIRECTIONS: kanan, bawah, diagonal kanan-bawah,
    // diagonal kanan-atas) — jadi jawaban yang sah cuma yang dipilih persis mengikuti arah itu dari
    // huruf pertama kata. Fallback dihapus supaya berlaku sama di Babak 1, 2, maupun 3 (kode cek ini
    // memang satu-satunya & dipakai bareng oleh ketiga babak, bukan per-babak terpisah).
    // FITUR BARU (mode Guru Bebas): karena guru membacakan petunjuk sendiri tanpa urutan tertentu,
    // sistem tidak tahu kata MANA yang sedang ditanyakan — jadi seleksi huruf kelompok dicek
    // terhadap SELURUH kata yang masih tersisa di antrean babak ini (bukan cuma currentWord/kata
    // pertama seperti mode Audio & Teks), cocok dengan salah satu saja sudah dianggap benar.
    const matchedWord = audioMode === "bebas" ? findMatchInQueue(str) : (str === currentWord.letters ? currentWord : null);
    const match = !!matchedWord;
    if (match) {
      // FIX: warna highlight jawaban dulu ikut warna kelompok yang menjawab (GROUP_COLORS) —
      // kalau kelompok yang sama beruntun menjawab benar (atau saat dites sendiri oleh guru),
      // semua garis jawaban jadi satu warna terus. Sekarang tiap kata dapat warna tetap dari
      // ANSWER_KEY_PALETTE berdasarkan urutannya di daftar kosakata babak ini (sama seperti
      // pewarnaan di pratinjau Kunci Jawaban Persiapan), jadi warnanya selalu bervariasi apa pun
      // kelompok yang menjawab.
      const segColor = answerKeyColorByWordId[matchedWord.id] || GROUP_COLORS[activeGroup - 1];
      setFoundMap((f) => ({ ...f, [matchedWord.id]: { cells, color: segColor } }));
      setScores((s) => ({ ...s, [activeGroup]: s[activeGroup] + babak.point }));
      setFlash({ type: "correct", group: activeGroup }); setTimeout(() => setFlash(null), 1400);
      triggerCelebration(activeGroup);
      nextQuestion(matchedWord.id);
    } else {
      const wrongGroup = activeGroup;
      const updatedTried = new Set(triedSet); updatedTried.add(wrongGroup);
      setTriedSet(updatedTried); triedSetRef.current = updatedTried;
      setFlash({ type: "wrong", group: wrongGroup }); setTimeout(() => setFlash(null), 900);
      // kalau ada kelompok lain yang sudah antre di urutan angkat tangan, langsung lanjut ke giliran mereka
      const next = buzzOrder.find((o) => o.group !== wrongGroup && !updatedTried.has(o.group));
      if (next) {
        clearRetryTimer();
        if (audioRef.current) audioRef.current.pause();
        setSpeaking(false);
        activeGroupRef.current = next.group;
        setActiveGroup(next.group);
      } else {
        releaseTurn(); scheduleRetry();
      }
    }
    setSelStart(null);
  }

  // FIX (UX): sama seperti Kunci Jawaban di Persiapan — kata yang sudah ketemu saat bermain
  // dulu diwarnai per-SEL (blok solid), berat di mata & kata diagonal jadi kelihatan patah-patah
  // (kotak demi kotak, bukan garis lurus). Sekarang tiap kata yang ketemu cukup digambar sebagai
  // satu garis tipis transparan dari sel pertama ke sel terakhir yang tadi diseleksi siswa —
  // otomatis lurus & mengikuti sudutnya sendiri, termasuk diagonal.
  const foundSegments = puzzle ? Object.values(foundMap).map(({ cells, color, revealed }, i) => {
    if (!cells || cells.length === 0) return null;
    const [r1, c1] = cells[0];
    const [r2, c2] = cells[cells.length - 1];
    return { id: i, x1: c1 + 0.5, y1: r1 + 0.5, x2: c2 + 0.5, y2: r2 + 0.5, color, revealed: !!revealed };
  }).filter(Boolean) : [];
  const leaderScore = Math.max(...Object.values(scores));
  const sortedGroups = [...GROUP_NAMES].sort((a, b) => scores[b] - scores[a]);
  // FIX (UX): ukuran huruf dulu relatif kecil dibanding jarak antar-huruf, apalagi setelah kotak
  // per-sel dihilangkan — papan jadi terasa renggang dan huruf terlihat kecil. Dinaikkan sedikit
  // supaya tetap nyaman dibaca dari proyektor.
  const cellFont = babakId === 1 ? (puzzle && puzzle.size > 16 ? 17 : 20) : (puzzle && puzzle.size > 16 ? 20 : 24);

  /* ---------- editing helpers (tahap persiapan) ---------- */
  function updateWord(id, wordId, field, value) {
    // FIX: kata jawaban dipaksa huruf besar begitu diketik, supaya konsisten dengan grid
    // (romaji ditulis kapital) dan tidak pernah gagal cocok dengan jawaban siswa gara-gara
    // guru tidak sengaja mengetik huruf kecil. Aman untuk hiragana karena .toUpperCase()
    // tidak mengubah karakter kana sama sekali.
    const finalValue = field === "letters" ? value.toUpperCase() : value;
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: materiData[id].map((w) => w.id === wordId ? { ...w, [field]: finalValue } : w) } };
    });
  }
  // SEMENTARA TANPA FIREBASE STORAGE: project belum di-upgrade ke paket Blaze (butuh kartu
  // debit/kredit), jadi audio disimpan sebagai data langsung (base64) di localStorage browser —
  // sama seperti sebelum fitur ini disambungkan ke Storage. Konsekuensinya: audio HANYA ada di
  // browser tempat ia diunggah, tidak ikut tersinkron ke device lain atau ke Riwayat Sesi lintas
  // device. Begitu project di-upgrade ke Blaze nanti, ini bisa disambungkan lagi ke Storage.
  function deleteAudioFile(url) {
    // Tidak ada file terpisah untuk dihapus (audio disimpan inline sebagai base64) — no-op.
  }
  function removeWord(id, wordId) {
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: materiData[id].filter((w) => w.id !== wordId) } };
    });
  }
  function addWord(id) {
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: [...materiData[id], { id: uid(), letters: "", clue: "", audioUrl: null }] } };
    });
  }
  // FITUR BARU: tambah banyak kosakata sekaligus dari teks yang ditempel guru, satu kosakata
  // per baris dengan format "kata/petunjuk". Baris tanpa "/" atau tanpa kata di depannya
  // dilewati (tidak dianggap error fatal — cukup tidak ikut ditambahkan), supaya satu baris
  // yang salah format tidak menggagalkan semua baris lain yang sudah benar.
  function addWordsBulk(id, text) {
    const newWords = text.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
      const sepIdx = line.indexOf("/");
      if (sepIdx === -1) return null;
      const letters = line.slice(0, sepIdx).trim().toUpperCase();
      const clue = line.slice(sepIdx + 1).trim();
      if (!letters) return null;
      return { id: uid(), letters, clue, audioUrl: null };
    }).filter(Boolean);
    if (newWords.length === 0) return 0;
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: [...materiData[id], ...newWords] } };
    });
    return newWords.length;
  }
  // FITUR BARU: sekarang audio dikompres otomatis dulu (lihat compressAudioFile di atas) sebelum
  // disimpan, jadi batas file ASLI dinaikkan dari 2MB jadi 8MB — tapi hasil AKHIR yang benar-benar
  // disimpan (baik hasil kompresi, atau file asli kalau kompresinya gagal/tidak didukung browser)
  // tetap wajib di bawah 2MB, supaya aman untuk kuota localStorage seperti sebelumnya.
  function uploadAudio(id, wordId, file) {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      setAudioUploadError((e) => ({ ...e, [wordId]: "File audio maksimal 8MB." }));
      return;
    }
    setAudioUploadError((e) => { const n = { ...e }; delete n[wordId]; return n; });
    setUploadingAudio((u) => ({ ...u, [wordId]: true }));

    const finish = (dataUrl) => {
      updateWord(id, wordId, "audioUrl", dataUrl);
      setUploadingAudio((u) => { const n = { ...u }; delete n[wordId]; return n; });
    };
    const fail = (msg) => {
      setAudioUploadError((e) => ({ ...e, [wordId]: msg }));
      setUploadingAudio((u) => { const n = { ...u }; delete n[wordId]; return n; });
    };
    function readOriginalAsIs() {
      if (file.size > 2 * 1024 * 1024) {
        fail("File audio maksimal 2MB — browser ini tidak mendukung kompresi otomatis (atau hasil kompresinya masih terlalu besar), jadi filenya dipakai apa adanya.");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => finish(reader.result);
      reader.onerror = () => fail("Gagal membaca file audio, coba lagi.");
      reader.readAsDataURL(file);
    }

    // FIX: compressAudioFile MEMUTAR ULANG audionya secara real-time untuk merekam versi
    // terkompresi — jadi proses ini makan waktu sama persis dengan durasi audio aslinya (audio
    // 8 detik ≈ 8 detik proses), bukan instan seperti kompresi gambar. Ikon ⏳ di tombol unggah
    // (uploadingAudio[w.id]) tetap menyala sepanjang proses ini supaya guru tahu masih berjalan.
    compressAudioFile(file).then((compressed) => {
      if (compressed && compressed.size > 0 && compressed.size < file.size && compressed.size <= 2 * 1024 * 1024) {
        finish(compressed.dataUrl);
      } else {
        readOriginalAsIs();
      }
    });
  }

  const canStart = [1, 2, 3].some((id) => (dataByMateri[selectedMateri]?.[id] || []).some((w) => w.letters.trim()));

  /* ---------------- Reusable game bits ---------------- */
  // FIX: buildPuzzle() bisa mengembalikan null karena dua alasan berbeda — (a) memang belum
  // ada kosakata valid di babak ini, atau (b) kosakata ADA tapi gagal disusun ke grid (mis.
  // terlalu banyak/panjang untuk ukuran papan). Sebelumnya kedua kasus ini tampil sama persis
  // ("Belum ada kosakata"), padahal (b) butuh tindakan berbeda dari guru (kurangi/perpendek kata).
  const hasWordsForBabak = babak.words.some((w) => w.letters.trim());

  // Begitu semua kosakata di babak ini sudah terjawab/dilewati (currentWord jadi null), hitung
  // mundur 5 detik lalu otomatis pindah ke babak berikutnya lewat switchBabak() — guru tidak perlu
  // klik tab "Babak 2" secara manual tiap kali selesai. Kalau ini sudah babak terakhir (3), atau
  // babak berikutnya belum ada kosakatanya sama sekali, tidak ada hitung mundur — guru tetap harus
  // pindah manual atau isi dulu kosakatanya.
  useEffect(() => {
    const babakDone = puzzle && !currentWord && hasWordsForBabak;
    const nextBabakId = babakId + 1;
    const nextHasWords = babakDone && nextBabakId <= 3 && (dataByMateri[selectedMateri]?.[nextBabakId] || []).some((w) => w.letters.trim());
    if (!nextHasWords) { setAutoNext(null); autoNextIntervalRef.current = null; return; }
    let sec = 5;
    setAutoNext(sec);
    const interval = setInterval(() => {
      sec -= 1;
      if (sec <= 0) { clearInterval(interval); autoNextIntervalRef.current = null; switchBabak(nextBabakId); }
      else setAutoNext(sec);
    }, 1000);
    autoNextIntervalRef.current = interval;
    return () => clearInterval(interval);
  }, [currentWord, puzzle, babakId]);

  // Guru bisa membatalkan hitung mundurnya kapan saja (mis. masih mau bahas babak ini dulu di kelas)
  // — tidak akan otomatis mulai lagi sampai status "selesai" babak ini berubah (mis. sempat pindah
  // babak lalu balik lagi ke sini).
  function cancelAutoNext() {
    if (autoNextIntervalRef.current) clearInterval(autoNextIntervalRef.current);
    autoNextIntervalRef.current = null;
    setAutoNext(null);
  }

  useEffect(() => {
    const el = projectorGridAreaRef.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const measure = () => {
      const w = el.clientWidth, h = el.clientHeight;
      if (w < 10 || h < 10) return; // elemen belum/tidak terlihat (mis. lagi di Panel Kontrol biasa) — abaikan
      setProjectorBoardPx(Math.max(160, Math.floor(Math.min(w, h)) - 4));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [projectorMode, stage]);
  // FIX (bug): Grid, Scoreboard, BuzzIndicator, dan ControlPanel di bawah ini tadinya
  // ditulis sebagai `const Grid = (...) => (...)` — komponen React yang didefinisikan
  // ULANG di setiap render TebakCariKataGame. Karena definisinya baru setiap render, React
  // menganggap `<Grid big />` sebagai TIPE komponen yang berbeda dari render sebelumnya (meski
  // isinya identik) — jadi seluruh papan/skor/panel dibongkar total lalu dipasang ulang dari nol
  // setiap kali ADA state apa pun yang berubah, termasuk klik tombol yang sama sekali tidak
  // berhubungan dengan papan (ganti mode, buka panel, dst). Bongkar-pasang inilah yang terlihat
  // sebagai "kedipan", dan juga memicu ulang animasi masuk (cardRise) tiap kali.
  // Sekarang ditulis sebagai FUNGSI BIASA yang dipanggil langsung (`renderGrid({ big: true })`),
  // bukan dipakai sebagai tag JSX (`<Grid big />`). Dengan begitu React melihatnya sebagai bagian
  // biasa dari pohon elemen induknya — tidak dianggap komponen terpisah — sehingga hanya
  // memperbarui bagian yang benar-benar berubah, tanpa bongkar-pasang total.
  function renderGrid({ big, sizePx, fontPx } = {}) { return !puzzle ? (
    <div style={{ padding: 24, color: t.dim, fontSize: 14 }}>
      {hasWordsForBabak
        ? `Papan gagal disusun dari kosakata Babak ${babakId} ini — coba kurangi jumlah kata atau perpendek beberapa kata, lalu buka layar Persiapan dan klik "Acak Ulang Posisi".`
        : "Belum ada kosakata untuk babak ini."}
    </div>
  ) : (
    <div style={{
      position: "relative", background: t.panel, padding: 10, borderRadius: 14,
      // FIX: kalau `sizePx` dikirim (dipakai Mode Proyektor layar besar, lihat penjelasan di bawah),
      // lebar papan dipatok dalam PIKSEL PASTI — bukan "100%"/maxWidth yang besarnya bisa ambigu
      // tergantung induk flex/grid-nya. Karena tiap sel papan persegi (aspectRatio 1/1) dan
      // lebar-tinggi papan otomatis mengikuti lebar ini, mematok lebar = mematok tinggi juga,
      // sehingga papan DIJAMIN pas persis ke sisa ruang yang sudah diukur, tidak pernah meluber
      // lagi walau puzzle-nya besar.
      width: sizePx ? sizePx : "100%", maxWidth: sizePx ? sizePx : (big ? 760 : 620),
      // FIX (bug): di Panel Kontrol (bukan Mode Proyektor penuh, jadi TANPA sizePx terukur),
      // papan cuma dibatasi LEBARNYA (maxWidth) — tingginya dibiarkan otomatis mengikuti lebar
      // karena papannya persegi. Kalau ruang vertikal yang tersisa di layar guru lebih sempit
      // dari lebar itu (layar pendek/laptop kecil, atau papan babak ini memang besar), tingginya
      // jadi lebih besar dari ruang yang tersedia dan papan meluber ke ATAS menutupi baris
      // toolbar (termasuk tombol "Mode Proyektor"/"Layar Proyektor") — kadang muncul kadang
      // tidak tergantung ukuran layar & babak yang sedang dimainkan. `maxHeight: "100%"` +
      // `aspectRatio: "1/1"` di sini memaksa browser menyusutkan papan (lebar DAN tinggi
      // bersamaan, tetap persegi) mengikuti mana yang lebih sempit dari ruang induknya, sama
      // seperti prinsip `sizePx` di atas tapi dihitung otomatis oleh CSS tanpa perlu diukur
      // manual lewat JS.
      maxHeight: sizePx ? sizePx : "100%", aspectRatio: sizePx ? undefined : "1 / 1",
      margin: big ? "0 auto" : undefined, boxSizing: "border-box", flexShrink: 0,
      // FIX (UX): papan dulu diredupkan (opacity huruf 0.55) selama belum ada kelompok yang
      // mengangkat tangan — maksudnya menandakan "belum boleh diklik", tapi ini malah bikin siswa
      // susah membaca papan justru pada saat mereka paling butuh mencari kata (waktu audio/petunjuk
      // baru diputar). Sekarang papan SELALU terlihat jelas & tidak pernah pudar; sebagai gantinya
      // giliran kelompok ditandai dengan bingkai bersinar mengikuti warna kelompok yang sedang
      // pegang giliran menjawab (activeGroup) — begitu belum ada yang menang giliran, bingkai ini
      // tidak muncul sama sekali.
      boxShadow: activeGroup ? `0 0 0 3px ${groupColor(activeGroup)}, 0 0 22px 4px ${groupColor(activeGroup)}99` : "none",
      transition: "box-shadow .25s ease",
      animation: "cardRise .3s ease",
    }}>
      <svg viewBox={`0 0 ${puzzle.size} ${puzzle.size}`} style={{ position: "absolute", top: 10, left: 10, right: 10, bottom: 10, pointerEvents: "none" }}>
        {foundSegments.map((seg) => (
          <line key={seg.id} x1={seg.x1} y1={seg.y1} x2={seg.x2} y2={seg.y2}
            stroke={seg.revealed ? REVEALED_COLOR : seg.color} strokeWidth={0.62} strokeLinecap="round"
            strokeDasharray={seg.revealed ? "0.16 0.14" : undefined} opacity={seg.revealed ? 0.8 : 0.6} />
        ))}
      </svg>
      {/* FIX (UX): sel papan dulu masing-masing digambar sebagai kotak solid berwarna (t.panel2)
          dengan celah antar-kotak. Begitu ada highlight jawaban (garis/pil SVG) yang melintang
          diagonal di atasnya, sudut-sudut kotak & celah antar-kotak tetap kelihatan mengintip di
          balik highlight, jadi terlihat kotak-kotak/patah-patah — terutama di kata diagonal.
          Sekarang latar per-sel dihilangkan (transparan, huruf langsung duduk di atas panel papan
          yang polos, sama seperti pratinjau Kunci Jawaban di Persiapan) supaya highlight jawaban
          terlihat mulus. Sel yang sedang dipilih (isSelStart) ditandai bulat, bukan kotak, supaya
          tetap tidak menambah kesan "kotak-kotak" pada papan. */}
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${puzzle.size}, minmax(0, 1fr))`, gap: big ? 3 : 2, position: "relative", zIndex: 1 }}>
        {puzzle.grid.map((row, r) => row.map((letter, c) => {
          const key = cellKey(r, c);
          const isSelStart = selStart && selStart[0] === r && selStart[1] === c;
          return (
            <button key={key} className="cell-btn" onClick={() => handleCellClick(r, c)} disabled={!currentWord || activeGroup === null}
              style={{
                aspectRatio: "1 / 1", border: "none", borderRadius: "50%", cursor: currentWord && activeGroup !== null ? "pointer" : "default",
                background: isSelStart ? "#F4B740" : "transparent", color: isSelStart ? "#101B34" : t.cellText,
                fontWeight: 700, fontSize: fontPx || (big ? cellFont + 4 : cellFont), display: "flex", alignItems: "center", justifyContent: "center",
                minWidth: 0, width: "100%", padding: 0,
              }}>{letter}</button>
          );
        }))}
      </div>
    </div>
  ); }

  // FIX (UX): label "Kelompok X" bikin baris skor jadi panjang & terasa sesak, apalagi
  // berdampingan dengan tombol +/- koreksi manual. Disingkat jadi "KX" — konsisten dengan gaya
  // tombol buzzer (K1-K6) yang sudah dipakai di panel yang sama — supaya lebih rapi, dan ukuran
  // teks/skor dinaikkan sedikit (hanya untuk tampilan biasa di sidebar, bukan versi "big" di Mode
  // Proyektor yang memang sudah besar & sengaja tetap pakai "Kelompok X" lengkap untuk siswa).
  function renderScoreboard({ big, compact, highlight, editable } = {}) { return (
    <div style={{ background: compact ? "transparent" : t.panel, borderRadius: 14, padding: compact ? 0 : big ? 22 : 18 }}>
      {!compact && <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: big ? 15 : 13, color: t.dim, marginBottom: 10 }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>🏆</span> Papan Skor{editable && <span style={{ fontSize: 14, color: t.faint, fontWeight: 400 }}> — klik +/- untuk koreksi manual</span>}</div>}
      <div style={{ display: "flex", flexDirection: big ? "row" : "column", gap: big ? 12 : 8, flexWrap: "wrap" }}>
        {sortedGroups.map((g) => (
          <div key={g} style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
            background: g === highlight ? GROUP_COLORS[g - 1] : t.panel2, borderRadius: 10, padding: big ? "14px 20px" : compact ? "6px 10px" : "11px 14px",
            flex: big ? "1 1 140px" : undefined, boxShadow: activeGroup === g && !compact ? `0 0 0 2px ${GROUP_COLORS[g - 1]}` : "none",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: compact ? 9 : 13, height: compact ? 9 : 13, borderRadius: 4, background: GROUP_COLORS[g - 1], display: "inline-block" }} />
              <span style={{ fontSize: big ? 16 : compact ? 12.5 : 16, fontWeight: 700, color: g === highlight ? "#101B34" : t.text }}>{big ? `Kelompok ${g}` : `K${g}`}</span>
              {scores[g] === leaderScore && leaderScore > 0 && <span style={{ fontSize: 16, lineHeight: 1, color: g === highlight ? "#101B34" : "#F4B740" }}>👑</span>}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {/* FITUR BARU: koreksi skor manual — cuma dirender kalau editable (dipanggil dari
                  Panel Kontrol guru saja; TIDAK pernah muncul di Mode Proyektor/tampilan siswa),
                  supaya siswa tidak melihat kontrol admin ini di layar bersama kelas. Tiap klik
                  menambah/mengurangi sebesar poin babak yang sedang berjalan. */}
              {editable && (
                <button onClick={() => adjustScore(g, -babak.point)} title={`Kurangi ${babak.point} poin`} style={{ width: 24, height: 24, borderRadius: 6, border: "none", background: "rgba(239,91,91,.18)", color: "#EF5B5B", fontSize: 15, fontWeight: 700, lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
              )}
              <span className={`sgt${g === bumpedGroup ? " score-bump" : ""}`} style={{ fontWeight: 700, fontSize: big ? 22 : compact ? 13 : 18, color: g === highlight ? "#101B34" : t.text, minWidth: big ? undefined : 18, textAlign: "center" }}>{scores[g]}</span>
              {editable && (
                <button onClick={() => adjustScore(g, babak.point)} title={`Tambah ${babak.point} poin`} style={{ width: 24, height: 24, borderRadius: 6, border: "none", background: "rgba(63,191,173,.18)", color: "#3FBFAD", fontSize: 15, fontWeight: 700, lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  ); }

  // Overlay teks petunjuk besar di tengah layar — HANYA muncul saat mode audio "Nonaktif",
  // tampil 3 detik lalu hilang sendiri (lihat playClue & hintOverlayTimerRef). Di mode "Audio"
  // overlay ini tidak pernah dipakai sama sekali, supaya benar-benar cuma suara yang diputar.
  function renderHintOverlay() {
    if (!hintOverlayVisible || audioMode !== "off" || !currentWord) return null;
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 90, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, boxSizing: "border-box", pointerEvents: "none" }}>
        <div style={{ background: t.panel, color: t.text, borderRadius: 20, padding: "36px 48px", maxWidth: "82%", textAlign: "center", boxShadow: "0 12px 44px rgba(0,0,0,.35)", fontSize: "clamp(20px, 3.4vw, 34px)", fontWeight: 700, lineHeight: 1.45 }}>
          "{currentWord.clue}"
        </div>
      </div>
    );
  }

  function renderBuzzIndicator({ big } = {}) { return (
    <div style={{ textAlign: "center", padding: big ? "18px 0" : "10px 0", borderRadius: 14, background: activeGroup ? groupColor(activeGroup) : t.panel, color: activeGroup ? "#101B34" : t.dim, fontWeight: 700, fontSize: big ? 22 : 14, transition: "background .2s ease" }}>
      {activeGroup === "guru" ? "🧑‍🏫 Guru sedang menjawab/mengoreksi langsung…" : activeGroup ? `Kelompok ${activeGroup} mengangkat tangan duluan!` : "Menunggu ada yang mengangkat tangan…"}
    </div>
  ); }

  function renderControlPanel({ hideScoreboard, hideBuzzOrder } = {}) { return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {puzzle && (
        <div style={{ background: t.panel, borderRadius: 14, padding: "12px 18px", boxShadow: t.shadowSm, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ fontSize: 14, color: t.dim }}>
            {currentWord ? (audioMode === "bebas" ? `Sisa kosakata: ${queue.length} dari ${totalWords}` : `Soal ${foundCount + 1} dari ${totalWords}`) : "Semua soal selesai 🎉"}
            {selStart && currentWord && <span style={{ color: "#F4B740" }}> — klik huruf terakhir kata</span>}
          </div>
          {/* FIX (UX): status "Soal X dari Y" & pesan benar/salah/jawaban tadinya ditaruh MELAYANG
              di atas papan (pakai animasi pulseFlash yang muncul-hilang tiap soal). Selain menutupi
              papan, elemen ini dulu ada di dalam wrapper yang key-nya berubah tiap ganti soal —
              jadi React membongkar-pasang ULANG SELURUH PAPAN tiap kali soal benar/dilewati, yang
              terlihat sebagai "kedipan" mengganggu. Sekarang statusnya dipindah ke sini (panel
              guru), ditampilkan sebagai teks biasa tanpa animasi — papan di tengah jadi benar-benar
              cuma papan, tidak ada elemen lain yang bongkar-pasang atau menutupinya. */}
          {/* FIX: banner "Jawaban: ..." yang muncul di sini tiap kali "Lewati soal ini" ditekan
              dianggap mengganggu, jadi khusus tipe "revealed" ini sengaja tidak ditampilkan lagi —
              banner Benar!/Belum tepat untuk jawaban dari siswa tetap tampil seperti biasa. */}
          {flash && flash.type !== "revealed" && (
            <div style={{ fontSize: 14, fontWeight: 700, padding: "4px 10px", borderRadius: 8, background: flash.type === "correct" ? "#3FBFAD" : "#EF5B5B", color: "#0D1730" }}>
              {flash.type === "correct" ? `Benar! Kelompok ${flash.group} +${babak.point} poin` : "Belum tepat — giliran dibuka lagi"}
            </div>
          )}
        </div>
      )}
      <div style={{ background: t.panel, borderRadius: 14, padding: 18, boxShadow: t.shadowSm }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontSize: 14, color: t.dim }}>Petunjuk soal</div>
          <div style={{ display: "flex", background: t.panel2, borderRadius: 8, padding: 3, flexWrap: "wrap" }}>
            <button onClick={() => setAudioMode("guru")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 9px", borderRadius: 6, border: "none", cursor: "pointer", background: audioMode === "guru" ? "#3FBFAD" : "transparent", color: audioMode === "guru" ? "#0D1730" : t.text, fontSize: 14, fontWeight: 600 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>🔊</span> Audio</button>
            <button onClick={() => setAudioMode("off")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 9px", borderRadius: 6, border: "none", cursor: "pointer", background: audioMode === "off" ? "#3FBFAD" : "transparent", color: audioMode === "off" ? "#0D1730" : t.text, fontSize: 14, fontWeight: 600 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>📝</span> Teks</button>
            {/* FITUR BARU: Mode ke-3, "Guru Bebas" — guru membacakan petunjuknya sendiri secara
                lisan dari catatannya sendiri (tidak ada apa pun yang ditampilkan/diputar sistem).
                Cocok untuk guru yang tidak memakai 2 layar/perangkat terpisah. */}
            <button onClick={() => setAudioMode("bebas")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 9px", borderRadius: 6, border: "none", cursor: "pointer", background: audioMode === "bebas" ? "#3FBFAD" : "transparent", color: audioMode === "bebas" ? "#0D1730" : t.text, fontSize: 14, fontWeight: 600 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>🎙️</span> Bebas</button>
          </div>
        </div>

        {/* FITUR BARU: durasi tampil mode Teks dulu dipatok 3 detik tetap, sekarang guru bisa
            atur sendiri (1–30 detik). Berlaku untuk seluruh kata sepanjang sesi ini, bukan per-kata. */}
        {audioMode === "off" && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 14, color: t.dim }}>
            <span>Durasi tampil:</span>
            <input type="number" min={1} max={30} value={teksDurasiDetik}
              onChange={(e) => setTeksDurasiDetik(Math.min(30, Math.max(1, parseInt(e.target.value, 10) || 1)))}
              style={{ width: 54, padding: "5px 7px", borderRadius: 6, border: `1px solid ${t.border}`, background: t.bg, color: t.text, fontSize: 14, boxSizing: "border-box" }} />
            <span>detik</span>
          </div>
        )}

        {currentWord && (
          <button onClick={playClue} className="grp-btn" style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "#F4B740", color: "#101B34", border: "none", borderRadius: 10, padding: "12px 16px", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
            {audioMode === "guru" ? <span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>🔊</span>
              : audioMode === "bebas" ? <span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>🎙️</span>
              : <span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>🔇</span>}
            {audioMode === "guru" ? (speaking ? "Memutar…" : "Putar Audio")
              : audioMode === "bebas" ? "Siap — Boleh Angkat Tangan"
              : "Tampilkan Teks"}
          </button>
        )}
        {/* Sengaja TIDAK ada teks petunjuk permanen di sini, di ketiga mode:
            - Mode Audio: hanya suara yang diputar, tidak ada teks apa pun yang tertinggal di layar.
            - Mode Teks: teksnya tampil sebagai overlay besar di tengah layar selama durasi yang
              diatur guru (lihat hintOverlayVisible), lalu hilang sendiri — bukan teks statis di sini.
            - Mode Guru Bebas: tidak ada teks apa pun ditampilkan sistem sama sekali — guru
              membacakan dari catatannya sendiri. */}
        {audioMode === "off" && clueRevealed && !hintOverlayVisible && currentWord && (
          <div style={{ marginTop: 10, fontSize: 14, color: t.faint }}>Teks petunjuk sudah ditampilkan ({teksDurasiDetik} detik) di tengah layar. Klik lagi tombol di atas untuk menampilkannya ulang.</div>
        )}
        {audioMode === "bebas" && <div style={{ marginTop: 10, fontSize: 14, color: t.faint }}>Bacakan petunjuk kata mana pun sesuka Anda (urutan bebas) — jawaban kelompok diterima kalau cocok dengan salah satu kosakata babak ini yang belum ketemu.</div>}
      </div>

      <div style={{ background: t.panel, borderRadius: 14, padding: 18, boxShadow: t.shadowSm }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8, flexWrap: "wrap" }}>
          <div style={{ fontSize: 14, color: t.dim }}>{mode === "digital" ? "Buzzer kelompok" : "Tunjuk kelompok penjawab"}</div>
          {/* FITUR BARU: Mode Guru — satu saklar admin, gantikan ikon override "▶" kecil per
              kelompok yang sebelumnya cuma bisa menyela kelompok yang SEDANG aktif. Sekarang, saat
              menyala: klik tombol K1–K6 di bawah LANGSUNG memaksa kelompok itu jadi giliran aktif —
              termasuk kelompok yang gilirannya SUDAH LEWAT/dianggap salah di ronde ini (bukan cuma
              yang masih menunggu), pas buat "reka ulang" kalau guru salah eksekusi. Koreksi skor
              manual & "Guru menjawab langsung" juga cuma muncul selama saklar ini menyala. */}
          <button onClick={() => setGuruModeOn((v) => !v)} style={{ display: "flex", alignItems: "center", gap: 6, background: guruModeOn ? GURU_COLOR : t.panel2, color: guruModeOn ? "#fff" : t.dim, border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14, fontWeight: 700 }}>
            <span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>🧑‍🏫</span> Mode Guru: {guruModeOn ? "Aktif" : "Nonaktif"}
          </button>
        </div>
        {guruModeOn && (
          <div style={{ marginBottom: 10, fontSize: 14, color: "#fff", background: GURU_COLOR, borderRadius: 8, padding: "8px 10px", lineHeight: 1.5 }}>
            Mode Guru aktif — klik kelompok mana pun di bawah untuk langsung menjadikannya giliran aktif (walau gilirannya sudah lewat), dan skor bisa dikoreksi manual. Matikan lagi kalau sudah selesai supaya permainan berjalan normal.
          </div>
        )}
        {!guruModeOn && currentWord && !clueRevealed && (
          <div style={{ marginBottom: 10, fontSize: 14, color: "#F4B740", background: "rgba(244,183,64,.12)", borderRadius: 8, padding: "8px 10px" }}>Tombol masih terkunci — klik "{audioMode === "guru" ? "Putar Audio" : audioMode === "bebas" ? "Siap — Boleh Angkat Tangan" : "Tampilkan Teks"}" di panel kanan dulu supaya kelompok bisa angkat tangan.</div>
        )}
        {/* FIX (fitur diminta): dulu di mode Manual, guru cuma bisa memilih SATU kelompok
            (klik langsung setActiveGroup), dan begitu satu kelompok aktif, tombol kelompok
            lain otomatis terkunci sampai giliran itu selesai — jadi kalau guru sudah tahu
            urutan mana yang mengangkat tangan duluan di kelas (mis. 4, lalu 2, lalu 1), guru
            harus menunggu dan mengklik ulang satu-satu setiap kali kelompok sebelumnya salah.
            Sekarang tombol kelompok di KEDUA mode memakai fungsi antrean yang sama (`buzz`)
            yang tadinya cuma dipakai mode Digital: klik kelompok manapun akan menambahkannya
            ke antrean; yang PERTAMA diklik langsung jadi giliran aktif, klik-klik berikutnya
            tetap bisa dilakukan sambil kelompok pertama masih menjawab, dan begitu kelompok
            yang aktif salah, giliran otomatis lanjut ke kelompok berikutnya sesuai URUTAN
            KLIK guru tadi — persis seperti antrean di mode Digital. */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
          {GROUP_NAMES.map((g) => {
            const isActive = activeGroup === g;
            const eligible = isEligible(g);
            const buzzPos = buzzOrder.findIndex((o) => o.group === g);
            const alreadyBuzzed = buzzPos >= 0;
            // FITUR BARU: kelompok mana pun yang SUDAH ADA DI ANTREAN (aktif ATAU masih
            // menunggu giliran) selalu boleh diklik lagi — supaya klik kedua pada tombol manapun
            // yang sudah antre bisa membatalkan posisinya (lihat cancelActiveGroup), bukan cuma
            // tombol yang kebetulan sedang aktif.
            // BUGFIX: dulu pengecualian "boleh diklik lagi" ini cuma berlaku untuk `isActive`
            // (kelompok pertama di antrean) — kelompok ke-2/ke-3 dst yang masih menunggu giliran
            // TETAP terkunci (disabled, terlihat abu-abu di layar) walau tombol "batalkan" untuk
            // mereka seharusnya juga tersedia. Sekarang syaratnya `alreadyBuzzed` (siapa pun yang
            // sudah masuk antrean, bukan cuma yang sedang aktif) — dan onClick di bawah juga
            // disesuaikan jadi `alreadyBuzzed ? cancelActiveGroup(g) : buzz(g)`.
            const locked = guruModeOn ? !currentWord : (!currentWord || !clueRevealed || (!alreadyBuzzed && !eligible));
            return (
              <button key={g} className="grp-btn" onClick={() => guruModeOn ? forceSetActiveGroup(g) : (alreadyBuzzed ? cancelActiveGroup(g) : buzz(g))} disabled={locked}
                style={{ position: "relative", padding: "12px 0", borderRadius: 10, border: guruModeOn ? `1.5px solid ${GURU_COLOR}` : "none", cursor: locked ? "default" : "pointer", background: isActive ? GROUP_COLORS[g - 1] : t.panel2, color: isActive ? "#0D1730" : t.text, fontWeight: 700, fontSize: 14, opacity: locked && !isActive ? 0.4 : 1, boxShadow: isActive ? `0 0 0 2px ${GROUP_COLORS[g - 1]}` : "none" }}>
                K{g}
                {joinedGroups[g] && <span title="Sudah join lewat QR" style={{ position: "absolute", top: 4, right: 4, width: 7, height: 7, borderRadius: "50%", background: "#3FBFAD" }} />}
                {alreadyBuzzed && <span style={{ position: "absolute", top: -6, left: -6, width: 26, height: 26, borderRadius: "50%", background: "#101B34", color: "#F4B740", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{buzzPos + 1}</span>}
              </button>
            );
          })}
        </div>
        {/* FITUR BARU: "Guru" — pseudo-kelompok, dipilih persis seperti K1–K6, tapi guru sendiri
            yang klik huruf jawabannya di papan. Dipakai untuk mengungkap/menjawab soal yang tidak
            bisa dijawab murid TANPA memberi poin ke kelompok manapun (menggantikan tombol "Lewati
            soal" dengan cara yang lebih langsung), atau memperbaiki kesalahan eksekusi lain. Cuma
            muncul selama Mode Guru menyala, konsisten dengan kontrol admin lainnya. */}
        {guruModeOn && currentWord && (
          <button onClick={activateGuru} title="Guru menjawab/mengungkap langsung di papan — tidak ada kelompok yang dapat poin"
            style={{ marginTop: 8, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "10px 0", borderRadius: 10, border: `1px dashed ${GURU_COLOR}`, cursor: "pointer", background: activeGroup === "guru" ? GURU_COLOR : "transparent", color: activeGroup === "guru" ? "#fff" : t.dim, fontWeight: 700, fontSize: 14 }}>
            <span style={{ fontSize: 15, lineHeight: 1, color: "inherit" }}>🧑‍🏫</span> Guru menjawab langsung
          </button>
        )}
        {!hideBuzzOrder && buzzOrder.length > 0 && (
          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 4 }}>
            <div style={{ fontSize: 14, color: t.faint }}>Urutan angkat tangan:</div>
            {buzzOrder.map((o, i) => (
              <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
                <span style={{ width: 26, height: 26, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                <span style={{ color: t.text, flex: 1 }}>Kelompok {o.group}{o.group === activeGroup ? " — sedang menjawab" : ""}</span>
                <button onClick={() => skipGroupFromQueue(o.group)} title={`Lewati Kelompok ${o.group} (angkat tangan tapi tidak tahu jawabannya)`} style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 3, display: "flex", alignItems: "center" }}><span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>⏭</span></button>
              </div>
            ))}
          </div>
        )}
        {activeGroup && <div style={{ marginTop: 10, fontSize: 14, color: t.dim }}>{activeGroup === "guru" ? "Guru pegang giliran" : `${groupLabel(activeGroup)} pegang giliran`} — klik huruf awal &amp; akhir kata di papan.</div>}
        <div style={{ marginTop: 10, fontSize: 14, color: t.faint }}>{babakId === 1 ? "Babak 1: kelompok yang sudah mencoba tidak bisa menjawab lagi untuk soal ini." : "Kelompok yang sudah mencoba boleh menjawab lagi kalau tidak ada kelompok lain yang mengangkat tangan."}</div>
        {/* FITUR DIGANTI: picker teks "Lewati salah satu kosakata…" untuk mode Guru Bebas dihapus —
            digantikan tombol "🧑‍🏫 Guru menjawab langsung" di atas (klik langsung di papan,
            konsisten di semua mode, bukan cuma Guru Bebas). Tombol "Lewati soal ini" (di bawah)
            tetap khusus mode Audio/Teks yang memang selalu tahu 1 soal aktif tertentu. */}
        {currentWord && audioMode !== "bebas" && <button onClick={() => skipWord()} style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px solid ${t.panel2}`, color: t.dim, borderRadius: 8, padding: "8px 12px", fontSize: 14, cursor: "pointer", width: "100%", justifyContent: "center" }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>⏭</span> Lewati soal ini</button>}
      </div>

      {!hideScoreboard && renderScoreboard({ editable: guruModeOn })}
    </div>
  ); }


  /* ---------------- Modal: Simpan & Jeda (nama kelas) ---------------- */
  // FIX (bug): SaveNameModal & HistoryModal ini dulu ditulis sebagai `const X = () => (...)` —
  // "komponen" yang didefinisikan ULANG setiap kali TebakCariKataGame render. Sama persis dengan
  // penyebab bug kedipan papan yang sudah diperbaiki sebelumnya (lihat renderGrid dkk. di atas),
  // tapi dampaknya di sini lebih terasa: SaveNameModal punya kotak isian teks (nama kelas). Kalau
  // ada data real-time yang masuk (mis. siswa baru join lewat QR) SAAT guru sedang mengetik nama
  // kelas, React membongkar-pasang ulang seluruh modal termasuk elemen <input>-nya — inputnya
  // jadi KEHILANGAN FOKUS di tengah ketikan, guru harus klik ulang tiap beberapa huruf. Sekarang
  // ditulis sebagai fungsi biasa yang dipanggil langsung, sama seperti renderGrid dkk., supaya
  // React tidak menganggapnya komponen baru dan input tidak pernah dibongkar-pasang saat diketik.
  function renderSaveNameModal() { return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70 }} onClick={() => !savingSession && setSaveNameOpen(false)}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(360px, 90vw)", background: t.modalBg, borderRadius: 20, padding: 24, boxShadow: "0 20px 60px rgba(0,0,0,.4)" }}>
        <div className="sgt" style={{ fontSize: 17, fontWeight: 700, color: t.text, marginBottom: 6 }}>Simpan & Jeda Sesi</div>
        <div style={{ fontSize: 14, color: t.dim, marginBottom: 14, lineHeight: 1.5 }}>Progres, skor, dan babak yang sedang berjalan akan tersimpan di Riwayat — bisa dilanjutkan nanti dari device mana pun. Audio soal tidak ikut tersimpan lintas device (mode tanpa Storage) — perlu diunggah ulang di device tempat melanjutkan.</div>
        <label style={{ fontSize: 14, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 }}>Nama kelas</label>
        <input autoFocus value={saveNameInput} onChange={(e) => setSaveNameInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") confirmSaveSession(); }}
          placeholder="mis. XI IPA 1" style={{ width: "100%", marginTop: 6, marginBottom: 16, padding: "10px 12px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 14, boxSizing: "border-box" }} />
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={() => setSaveNameOpen(false)} disabled={savingSession} style={{ background: "transparent", border: "none", color: t.dim, padding: "10px 14px", borderRadius: 8, cursor: "pointer", fontSize: 14 }}>Batal</button>
          <button onClick={confirmSaveSession} disabled={!saveNameInput.trim() || savingSession} style={{ background: saveNameInput.trim() ? "#F4B740" : t.panel2, color: saveNameInput.trim() ? "#101B34" : t.faint, border: "none", padding: "10px 16px", borderRadius: 8, cursor: saveNameInput.trim() ? "pointer" : "default", fontSize: 14, fontWeight: 700 }}>{savingSession ? "Menyimpan…" : "Simpan & Jeda"}</button>
        </div>
      </div>
    </div>
  ); }

  /* ---------------- Modal: Riwayat Sesi ---------------- */
  function renderHistoryModal() { return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 20 }} onClick={() => setHistoryOpen(false)}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(520px, 92vw)", maxHeight: "80vh", overflowY: "auto", background: t.modalBg, borderRadius: 20, padding: 24, boxShadow: "0 20px 60px rgba(0,0,0,.4)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div className="sgt" style={{ fontSize: 18, fontWeight: 700, color: t.text }}>📜 Riwayat Sesi</div>
          <button onClick={() => setHistoryOpen(false)} style={{ background: "none", border: "none", color: t.dim, cursor: "pointer" }}><span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>✕</span></button>
        </div>
        <div style={{ fontSize: 14, color: t.dim, marginBottom: 14 }}>Sesi kelas yang dijeda, tersimpan di Firebase — muncul dari device manapun. Maksimal 10 sesi terbaru.</div>
        {!historyLoaded ? (
          <div style={{ padding: "20px 0", textAlign: "center", color: t.faint, fontSize: 14 }}>Memuat riwayat…</div>
        ) : historyList.length === 0 ? (
          <div style={{ padding: "20px 0", textAlign: "center", color: t.faint, fontSize: 14 }}>Belum ada sesi yang dijeda.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {historyList.map((it) => (
              <div key={it.id} className="list-row" style={{ background: t.panel, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 160 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: t.text }}>{it.className || "(tanpa nama)"}</div>
                  <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>{it.materi} · Babak {it.babakId} · {formatSavedAt(it.savedAt)}</div>
                </div>
                <button onClick={() => resumeSession(it)} style={{ background: "#F4B740", border: "none", color: "#101B34", padding: "8px 12px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 700 }}>Lanjutkan</button>
                <button onClick={() => deleteHistoryItem(it.id)} title="Hapus sesi ini" className="row-del" style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 8, borderRadius: 8 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  ); }


  /* ---------------- Modal: Konfirmasi Kembali ke Persiapan ---------------- */
  // FIX (bug, dedup): sama seperti SaveNameModal/HistoryModal — dulu ditulis sebagai fungsi yang
  // dipakai lewat tag JSX (`<BackConfirmModal />`), yang berarti tetap dianggap "komponen baru"
  // tiap render walau ditulis pakai kata kunci `function`. Modal ini memang tidak punya kotak
  // isian (jadi tidak sampai kehilangan fokus ketikan), tapi tetap dirapikan ke pola yang sama
  // (dipanggil langsung sebagai fungsi) supaya konsisten dan tidak ikut membongkar-pasang ulang
  // tanpa perlu tiap kali ada data real-time yang masuk selagi modal ini terbuka.
  function renderBackConfirmModal() {
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <div style={{ background: t.panel, borderRadius: 18, padding: "28px 24px", maxWidth: 380, width: "100%", boxShadow: "0 8px 40px rgba(0,0,0,0.25)" }}>
          <div style={{ fontSize: 32, marginBottom: 12, textAlign: "center" }}>⚠️</div>
          <div className="sgt" style={{ fontSize: 18, fontWeight: 800, color: t.text, marginBottom: 8, textAlign: "center" }}>Kembali ke Persiapan?</div>
          <div style={{ fontSize: 14, color: t.dim, lineHeight: 1.7, marginBottom: 22, textAlign: "center" }}>
            Permainan sedang berlangsung. Pilih salah satu tindakan sebelum keluar:
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <button onClick={() => { openSaveNamePrompt(); setShowBackConfirm(false); }}
              style={{ display: "flex", alignItems: "center", gap: 10, background: "#F4B740", color: "#101B34", border: "none", borderRadius: 12, padding: "13px 18px", fontWeight: 700, fontSize: 14, cursor: "pointer", width: "100%" }}>
              <span style={{ fontSize: 18 }}>💾</span>
              <div style={{ textAlign: "left" }}>
                <div>Simpan &amp; Jeda</div>
                <div style={{ fontSize: 14, fontWeight: 400, opacity: 0.75 }}>Progres tersimpan, bisa dilanjutkan nanti</div>
              </div>
            </button>
            <button onClick={() => endGameDirect()}
              style={{ display: "flex", alignItems: "center", gap: 10, background: "transparent", color: "#EF5B5B", border: "1.5px solid #EF5B5B", borderRadius: 12, padding: "13px 18px", fontWeight: 700, fontSize: 14, cursor: "pointer", width: "100%" }}>
              <span style={{ fontSize: 18 }}>⏹</span>
              <div style={{ textAlign: "left" }}>
                <div>Akhiri Permainan</div>
                <div style={{ fontSize: 14, fontWeight: 400, opacity: 0.75 }}>Skor tidak tersimpan, kembali ke persiapan</div>
              </div>
            </button>
            <button onClick={() => setShowBackConfirm(false)}
              style={{ background: "transparent", color: t.dim, border: `1px solid ${t.border}`, borderRadius: 12, padding: "11px 18px", fontWeight: 600, fontSize: 14, cursor: "pointer", width: "100%" }}>
              Lanjutkan Permainan
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------------- STAGE: SETUP (Persiapan) ---------------- */
  if (stage === "setup") {
    const fieldLabelStyle = { fontSize: 14, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 };
    const iconBtn = { position: "relative", display: "flex", alignItems: "center", justifyContent: "center", width: 34, height: 34, background: "transparent", border: "none", borderRadius: 8, color: t.text, cursor: "pointer" };
    // FIX (UX): kunci jawaban dulu mewarnai SETIAP SEL kata dengan blok warna solid — kalau
    // banyak kata & banyak yang tumpang tindih, tampilannya jadi penuh kotak-kotak dan berat di
    // mata (apalagi kata diagonal jadi terlihat "patah-patah" karena tiap sel diagonal digambar
    // sebagai kotak terpisah, bukan garis lurus menyambung). Sekarang tiap kata cukup digambar
    // sebagai SATU garis tipis transparan dari huruf pertama ke huruf terakhir (mengikuti sudut
    // aslinya, termasuk diagonal), mirip tampilan word-search pada umumnya — jauh lebih ringan
    // dilihat dan tetap jelas menunjukkan posisi & arah tiap kata.
    const answerKeySegments = [];
    if (showAnswerKey && puzzlePreview) {
      babak.words.forEach((w) => {
        const cells = puzzlePreview.placements[w.id];
        if (!cells || cells.length === 0) return;
        const [r1, c1] = cells[0];
        const [r2, c2] = cells[cells.length - 1];
        answerKeySegments.push({ id: w.id, x1: c1 + 0.5, y1: r1 + 0.5, x2: c2 + 0.5, y2: r2 + 0.5, color: answerKeyColorByWordId[w.id] });
      });
    }
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box", position: "relative", overflow: "hidden" }}>
        <style>{fontImport}</style>
        <JapaneseBackdrop theme={theme} />
        {historyOpen && renderHistoryModal()}
        <PageGuideModal open={guideOpen} onClose={() => setGuideOpen(false)} t={t} accent="#3E7CB1"
          title="Panduan — Word Search" subtitle="Cara menyusun materi & cara game ini dimainkan"
          steps={[
            { icon: "📚", t: "Pilih Tema", d: "Pilih salah satu dari 14 tema (Kelas XI/XII), atau klik \"+ Tambah Tema\" untuk membuat tema sendiri." },
            { icon: "✏️", t: "Isi Kosakata per Babak", d: "Ada 3 babak tetap. Tiap kata butuh: kata jawaban (romaji/hiragana/katakana), petunjuk Bahasa Indonesia, dan boleh tambah audio suara sendiri. Bisa juga pakai \"Tambah Banyak Sekaligus\" untuk mengisi banyak baris sekaligus dari teks yang ditempel." },
            { icon: "🔑", t: "Kunci Jawaban & Acak Ulang", d: "Klik \"Tampilkan Kunci\" untuk lihat pratinjau posisi kata di papan sebelum main, atau \"Acak Ulang\" kalau susunannya kurang cocok." },
            { icon: "▶️", t: "Mulai Permainan", d: "Setelah minimal 1 kata terisi di tiap babak, klik \"Mulai Permainan\" — kode Room dan QR untuk siswa join per kelompok (K1–K6) otomatis dibuat." },
            { icon: "🙋", t: "Cara Bermain", d: "Kelompok scan QR lalu pilih nomor kelompoknya. Guru menampilkan petunjuk (audio/teks/dibacakan sendiri lewat mode \"Bebas\"), lalu kelompok yang tahu jawabannya angkat tangan (Digital lewat HP, atau Manual dicatat guru) — yang tercepat dapat giliran menjawab duluan dengan mengetuk huruf awal & akhir kata di papan." },
            { icon: "⤢", t: "Mode Guru & Mode Proyektor", d: "\"Mode Guru\" membuat guru bisa langsung menunjuk kelompok mana yang menjawab & mengoreksi skor manual, mengabaikan urutan angkat tangan. \"Mode Proyektor\" menyembunyikan panel kontrol guru supaya yang diproyeksikan ke kelas cuma papan permainan & skor." },
            { icon: "💾", t: "Simpan & Lanjutkan", d: "Progres bisa dijeda kapan saja lewat \"Simpan & Jeda\", lalu dilanjutkan lagi nanti dari menu Riwayat Sesi (📜) — termasuk dari device/kelas lain." },
          ]} />

        {/* FIX: dulu cuma header yang dibungkus position:relative+zIndex:1 — sisanya (panel Pilih
            materi, Kosakata per babak, dst) tidak, jadi backdrop (position:fixed, zIndex:0) yang
            SECARA URUTAN STACKING CSS baku digambar SETELAH elemen normal tanpa z-index, malah
            menutupi panel-panel itu. Sekarang SEMUA konten (bukan cuma header) dibungkus 1 wrapper
            ber-zIndex:1 di sini — persis pola yang sudah benar di layar "Pilih Game". */}
        <div style={{ position: "relative", zIndex: 1 }}>

        {/* HEADER — judul kiri, aksi kanan */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 28, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 32, fontWeight: 800, letterSpacing: -0.5 }}>Persiapan Permainan</div>
            <div style={{ fontSize: 14.5, color: t.dim, marginTop: 3 }}>Susun materi &amp; kosakata sebelum mulai bermain bersama siswa.</div>
            <div style={{ marginTop: 6 }}><CloudSaveBadge t={t} status={cloudSave.status} savedAt={cloudSave.savedAt} /></div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            {/* Ikon utilitas */}
            <div style={{ display: "flex", gap: 2, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, borderRadius: 10, padding: 3 }}>
              <button onClick={() => setGuideOpen(true)} title="Panduan Word Search" style={iconBtn}>
                <span style={{ fontSize: 16, lineHeight: 1 }}>📖</span>
              </button>
              <button onClick={() => setHistoryOpen(true)} title="Riwayat sesi tersimpan" style={iconBtn}>
                <span style={{ fontSize: 16, lineHeight: 1 }}>📜</span>
                {historyList.length > 0 && <span style={{ position: "absolute", top: -4, right: -4, background: "#EF5B5B", color: "#fff", borderRadius: "50%", width: 26, height: 26, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{historyList.length}</span>}
              </button>
              <BackupExportButton t={t} compact iconStyle={iconBtn} currentLabel={selectedMateri}
                onExportCurrent={() => exportBackup("current", materiSlug)} onExportAll={() => exportBackup("all", "semua-materi")} />
              <label title="Muat cadangan dari file .json" style={{ ...iconBtn, cursor: "pointer" }}>
                <span style={{ fontSize: 16, lineHeight: 1 }}>📂</span>
                <input type="file" accept="application/json,.json" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
              </label>
              <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} title="Ganti tema terang/gelap" style={iconBtn} />
            </div>
            {/* Tombol Pilih Game — lebih menonjol */}
            <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1.5px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 18px", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 600 }}>
              <span style={{ fontSize: 15 }}>←</span> Pilih Game
            </button>
          </div>
        </div>

        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 18, padding: "22px 24px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={1} faint={t.faint} hint={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontWeight: 700, color: "#D98A2B", background: "rgba(244,183,64,.16)", padding: "2px 9px", borderRadius: 999, fontSize: 14 }}>14 Tema</span>
              <span style={{ color: t.dim, fontSize: 14 }}>(sesuai Prota Bahasa Jepang kelas XI &amp; XII Fase F)</span>
            </span>
          }>Pilih Tema</SectionLabel>
          {/* Dulu tiap materi berupa chip pil satu baris (cuma teks, deskripsi di tooltip).
              Sekarang jadi kartu bernomor 1–9 dengan ikon & warna sendiri-sendiri — sesuai
              nama "SanKyuu" (san = 3 game, kyuu = 9 materi) supaya lebih menarik dilihat &
              jumlah materinya langsung kelihatan sekilas, bukan cuma dibaca dari tooltip. */}
          <MateriPicker t={t} selected={selectedMateri} teacher={teacher}
            onSelect={(name) => { setSelectedMateri(name); setDataByMateri((prev) => ensureMateri(prev, name)); setBabakId(1); setBabakPanelOpen(true); }} />
        </div>

        <div style={{ background: t.panel, borderRadius: 18, padding: "22px 24px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={2} hint="— edit, hapus, tambah, unggah audio" faint={t.faint}>Kosakata per babak</SectionLabel>
          {/* FIX (UX, seperti Educaplay): dulu Babak 1/2/3 berupa tab yang saling menggantikan
              konten di tempat yang sama, jadi tidak kelihatan sekilas berapa kosakata sudah
              terisi di babak lain tanpa mengklik tab satu-satu. Sekarang jadi 3 panel accordion
              bertumpuk: tiap panel selalu menampilkan ringkasannya (sub-materi, poin, jumlah
              kosakata) meski tertutup, dan mengklik satu panel membuka daftar kosakatanya ke
              bawah sekaligus otomatis menutup panel lain (babakId dipakai sebagai "yang sedang
              terbuka" — sama seperti dulu dipakai sebagai "tab aktif", jadi tidak perlu state baru).
              Ini bikin halaman lebih rapi & enak dipandang, terutama saat sudah 3 babak terisi. */}
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {[1, 2, 3].map((id) => {
              const isOpen = babakId === id && babakPanelOpen;
              const meta = SEED_BABAK[id];
              const wordsForId = dataByMateri[selectedMateri]?.[id] || [];
              return (
                <div key={id} style={{ border: `1.5px solid ${isOpen ? "#F4B740" : t.border}`, borderRadius: 14, overflow: "hidden", background: t.panel2, transition: "border-color .2s ease", boxShadow: isOpen ? "0 2px 12px rgba(244,183,64,0.15)" : t.shadowSm }}>
                  <button
                    onClick={() => {
                      if (babakId === id && babakPanelOpen) setBabakPanelOpen(false);
                      else { setBabakId(id); setBabakPanelOpen(true); }
                    }}
                    className="babak-acc-header"
                    style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "16px 20px", background: "transparent", border: "none", cursor: "pointer", textAlign: "left" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                      <div style={{ width: 28, height: 28, borderRadius: "50%", background: isOpen ? "#F4B740" : t.panel, border: isOpen ? "none" : `1px solid ${t.border}`, color: isOpen ? "#101B34" : t.dim, fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{id}</div>
                      <div style={{ minWidth: 0 }}>
                        <div className="sgt" style={{ fontWeight: 700, fontSize: 14, color: t.text }}>Babak {id}</div>
                        <div style={{ fontSize: 14, color: t.dim, marginTop: 1 }}>{meta.sub} · {pointByBabak[id]} poin / soal · {wordsForId.length} kosakata</div>
                      </div>
                    </div>
                    <span style={{ width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: isOpen ? "#101B34" : t.dim, background: isOpen ? "#F4B740" : "transparent", flexShrink: 0, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .15s ease, background .15s ease" }}>▾</span>
                  </button>

                  {isOpen && (
                    <div className="babak-acc-body" style={{ padding: "0 16px 16px", borderTop: `1px solid ${t.border}` }}>
                      {/* Tombol Tambah Banyak (kiri) + pengatur poin per soal babak ini (kanan) */}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, margin: "14px 0" }}>
                        <button onClick={() => setBulkAddOpen(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel, border: `1.5px dashed ${t.accent || "#F4B740"}`, color: t.text, borderRadius: 10, padding: "10px 18px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>
                          <span style={{ fontSize: 16, lineHeight: 1 }}>📋</span> Tambah Banyak Sekaligus
                        </button>
                        <div style={{ display: "flex", alignItems: "center", gap: 10, background: t.panel, borderRadius: 10, padding: "8px 12px" }}>
                          <span style={{ fontSize: 14, color: t.dim }}>Poin per soal</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <button onClick={() => setPointByBabak((p) => ({ ...p, [id]: Math.max(1, (p[id] || 1) - 1) }))} title="Kurangi poin" style={{ width: 26, height: 26, borderRadius: 7, border: "none", background: t.panel2, color: t.text, fontSize: 15, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>−</button>
                            <span className="sgt" style={{ minWidth: 22, textAlign: "center", fontWeight: 700, fontSize: 14, color: t.text }}>{pointByBabak[id]}</span>
                            <button onClick={() => setPointByBabak((p) => ({ ...p, [id]: Math.min(20, (p[id] || 1) + 1) }))} title="Tambah poin" style={{ width: 26, height: 26, borderRadius: 7, border: "none", background: t.panel2, color: t.text, fontSize: 15, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>+</button>
                          </div>
                        </div>
                      </div>

                      <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                        {/* Baris atas: papan kiri + info kanan */}
                        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "minmax(260px, 420px) 1fr", gap: 20, alignItems: "start" }}>

                          {/* Kolom kiri: papan puzzle */}
                          <div>
                          {!puzzlePreview ? (
                            <div style={{ padding: 20, color: t.dim, fontSize: 14, textAlign: "center", background: t.panel2, borderRadius: 12 }}>
                              {babakWordsSig && defaultPuzzlePreview === null
                                ? `Papan gagal disusun — coba kurangi jumlah kata atau perpendek beberapa kata, lalu klik "Acak Ulang".`
                                : `Isi kosakata di bawah untuk melihat pratinjau papan.`}
                            </div>
                          ) : (
                            <div style={{ background: t.panel2, borderRadius: 12, padding: 10, boxSizing: "border-box" }}>
                              <svg viewBox={`0 0 ${puzzlePreview.size} ${puzzlePreview.size}`} style={{ width: "100%", height: "auto", display: "block" }}>
                                {puzzlePreview.grid.map((row, r) => row.map((letter, c) => (
                                  <rect key={`box-${cellKey(r, c)}`} x={c} y={r} width={1} height={1}
