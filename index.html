  "Buat 1 kalimat tanya untuk menanyakan lokasi suatu ruangan di sekolah menggunakan kata tanya doko!",
  "Buat 1 kalimat yang menjelaskan posisi ruang kepala sekolah berada di samping ruangan lain!",
  "Buat 1 kalimat yang menjelaskan letak toilet (toire) berada di depan (mae) ruangan lain!",
  "Terjemahkan ke dalam bahasa Jepang: \"Tempat sampah ada di bawah meja\"!",
  "Terjemahkan ke dalam bahasa Jepang: \"Ruang UKS ada di sebelah ruang TU\"!",
  "Buat 1 kalimat tanya untuk menanyakan benda apa yang ada di atas meja!",
  "Buat 1 kalimat yang menyebutkan seluruh isi kotak pensil secara pasti!",
  "Buat 1 kalimat yang menyebutkan beberapa contoh perwakilan isi tas!",
  "Buat 1 contoh kalimat menggunakan partikel to dan 1 contoh kalimat menggunakan ya ... nado",
  "Terjemahkan ke dalam bahasa Jepang: \"Di dalam kelas ada meja dan kursi\"!",
  "Terjemahkan ke dalam bahasa Jepang: \"Di atas meja ada pensil, buku, dan lain-lain\"!",
  "Buat 2 kalimat pertanyaan yang berbeda (1 menanyakan letak benda, 1 menanyakan apa yang ada di suatu tempat)!",
  "Tuliskan 3 kosakata benda kelas yang mengandung tanda Tenten menggunakan huruf Hiragana!",
  "Tuliskan 2 kosakata yang mengandung tanda Maru menggunakan huruf Hiragana!",
  "Tuliskan 3 kosakata bahasa Jepang yang memiliki bunyi vokal panjang (Chôon) menggunakan huruf Hiragana!",
  "Tuliskan 2 kosakata yang memiliki konsonan rangkap (tsu kecil) menggunakan huruf Hiragana!",
  "Tuliskan 3 kosakata yang mengandung huruf kombinasi Yôon (kya, shu, cho, dsb.) menggunakan huruf Hiragana!",
  "Tuliskan kata \"tsukue\", \"fudebako\", dan \"gakkô\" ke dalam huruf Hiragana dengan tepat!",
  "Tuliskan kata \"shashin\", \"kabin\", dan \"gomibako\" ke dalam huruf Hiragana dengan tepat!",
  "Selamat, kamu bebas giliran! Tunjuk satu teman sekelasmu untuk menyebutkan 3 nama ruangan di sekolah beserta artinya.",
  "Tunjuk satu temanmu untuk maju ke papan tulis! Sebutkan 2 kata benda kelas secara lisan, dan minta teman yang kamu tunjuk untuk menuliskannya dalam huruf Hiragana.",
  "Kamu bebas dari giliran ini! Pilih satu teman sekelasmu yang sedang terlihat santai untuk maju ke papan tulis dan menuliskan kata 'enpitsu', 'kyôshitsu', dan 'oneesan' dalam huruf Hiragana!",
];

function initialBoxDataByMateri() {
  return { "Gakkou no Seikatsu": SEED_INSTRUCTIONS.map((text) => ({ id: uid(), text })) };
}
function ensureBoxMateri(data, materi) {
  if (data[materi]) return data;
  return { ...data, [materi]: [] };
}

function BukaKotakGame({ onBack }) {
  const [theme, setTheme] = useState("light");
  const t = THEMES[theme];
  const [stage, setStage] = useState("setup"); // 'setup' | 'play'
  const [selectedMateri, setSelectedMateri] = useState("Gakkou no Seikatsu");
  const [dataByMateri, setDataByMateri] = useState(initialBoxDataByMateri);
  const [loaded, setLoaded] = useState(false);
  const [storageWarning, setStorageWarning] = useState(null); // pesan kalau localStorage gagal menyimpan
  const [importMsg, setImportMsg] = useState(null); // { ok, text } hasil ekspor/impor cadangan
  const [bulkAddOpen, setBulkAddOpen] = useState(false);
  const [opened, setOpened] = useState({}); // id -> true
  const [activeBox, setActiveBox] = useState(null); // instruction object or null

  useEffect(() => {
    try {
      const raw = localStorage.getItem("bk-setup-data");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.dataByMateri) setDataByMateri(parsed.dataByMateri);
        if (parsed.selectedMateri) setSelectedMateri(parsed.selectedMateri);
        if (parsed.theme) setTheme(parsed.theme);
      }
    } catch (e) { /* belum ada data tersimpan, atau data korup */ }
    try {
      const rawP = localStorage.getItem("bk-progress");
      if (rawP) {
        const p = JSON.parse(rawP);
        if (p.stage) setStage(p.stage);
        if (p.opened) setOpened(p.opened);
      }
    } catch (e) { /* belum ada progres tersimpan, atau data korup */ }
    setLoaded(true);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const res = safeSetItem("bk-setup-data", JSON.stringify({ dataByMateri, selectedMateri, theme }));
      setStorageWarning(res.ok ? null : res.message);
    }, 500);
    return () => clearTimeout(tm);
  }, [dataByMateri, selectedMateri, theme, loaded]);
  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const res = safeSetItem("bk-progress", JSON.stringify({ stage, opened }));
      setStorageWarning(res.ok ? null : res.message);
    }, 500);
    return () => clearTimeout(tm);
  }, [stage, opened, loaded]);

  function endGame() {
    if (!window.confirm("Akhiri permainan ini? Progres kotak yang sudah dibuka akan dihapus.")) return;
    try { localStorage.removeItem("bk-progress"); } catch (e) {}
    setOpened({}); setActiveBox(null); setStage("setup");
    onBack();
  }

  const items = dataByMateri[selectedMateri] || [];
  const canStart = items.some((it) => it.text.trim());

  function updateItem(id, value) {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: (prev[selectedMateri] || []).map((it) => it.id === id ? { ...it, text: value } : it) }));
  }
  function removeItem(id) {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: (prev[selectedMateri] || []).filter((it) => it.id !== id) }));
  }
  function addItem() {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: [...(prev[selectedMateri] || []), { id: uid(), text: "" }] }));
  }
  // FITUR BARU: tambah banyak perintah sekaligus, satu perintah per baris — tidak perlu format
  // khusus karena tiap baris memang cuma satu kalimat perintah utuh.
  function addItemsBulk(text) {
    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return 0;
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: [...(prev[selectedMateri] || []), ...lines.map((line) => ({ id: uid(), text: line }))] }));
    return lines.length;
  }
  function startGame() { setOpened({}); setActiveBox(null); setStage("play"); }
  function openBox(item) { setActiveBox(item); setOpened((o) => ({ ...o, [item.id]: true })); }
  function resetBoard() { setOpened({}); setActiveBox(null); }

  /* ---- Cadangan perintah: ekspor ke file .json & impor kembali ---- */
  const { exportBackup, importBackup } = makeBackupHandlers({
    appId: "buka-kotak", appLabel: "Buka Kotak",
    buildPayload: () => ({ selectedMateri, dataByMateri }),
    applyPayload: (data) => {
      if (!data.dataByMateri) throw new Error("File ini bukan cadangan Buka Kotak.");
      const materiCount = Object.keys(data.dataByMateri).length;
      if (!window.confirm(`Muat cadangan ini? ${materiCount} materi di cadangan akan MENIMPA materi dengan nama sama yang ada sekarang. Materi lain tetap aman.`)) return;
      setDataByMateri((prev) => ({ ...prev, ...data.dataByMateri }));
      if (data.selectedMateri) setSelectedMateri(data.selectedMateri);
      setImportMsg({ ok: true, text: `Cadangan dimuat — ${materiCount} materi diperbarui.` });
    },
    setImportMsg,
  });

  if (stage === "setup") {
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
        <style>{fontImport}</style>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 28, fontWeight: 700 }}>Persiapan — Mystery Box</div>
            <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Susun daftar perintah sebelum dimainkan. Individu, tanpa waktu, tanpa skor.</div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={exportBackup} title="Unduh cadangan ke file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>💾</span> Cadangkan</button>
            <label title="Muat cadangan dari file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>
              <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📂</span> Muat Cadangan
              <input type="file" accept="application/json,.json" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
            </label>
            <button onClick={onBack} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>← Pilih Game</button>
            <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
          </div>
        </div>

        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={1} faint={t.faint}>Pilih materi</SectionLabel>
          <MateriPicker t={t} selected={selectedMateri}
            onSelect={(name) => { setSelectedMateri(name); setDataByMateri((prev) => ensureBoxMateri(prev, name)); }} />
        </div>

        <div style={{ background: t.panel, borderRadius: 14, padding: 16, marginBottom: 20, boxShadow: t.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <SectionLabel n={2} hint={`— ${items.length} kotak`} faint={t.faint}>Daftar perintah</SectionLabel>
            <button onClick={() => setBulkAddOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px dashed ${t.border}`, color: t.dim, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>📋</span> Tambah Banyak Sekaligus</button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {items.map((it, i) => (
              <div key={it.id} className="list-row" style={{ display: "flex", gap: 8, alignItems: "flex-start", background: t.panel2, borderRadius: 10, padding: 10 }}>
                <span style={{ width: 26, height: 26, borderRadius: 7, background: BOX_COLORS[i % BOX_COLORS.length], color: "#101B34", fontWeight: 700, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</span>
                <textarea value={it.text} onChange={(e) => updateItem(it.id, e.target.value)} rows={2} placeholder="Tulis perintah/instruksi…"
                  style={{ flex: 1, padding: "8px 10px", borderRadius: 7, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 13, resize: "vertical", fontFamily: "inherit" }} />
                <button onClick={() => removeItem(it.id)} className="row-del" title="Hapus perintah ini" style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 8, borderRadius: 8 }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
              </div>
            ))}
          </div>
          <button onClick={addItem} style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6, background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>➕</span> Tambah Perintah</button>
        </div>

        <BulkAddModal
          open={bulkAddOpen}
          onClose={() => setBulkAddOpen(false)}
          onAdd={addItemsBulk}
          title="Tambah Banyak Perintah Sekaligus"
          formatHint="Satu perintah per baris — tidak perlu tanda pemisah, tiap baris langsung jadi satu kotak."
          placeholder={"Sebutkan 3 kosakata benda elektronik di kelas!\nBuat 1 kalimat tanya kepemilikan barang menggunakan kata tanya dare"}
        />

        <button onClick={startGame} disabled={!canStart} style={{ display: "flex", alignItems: "center", gap: 8, background: canStart ? "#F4B740" : t.panel2, color: canStart ? "#101B34" : t.faint, border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: canStart ? "pointer" : "default" }}>Mulai Permainan <span style={{ fontSize: 17, lineHeight: 1, color: 'inherit' }}>➡</span></button>
        {!canStart && <div style={{ marginTop: 8, fontSize: 12.5, color: t.faint }}>Isi minimal satu perintah untuk mulai.</div>}
      </div>
    );
  }

  const openedCount = Object.keys(opened).length;

  return (
    <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box", position: "relative" }}>
      <style>{fontImport}</style>

      {activeBox && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }} onClick={() => setActiveBox(null)}>
          <div onClick={(e) => e.stopPropagation()} className="modal-pop" style={{ width: "min(520px, 90vw)", background: "#F2879E", borderRadius: 20, padding: "36px 30px", boxShadow: "0 20px 60px rgba(0,0,0,.4)", position: "relative" }}>
            <button onClick={() => setActiveBox(null)} style={{ position: "absolute", top: 12, right: 14, background: "none", border: "none", color: "#101B34", cursor: "pointer" }}><span style={{ fontSize: 20, lineHeight: 1, color: 'inherit' }}>✕</span></button>
            <div className="sgt" style={{ fontSize: 20, fontWeight: 700, color: "#101B34", textAlign: "center", lineHeight: 1.5 }}>{activeBox.text}</div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16, marginBottom: 22 }}>
        <div>
          <div className="sgt page-title" style={{ fontSize: 30, fontWeight: 700, letterSpacing: -0.5 }}>Mystery Box</div>
          <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>{selectedMateri} · {openedCount}/{items.length} kotak sudah dibuka · individu, tanpa skor</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => setStage("setup")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>← Persiapan</button>
          <button onClick={resetBoard} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🔄</span> Reset papan</button>
          <button onClick={endGame} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏹</span> Akhiri Permainan</button>
          <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
        </div>
      </div>

      <div style={{ maxWidth: 860, margin: "0 auto" }}>
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: t.dim, marginBottom: 6 }}>
            <span>Progres</span><span>{openedCount}/{items.length} kotak dibuka</span>
          </div>
          <div style={{ height: 8, borderRadius: 999, background: t.panel, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${items.length ? (openedCount / items.length) * 100 : 0}%`, background: "#F4B740", borderRadius: 999, transition: "width .3s ease" }} />
          </div>
        </div>

        <div style={{ background: t.panel, borderRadius: 20, padding: 20, boxShadow: t.shadowSm }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(84px, 1fr))", gap: 12 }}>
            {items.map((it, i) => {
              const isOpen = opened[it.id];
              return (
                <button key={it.id} onClick={() => openBox(it)} style={{
                  aspectRatio: "1 / 1", borderRadius: 14, cursor: isOpen ? "default" : "pointer", border: "none",
                  background: isOpen ? t.panel2 : BOX_COLORS[i % BOX_COLORS.length], color: isOpen ? t.faint : "#101B34",
                  fontWeight: 800, fontSize: 19, display: "flex", alignItems: "center", justifyContent: "center",
                  opacity: isOpen ? 0.45 : 1, boxShadow: isOpen ? "none" : "0 3px 0 rgba(0,0,0,.16)",
                  transform: isOpen ? "scale(.94)" : "scale(1)", transition: "transform .15s ease, opacity .15s ease",
                  animation: isOpen ? "boxPop .5s cubic-bezier(.3,1.5,.4,1) both" : "none",
                }} className="sgt">{isOpen ? <span style={{ fontSize: 20, lineHeight: 1, color: 'inherit' }}>✓</span> : i + 1}</button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   GAME 3 — COCOKKAN KARTU
   Kartu gambar dipasangkan dengan kata (romaji/hiragana). Tiap
   kelompok balapan di papannya sendiri-sendiri (isi pasangan
   SAMA, susunan acak beda per HP). Kelompok tercepat dapat
   poin terbanyak; babaknya bisa berapa pun, minimal 5
   pasangan per babak.
=========================================================== */
function makeBabak(n) { return { id: uid(), label: `Babak ${n}`, pairs: [] }; }

function CocokkanKartuGame({ onBack }) {
  const isMobile = useIsMobile();
  const [theme, setTheme] = useState("light");
  const t = THEMES[theme];

  const [stage, setStage] = useState("setup"); // 'setup' | 'play'
  const [babaks, setBabaks] = useState(() => [makeBabak(1)]);
  const [babakIdx, setBabakIdx] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [storageWarning, setStorageWarning] = useState(null); // pesan kalau localStorage gagal menyimpan
  const [importMsg, setImportMsg] = useState(null); // { ok, text } hasil ekspor/impor cadangan
  const [roomCode, setRoomCode] = useState(makeRoomCode());
  const [scores, setScores] = useState({}); // { [group]: total poin }
  const [uploadingImage, setUploadingImage] = useState({});
  const [imageUploadError, setImageUploadError] = useState({});
  const [qrOpen, setQrOpen] = useState(false);
  const [bulkAddOpen, setBulkAddOpen] = useState(false);
  const [joinedGroups, setJoinedGroups] = useState({});
  const [cardsRoundId, setCardsRoundId] = useState(null);
  const [finishers, setFinishers] = useState([]);
  const [scored, setScored] = useState(false);
  const [publishing, setPublishing] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("cck-setup-data");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.babaks) && parsed.babaks.length > 0) setBabaks(parsed.babaks);
        if (parsed.theme) setTheme(parsed.theme);
      }
    } catch (e) { /* belum ada data tersimpan, atau data korup — mulai dari kosong */ }
    setLoaded(true);
    cleanupStaleRooms();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const res = safeSetItem("cck-setup-data", JSON.stringify({ babaks, theme }));
      setStorageWarning(res.ok ? null : res.message);
    }, 500);
    return () => clearTimeout(tm);
  }, [babaks, theme, loaded]);

  const babak = babaks[babakIdx] || babaks[0];

  function addBabak() { setBabaks((prev) => [...prev, makeBabak(prev.length + 1)]); }
  function removeBabak(idx) {
    if (babaks.length <= 1) return;
    if (!window.confirm("Hapus babak ini beserta semua pasangan kartunya?")) return;
    setBabaks((prev) => prev.filter((_, i) => i !== idx));
    setBabakIdx((i) => Math.max(0, Math.min(i, babaks.length - 2)));
  }
  function addPair(idx) {
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: [...b.pairs, { id: uid(), word: "", image: null }] } : b));
  }
  // FITUR BARU: tambah banyak kata sekaligus, satu kata per baris. Cuma isi teksnya — gambar
  // TIDAK bisa ikut ditempel lewat cara ini (harus diunggah manual per kartu satu-satu lewat
  // tombol unggah gambar seperti biasa), jadi kartu-kartu baru ini akan muncul dulu tanpa gambar.
  function addPairsBulk(idx, text) {
    const words = text.split("\n").map((l) => l.trim()).filter(Boolean).map((w) => w.toUpperCase());
    if (words.length === 0) return 0;
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: [...b.pairs, ...words.map((word) => ({ id: uid(), word, image: null }))] } : b));
    return words.length;
  }
  function removePair(idx, pairId) {
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.filter((p) => p.id !== pairId) } : b));
  }
  function updatePairWord(idx, pairId, value) {
    const finalValue = value.toUpperCase(); // konsisten dgn gaya kata Game 1; aman utk hiragana
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.map((p) => p.id === pairId ? { ...p, word: finalValue } : p) } : b));
  }
  function uploadImage(idx, pairId, file) {
    if (!file) return;
    // Beda dari audio di Game 1: gambar ini WAJIB tersinkron ke Firestore (bukan cuma
    // localStorage guru), karena tiap HP siswa perlu benar-benar menampilkannya. Batas ketat
    // supaya ringan diunduh serentak oleh banyak HP sekaligus & jauh dari batas ukuran dokumen.
    if (file.size > 250 * 1024) {
      setImageUploadError((e) => ({ ...e, [pairId]: "Gambar maksimal 250KB. Kompres/perkecil dulu gambarnya." }));
      return;
    }
    setImageUploadError((e) => { const n = { ...e }; delete n[pairId]; return n; });
    setUploadingImage((u) => ({ ...u, [pairId]: true }));
    const reader = new FileReader();
    reader.onload = () => {
      setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.map((p) => p.id === pairId ? { ...p, image: reader.result } : p) } : b));
      setUploadingImage((u) => { const n = { ...u }; delete n[pairId]; return n; });
    };
    reader.onerror = () => {
      setImageUploadError((e) => ({ ...e, [pairId]: "Gagal membaca gambar, coba lagi." }));
      setUploadingImage((u) => { const n = { ...u }; delete n[pairId]; return n; });
    };
    reader.readAsDataURL(file);
  }

  function validPairs(b) { return b.pairs.filter((p) => p.word.trim() && p.image); }
  const canStart = babaks.length > 0 && babaks.every((b) => validPairs(b).length >= 5);

  async function startSession() {
    // Sama seperti Word Search: pastikan roomCode belum dipakai kelas lain sebelum dipakai QR join.
    const uniqueCode = await ensureUniqueRoomCode(roomCode);
    if (uniqueCode !== roomCode) setRoomCode(uniqueCode);
    setScores({}); setBabakIdx(0); setStage("play");
  }

  useEffect(() => {
    if (stage !== "play") return;
    db.collection("rooms").doc(roomCode).set({
      mode: "cards", babakIdx, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true }).catch(() => {});
  }, [stage, roomCode, babakIdx]);

  useEffect(() => {
    if (stage !== "play") return;
    const ref = db.collection("rooms").doc(roomCode);
    const unsub = ref.onSnapshot((snap) => {
      const data = snap.data();
      if (!data) return;
      setJoinedGroups(data.groups || {});
      setCardsRoundId(data.cardsRoundId || null);
      setFinishers(Array.isArray(data.cardsFinishers) ? data.cardsFinishers : []);
    });
    return () => unsub();
  }, [stage, roomCode]);

  function applyScores(finalFinishers) {
    const totalGroups = Object.keys(joinedGroups).length || finalFinishers.length;
    if (totalGroups === 0) { setScored(true); return; }
    setScores((prev) => {
      const next = { ...prev };
      finalFinishers.forEach((f, i) => { next[f.group] = (next[f.group] || 0) + Math.max(totalGroups - i, 1); });
      // Kelompok yang sudah join tapi belum menyelesaikan babak ini tetap dapat 1 poin (floor).
      Object.keys(joinedGroups).forEach((gStr) => {
        const g = Number(gStr);
        if (!finalFinishers.some((f) => f.group === g)) next[g] = (next[g] || 0) + 1;
      });
      return next;
    });
    setScored(true);
  }

  // Penilaian otomatis begitu SEMUA kelompok yang join sudah menyelesaikan babak ini.
  useEffect(() => {
    if (stage !== "play" || !cardsRoundId || scored) return;
    const totalGroups = Object.keys(joinedGroups).length;
    if (totalGroups > 0 && finishers.length >= totalGroups) applyScores(finishers);
  }, [finishers, joinedGroups, cardsRoundId, scored, stage]);

  async function startRound() {
    setPublishing(true);
    try {
      const col = db.collection("rooms").doc(roomCode).collection("cardPairs");
      const existing = await col.get();
      const batch = db.batch();
      existing.docs.forEach((d) => batch.delete(d.ref));
      validPairs(babak).forEach((p) => batch.set(col.doc(p.id), { word: p.word.trim(), image: p.image }));
      await batch.commit();
      const newRoundId = uid();
      await db.collection("rooms").doc(roomCode).set({ cardsRoundId: newRoundId, cardsFinishers: [] }, { merge: true });
      setScored(false);
    } catch (e) {
      alert("Gagal memulai babak, coba lagi.");
    } finally {
      setPublishing(false);
    }
  }

  function endRoundNow() {
    if (scored) return;
    if (finishers.length < Object.keys(joinedGroups).length) {
      if (!window.confirm("Masih ada kelompok yang belum selesai. Akhiri babak sekarang? Kelompok yang belum selesai tetap dapat 1 poin.")) return;
    }
    applyScores(finishers);
  }

  function nextBabak() {
    if (babakIdx >= babaks.length - 1) return;
    const nextIdx = babakIdx + 1;
    setBabakIdx(nextIdx);
    db.collection("rooms").doc(roomCode).set({ babakIdx: nextIdx, cardsRoundId: null, cardsFinishers: [] }, { merge: true }).catch(() => {});
    setFinishers([]); setCardsRoundId(null); setScored(false);
  }

  function endGame() {
    if (!window.confirm("Akhiri permainan ini? Skor akan dihapus.")) return;
    // BUGFIX: dulu cuma db.collection("rooms").doc(roomCode).delete() — subcollection "cardPairs"
    // (gambar-gambar kartu babak terakhir) tidak ikut terhapus & jadi sampah permanen di Firestore.
    deleteRoomWithSubcollections(db.collection("rooms").doc(roomCode)).catch(() => {});
    setScores({}); setStage("setup"); setBabakIdx(0);
    onBack();
  }

  /* ---- Cadangan pasangan kartu: ekspor ke file .json & impor kembali ---- */
  const { exportBackup, importBackup } = makeBackupHandlers({
    appId: "card-rush", appLabel: "Card Rush",
    buildPayload: () => ({ babaks }),
    applyPayload: (data) => {
      if (!Array.isArray(data.babaks)) throw new Error("File ini bukan cadangan Card Rush.");
      if (!window.confirm(`Muat cadangan ini? Seluruh ${data.babaks.length} babak yang ada sekarang akan DIGANTI oleh isi cadangan.`)) return;
      setBabaks(data.babaks);
      setBabakIdx(0);
      setImportMsg({ ok: true, text: `Cadangan dimuat — ${data.babaks.length} babak dipulihkan.` });
    },
    setImportMsg,
  });

  const sortedGroups = [...GROUP_NAMES].sort((a, b) => (scores[b] || 0) - (scores[a] || 0));

  if (stage === "setup") {
    const fieldLabelStyle = { fontSize: 10.5, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 };
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
        <style>{fontImport}</style>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 26, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 28, fontWeight: 700 }}>Persiapan — Card Rush</div>
            {!isMobile && <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Kartu gambar dipasangkan dengan kata (romaji/hiragana). Minimal 5 pasang per babak.</div>}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={exportBackup} title="Unduh cadangan ke file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>💾</span> Cadangkan</button>
            <label title="Muat cadangan dari file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>
              <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📂</span> Muat Cadangan
              <input type="file" accept="application/json,.json" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
            </label>
            <button onClick={onBack} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>← Pilih Game</button>
            <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
          </div>
        </div>

        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>Babak</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
              <div style={{ display: "flex", gap: 6, background: t.panel2, padding: 4, borderRadius: 10 }}>
                {babaks.map((b, i) => (
                  <button key={b.id} onClick={() => setBabakIdx(i)} style={{ padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", background: babakIdx === i ? "#F4B740" : "transparent", color: babakIdx === i ? "#101B34" : t.text, fontWeight: 600, fontSize: 13 }}>{b.label}</button>
                ))}
              </div>
              <button onClick={addBabak} style={{ background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>➕ Babak</button>
              {babaks.length > 1 && <button onClick={() => removeBabak(babakIdx)} style={{ background: "transparent", border: "none", color: "#EF5B5B", cursor: "pointer", padding: "8px 10px", fontSize: 13 }}>🗑 Hapus babak ini</button>}
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
            <div style={{ fontSize: 12.5, color: validPairs(babak).length >= 5 ? "#3FBFAD" : t.faint, fontWeight: 600 }}>
              {validPairs(babak).length} / {babak.pairs.length} pasangan siap{!isMobile ? " (minimal 5 pasangan lengkap kata + gambar)" : ""}
            </div>
            <button onClick={() => setBulkAddOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px dashed ${t.border}`, color: t.dim, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontSize: 13 }}>📋 Tambah Banyak Sekaligus</button>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {babak.pairs.map((p, idx) => (
              <div key={p.id} className="list-row" style={{ display: "flex", gap: 12, alignItems: "center", background: t.panel2, borderRadius: 12, padding: "10px 14px", flexWrap: "wrap" }}>
                <div style={{ width: 24, height: 24, borderRadius: "50%", background: t.panel, color: t.faint, fontSize: 11.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{idx + 1}</div>
                <label title={p.image ? "Klik untuk ganti gambar" : "Unggah gambar"} style={{ width: 56, height: 56, borderRadius: 8, background: t.panel, flexShrink: 0, cursor: "pointer", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
                  {uploadingImage[p.id] ? "⏳" : p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 15, color: t.dim }}>⬆</span>}
                  <input type="file" accept="image/*" disabled={uploadingImage[p.id]} onChange={(e) => uploadImage(babakIdx, p.id, e.target.files[0])} style={{ display: "none" }} />
                </label>
                <div style={{ display: "flex", flexDirection: "column", gap: 5, flex: 1, minWidth: 160 }}>
                  {!isMobile && <label style={fieldLabelStyle}>Kata (romaji/hiragana)</label>}
                  <input value={p.word} onChange={(e) => updatePairWord(babakIdx, p.id, e.target.value)} placeholder={isMobile ? "Kata (romaji/hiragana)" : "mis. ねこ"}
                    style={{ padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 13 }} />
                  {imageUploadError[p.id] && <div style={{ fontSize: 10, color: "#EF5B5B" }}>{imageUploadError[p.id]}</div>}
                </div>
                <button onClick={() => removePair(babakIdx, p.id)} title="Hapus pasangan ini" className="row-del" style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 8, borderRadius: 8 }}>🗑</button>
              </div>
            ))}
          </div>
          <button onClick={() => addPair(babakIdx)} style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 13 }}>➕ Tambah Pasangan</button>

          <BulkAddModal
            open={bulkAddOpen}
            onClose={() => setBulkAddOpen(false)}
            onAdd={(text) => addPairsBulk(babakIdx, text)}
            title={`Tambah Banyak Kata Sekaligus — ${babak.label}`}
            formatHint="Satu kata per baris — hanya teksnya yang ikut ditambahkan. Gambar tetap harus diunggah manual satu per satu untuk tiap kartu baru di bawah."
            placeholder={"GOMIBAKO\nKARENDAA"}
          />
        </div>

        <button onClick={startSession} disabled={!canStart} style={{
          display: "flex", alignItems: "center", gap: 8, background: canStart ? "#F4B740" : t.panel2, color: canStart ? "#101B34" : t.faint,
          border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: canStart ? "pointer" : "default",
        }}>Mulai Permainan ➡</button>
        {!canStart && !isMobile && <div style={{ marginTop: 8, fontSize: 12.5, color: t.faint }}>Setiap babak butuh minimal 5 pasangan lengkap (kata + gambar) sebelum bisa dimulai.</div>}
      </div>
    );
  }

  const totalGroups = Object.keys(joinedGroups).length;

  return (
    <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
      <style>{fontImport}</style>
      <QrJoinModal open={qrOpen} onClose={() => setQrOpen(false)} roomCode={roomCode} joinedCount={totalGroups} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16, marginBottom: 20 }}>
        <div>
          <div className="sgt page-title" style={{ fontSize: 26, fontWeight: 700 }}>Card Rush — {babak.label}</div>
          <div style={{ fontSize: 13, color: t.dim, marginTop: 2 }}>Kode Room: <b>{roomCode}</b> · {totalGroups} kelompok sudah join</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => setQrOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>🔗 QR Join</button>
          <button onClick={endGame} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}>⏹ Akhiri Permainan</button>
        </div>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 20, alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 380px", background: t.panel, borderRadius: 16, padding: 20, boxSizing: "border-box", boxShadow: t.shadowSm }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>Kelompok yang sudah join</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
            {GROUP_NAMES.map((g) => {
              const joined = !!joinedGroups[g];
              return (
                <div key={g} style={{ padding: "8px 14px", borderRadius: 10, background: joined ? GROUP_COLORS[g - 1] : t.panel2, color: joined ? "#101B34" : t.faint, fontWeight: 700, fontSize: 13, opacity: joined ? 1 : 0.5 }}>
                  {(joinedGroups[g] && joinedGroups[g].name) || `Kelompok ${g}`}{joined ? " ✓" : ""}
                </div>
              );
            })}
          </div>

          {!cardsRoundId ? (
            <button onClick={startRound} disabled={publishing || totalGroups === 0} style={{
              display: "flex", alignItems: "center", gap: 8, background: totalGroups === 0 ? t.panel2 : "#F4B740", color: totalGroups === 0 ? t.faint : "#101B34",
              border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: totalGroups === 0 ? "default" : "pointer",
            }}>{publishing ? "Menyiapkan papan…" : "▶ Mulai Babak Ini"}</button>
          ) : (
            <React.Fragment>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>Urutan kelompok selesai</div>
              {finishers.length === 0 ? (
                <div style={{ fontSize: 13, color: t.dim, marginBottom: 14 }}>Belum ada yang selesai…</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
                  {finishers.map((f, i) => (
                    <div key={f.group} style={{ display: "flex", alignItems: "center", gap: 10, background: t.panel2, borderRadius: 10, padding: "8px 14px" }}>
                      <span style={{ width: 22, height: 22, borderRadius: "50%", background: GROUP_COLORS[f.group - 1], color: "#101B34", fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                      <span className="sgt" style={{ fontWeight: 700, fontSize: 14 }}>{f.name || `Kelompok ${f.group}`}</span>
                    </div>
                  ))}
                </div>
              )}
              {!scored ? (
                <button onClick={endRoundNow} style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel2, border: "none", color: t.text, borderRadius: 10, padding: "10px 16px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>⏹ Akhiri Babak Sekarang</button>
              ) : (
                <button onClick={babakIdx < babaks.length - 1 ? nextBabak : endGame} style={{ display: "flex", alignItems: "center", gap: 8, background: "#F4B740", border: "none", color: "#101B34", borderRadius: 10, padding: "10px 16px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>
                  {babakIdx < babaks.length - 1 ? "Lanjut Babak Berikutnya ➡" : "Selesaikan Sesi"}
                </button>
              )}
            </React.Fragment>
          )}
        </div>

        <div style={{ flex: "1 1 260px", background: t.panel, borderRadius: 16, padding: 20, boxSizing: "border-box", boxShadow: t.shadowSm }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>🏆 Papan Skor</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {sortedGroups.filter((g) => (scores[g] || 0) > 0 || joinedGroups[g]).map((g, i) => (
              <div key={g} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: t.panel2, borderRadius: 10, padding: "8px 12px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 3, background: GROUP_COLORS[g - 1] }} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>{(joinedGroups[g] && joinedGroups[g].name) || `Kelompok ${g}`}{i === 0 && (scores[g] || 0) > 0 ? " 👑" : ""}</span>
                </div>
                <span className="sgt" style={{ fontWeight: 700 }}>{scores[g] || 0}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   LOGIN GURU — wajib Google Sign-In sebelum masuk ke layar
   Persiapan/Panel Guru. Siswa tetap bebas lewat scan QR.
=========================================================== */
function TeacherLoginScreen({ onSignIn, busy, error }) {
  return (
    <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: THEMES.light.bg, color: THEMES.light.text, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 28, boxSizing: "border-box" }}>
      <style>{fontImport}</style>
      <div style={{ width: "min(360px, 100%)", background: "#FFFFFF", borderRadius: 20, padding: 32, boxShadow: "0 2px 10px rgba(0,0,0,.06)", textAlign: "center", boxSizing: "border-box" }}>
        <div className="sgt" style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Masuk sebagai Guru</div>
        <div style={{ fontSize: 13, color: THEMES.light.dim, marginBottom: 24, lineHeight: 1.5 }}>Layar Persiapan &amp; Panel Guru cuma bisa dibuka setelah login. Siswa tetap bisa join permainan lewat scan QR tanpa perlu login.</div>
        <button onClick={onSignIn} disabled={busy} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, width: "100%", background: "#F4B740", color: "#101B34", border: "none", borderRadius: 12, padding: "14px 18px", fontWeight: 700, fontSize: 15, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, boxSizing: "border-box" }}>
          <span className="sgt" style={{ fontSize: 16, lineHeight: 1 }}>G</span> {busy ? "Membuka jendela login…" : "Masuk dengan Google"}
        </button>
        {error && <div style={{ marginTop: 12, fontSize: 12.5, color: "#EF5B5B" }}>{error}</div>}
      </div>
    </div>
  );
}

/* ===========================================================
   PEMILIH GAME (layar paling awal, khusus guru yang sudah login)
=========================================================== */
const GAMES = [
  { id: "g1", name: "Word Search", tag: "Kelompok", desc: "Word search kelompok dengan petunjuk audio & buzzer", available: true, icon: "🔍", accent: "#3E7CB1", accentSoft: "#E8F1F8" },
  { id: "g2", name: "Mystery Box", tag: "Individu", desc: "Pilih nomor, buka kotaknya, kerjakan perintah rahasia di dalamnya", available: true, icon: "🎁", accent: "#D98A2B", accentSoft: "#FBF0E1" },
  { id: "g3", name: "Card Rush", tag: "Balapan kelompok", desc: "Balapan memasangkan kartu gambar & kata, papan sendiri-sendiri per kelompok", available: true, icon: "🃏", accent: "#C45B5B", accentSoft: "#FAEAEA" },
];

function greetingByHour() {
  const h = new Date().getHours();
  if (h < 11) return "Selamat pagi";
  if (h < 15) return "Selamat siang";
  if (h < 19) return "Selamat sore";
  return "Selamat malam";
}

// Motif dekoratif bertema Jepang di latar halaman Pilih Game — huruf kana & kanji yang relevan
// dengan konteks aplikasi (bahasa, sekolah, sakura), sangat samar & posisinya tetap (bukan
// diacak tiap render) supaya tidak "meloncat" saat komponen re-render karena state lain berubah.
const BG_MOTIFS = [
  { ch: "あ", top: "6%", left: "5%", size: 96, rot: -14 },
  { ch: "語", top: "12%", left: "89%", size: 108, rot: 9 },
  { ch: "サ", top: "70%", left: "8%", size: 72, rot: 10 },
  { ch: "本", top: "78%", left: "86%", size: 84, rot: -8 },
  { ch: "桜", top: "42%", left: "95%", size: 60, rot: 6 },
  { ch: "カ", top: "58%", left: "1%", size: 56, rot: -16 },
  { ch: "学", top: "3%", left: "46%", size: 60, rot: 5 },
  { ch: "字", top: "88%", left: "44%", size: 58, rot: -6 },
];
function JapaneseBackdrop({ theme }) {
  const color = theme === "dark" ? "rgba(244,241,232,.05)" : "rgba(16,27,52,.045)";
  return (
    <div style={{ position: "fixed", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }} className="jp-backdrop">
      {BG_MOTIFS.map((m, i) => (
        <span key={i} className="sgt" style={{
          position: "absolute", top: m.top, left: m.left, fontSize: m.size, fontWeight: 700,
          color, transform: `rotate(${m.rot}deg)`, userSelect: "none", lineHeight: 1,
        }}>{m.ch}</span>
      ))}
    </div>
  );
}

function App() {
  const [activeGame, setActiveGame] = useState(() => {
    try { return localStorage.getItem("app-active-game") || null; } catch (e) { return null; }
  });
  // Tema khusus halaman Pilih Game — terpisah dari tema masing-masing game (tiap game simpan
  // preferensinya sendiri). Disimpan supaya pilihan guru diingat tiap kali buka halaman ini lagi.
  const [pickerTheme, setPickerTheme] = useState(() => {
    try { return localStorage.getItem("app-theme") || "light"; } catch (e) { return "light"; }
  });
  useEffect(() => {
    try { localStorage.setItem("app-theme", pickerTheme); } catch (e) {}
  }, [pickerTheme]);
  // undefined = status login belum diketahui (baru buka web), null = sudah tahu tapi belum login
  const [authUser, setAuthUser] = useState(undefined);
  const [signingIn, setSigningIn] = useState(false);
  const [loginError, setLoginError] = useState("");
  const joinCode = getJoinCodeFromUrl();

  useEffect(() => {
    try {
      if (activeGame) localStorage.setItem("app-active-game", activeGame);
      else localStorage.removeItem("app-active-game");
    } catch (e) {}
  }, [activeGame]);

  // Pantau status login. Untuk siswa (buka lewat ?join=...), sesi ANONIM dibuat otomatis di
  // background — tidak perlu tombol login. Untuk guru, sesi anonim TIDAK dianggap "sudah login":
  // guru wajib klik "Masuk dengan Google" di TeacherLoginScreen sebelum masuk layar Persiapan.
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => setAuthUser(user));
    if (joinCode) ensureAnonymousAuth();
    return unsub;
  }, [joinCode]);

  function handleTeacherSignIn() {
    setSigningIn(true); setLoginError("");
    signInTeacherWithGoogle()
      .catch((err) => {
        console.error("Gagal login Google:", err);
        const code = err && err.code;
        // BUGFIX: pesan generik "Gagal masuk. Coba lagi." tidak membantu diagnosa —
        // kode error Firebase Auth biasanya langsung menunjuk penyebab pastinya
        // (domain belum diizinkan, provider belum diaktifkan, popup diblokir browser, dst).
        const messages = {
          "auth/popup-closed-by-user": "Login dibatalkan.",
          "auth/unauthorized-domain": "Domain website ini belum diizinkan di Firebase Console (Authentication → Settings → Authorized domains).",
          "auth/operation-not-allowed": "Login Google belum diaktifkan di Firebase Console (Authentication → Sign-in method).",
          "auth/popup-blocked": "Jendela popup login diblokir browser. Izinkan popup untuk situs ini lalu coba lagi.",
          "auth/network-request-failed": "Gagal terhubung ke internet. Cek koneksi lalu coba lagi.",
          "auth/email-not-allowed": "Login dibatasi hanya untuk email @student.ub.ac.id untuk sementara.",
        };
        setLoginError(messages[code] || `Gagal masuk${code ? ` (${code})` : ""}. Coba lagi.`);
      })
      .finally(() => setSigningIn(false));
  }

  const stillConnecting = authUser === undefined || (joinCode && !authUser);
  if (stillConnecting) {
    return (
      <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: THEMES.light.bg, color: THEMES.light.dim, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>
        Menghubungkan…
      </div>
    );
  }

  if (joinCode) return <StudentJoinScreen roomCode={joinCode} />;

  // Dari sini ke bawah khusus guru — sesi anonim (mis. bekas siswa join di device yang sama)
  // tidak dianggap login guru yang valid.
  if (!authUser || authUser.isAnonymous) {
    return <TeacherLoginScreen onSignIn={handleTeacherSignIn} busy={signingIn} error={loginError} />;
  }

  if (activeGame === "g1") return <TebakCariKataGame onBack={() => setActiveGame(null)} teacher={authUser} />;
  if (activeGame === "g2") return <BukaKotakGame onBack={() => setActiveGame(null)} />;
  if (activeGame === "g3") return <CocokkanKartuGame onBack={() => setActiveGame(null)} />;

  const initial = (authUser.displayName || authUser.email || "?").trim().charAt(0).toUpperCase();
  const firstName = (authUser.displayName || authUser.email || "Guru").split("@")[0].split(" ")[0];
  const pt = THEMES[pickerTheme];
  return (
    <div className="pilih-game-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: pt.bg, color: pt.text, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, boxSizing: "border-box", position: "relative", overflow: "hidden" }}>
      <style>{fontImport}</style>
      <JapaneseBackdrop theme={pickerTheme} />
      <div style={{ width: "100%", maxWidth: 820, position: "relative", zIndex: 1 }}>
        <div className="pilih-game-header" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 4 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div className="sgt pilih-game-avatar" style={{ width: 46, height: 46, borderRadius: "50%", background: "linear-gradient(135deg,#F4B740,#D98A2B)", color: "#101B34", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 700, boxShadow: "0 3px 10px rgba(217,138,43,.35)", flexShrink: 0 }}>{initial}</div>
            <div>
              <div className="sgt pilih-game-title" style={{ fontSize: 30, fontWeight: 700, letterSpacing: -0.4 }}>Pilih Game</div>
              <div style={{ fontSize: 13, color: pt.dim, marginTop: 2 }}>{greetingByHour()}, {firstName} 👋</div>
            </div>
          </div>
          <div className="pilih-game-actions" style={{ display: "flex", gap: 8 }}>
            <ThemeToggleButton theme={pickerTheme} onToggle={() => setPickerTheme((th) => th === "dark" ? "light" : "dark")} style={{ background: pt.panel, border: `1px solid ${pt.border}`, color: pt.text, padding: 10, borderRadius: 10, cursor: "pointer", boxShadow: "0 2px 10px rgba(0,0,0,.06)" }} />
            <button onClick={() => signOutTeacher()} style={{ background: pt.panel, border: `1px solid ${pt.border}`, color: pt.dim, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, boxShadow: "0 2px 10px rgba(0,0,0,.06)" }}>Keluar</button>
          </div>
        </div>
        <div style={{ fontSize: 14, color: pt.dim, marginBottom: 26, maxWidth: 520 }}>Web interaktif siswa SMA — pilih salah satu permainan di bawah ini untuk mulai sesi.</div>
        <div className="game-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 230px))", gap: 20, justifyContent: "center", perspective: 1200 }}>
          {GAMES.map((g, i) => (
            <button
              key={g.id}
              className="game-card"
              onClick={() => g.available && setActiveGame(g.id)}
              disabled={!g.available}
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center",
                background: pt.panel, border: `1px solid ${pt.border}`, borderRadius: 20, padding: "26px 20px 22px", color: pt.text,
                cursor: g.available ? "pointer" : "default", opacity: g.available ? 1 : 0.45,
                boxShadow: pickerTheme === "dark" ? "0 2px 10px rgba(0,0,0,.3)" : "0 2px 10px rgba(28,32,51,.06)",
                animationDelay: `${i * 110}ms`, "--shimmer-delay": `${450 + i * 110}ms`,
                "--accent": g.accent, "--accent-soft": g.accentSoft, "--accent-shadow": g.accent + "40",
              }}
            >
              <div className="icon-badge" style={{ width: 54, height: 54, borderRadius: 15, background: g.accentSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 25, marginBottom: 14, flexShrink: 0 }}>{g.icon}</div>
              <div className="sgt" style={{ fontSize: 16.5, fontWeight: 700, marginBottom: 6 }}>{g.name}</div>
              <div style={{ display: "inline-block", fontSize: 10.5, fontWeight: 600, color: g.accent, background: g.accentSoft, padding: "3px 10px", borderRadius: 999, marginBottom: 12, letterSpacing: 0.2 }}>{g.tag}</div>
              <div style={{ fontSize: 12.5, color: pt.dim, lineHeight: 1.5, marginBottom: 20 }}>{g.desc}{!g.available ? " · segera" : ""}</div>
              <div className="arrow-chip sgt" style={{ fontSize: 12, fontWeight: 700, color: g.accent, background: g.accentSoft, padding: "8px 18px", borderRadius: 999, marginTop: "auto" }}>Mulai →</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
