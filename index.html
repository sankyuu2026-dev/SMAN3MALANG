/* ---------------------------------------------------------

   Library yang cuma dipakai guru (qrcodejs) tidak ikut diunduh saat halaman

const _scriptCache = {};
function loadScriptOnce(src) {
  if (_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = () => resolve();
    el.onerror = () => { delete _scriptCache[src]; reject(new Error("Gagal memuat " + src)); };
    document.head.appendChild(el);
  });
  return _scriptCache[src];
}
function loadQrLibrary() {
  return loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js");
}
// Tanpa sesi login sama sekali, security rules Firestore/Storage tidak punya cara membedakan
// "aplikasi ini" dari script sembarangan (kalau rules-nya "allow write: if true", siapa pun bisa
// menulis/menghapus data siapa saja lewat DevTools). Ada dua jenis sesi di app ini:
// - Siswa yang scan QR: masuk ANONIM otomatis, tanpa perlu akun — cukup untuk fitur buzzer/join.
// - Guru: WAJIB login pakai akun Google (lihat TeacherLoginScreen), supaya data tiap guru
//   (Riwayat sesi, audio soal) bisa dipisah per-akun dan tidak sembarang orang bisa masuk ke
//   layar Persiapan/Panel Guru.
function ensureAnonymousAuth() {
  return new Promise((resolve) => {
    const unsub = auth.onAuthStateChanged((user) => {
      if (user) { unsub(); resolve(user); }
      else auth.signInAnonymously().catch((err) => console.error("Gagal masuk anonim:", err));
    });
  });
}
// FITUR BARU: dulu hanya email @student.ub.ac.id yang boleh login (daftar tetap di kode,
// TEACHER_EMAIL_ALLOWLIST kosong selamanya kecuali diedit manual & di-deploy ulang). Sekarang
// guru yang SUDAH login bisa menambahkan email guru lain langsung dari halaman Pengaturan
// ("Akun" tab), tersimpan di Firestore (koleksi teacherAllowlist, id dokumen = email huruf
// kecil) — tidak perlu edit kode/deploy ulang lagi tiap kali ada guru baru.
//
// PENTING (keamanan, wajib dikerjakan di Firebase Console → Firestore → Rules, bukan di file
// ini): tanpa Firestore Security Rules yang membatasi, siapa pun yang tahu konfigurasi Firebase
// project ini bisa menulis langsung ke koleksi teacherAllowlist dari luar aplikasi (melewati
// tombol "Tambah" di halaman Pengaturan) dan menambahkan email sembarang supaya bisa login.
// Contoh rule minimal yang perlu ditambahkan:
//   match /teacherAllowlist/{email} {
//     allow read: if request.auth != null;
//     allow create, delete: if request.auth != null
//       && exists(/databases/$(database)/documents/teacherAllowlist/$(request.auth.token.email.lower()))
//       || request.auth.token.email.lower().matches('.*@student[.]ub[.]ac[.]id$');
//   }
// (Sesuaikan lagi kalau perlu — intinya: hanya guru yang SUDAH tercatat/berdomain kampus yang
// boleh menambah/menghapus entri di koleksi ini.)
const TEACHER_ALLOWED_DOMAINS = ["student.ub.ac.id"];
const TEACHER_EMAIL_ALLOWLIST = [];
async function isEmailAllowedForTeacher(email) {
  if (!email) return false;
  const lower = email.toLowerCase();
  if (TEACHER_EMAIL_ALLOWLIST.includes(lower)) return true;
  if (TEACHER_ALLOWED_DOMAINS.some((domain) => lower.endsWith("@" + domain))) return true;
  try {
    const snap = await db.collection("teacherAllowlist").doc(lower).get();
    return snap.exists;
  } catch (e) {
    return false; // offline/gagal cek — jangan diam-diam meloloskan siapa pun
  }
}
function signInTeacherWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  // FIX: dulu ada `provider.setCustomParameters({ hd: "student.ub.ac.id" })` di sini — ini
  // membatasi pilihan akun Google HANYA ke domain itu di level Google sendiri, SEBELUM kode kita
  // sempat mengecek apa pun. Akibatnya guru dengan email lain (mis. guru pamong yang sudah
  // ditambahkan lewat halaman Pengaturan) tidak akan bisa memilih akunnya sama sekali di jendela
  // login Google — bukan ditolak sesudah login, tapi memang tidak muncul sebagai pilihan.
  // Dihapus supaya semua akun Google bisa dipilih; pembatasan sesungguhnya tetap dilakukan
  // sesudahnya lewat isEmailAllowedForTeacher() di bawah.
  return auth.signInWithPopup(provider).then(async (result) => {
    const email = result.user && result.user.email;
    if (!(await isEmailAllowedForTeacher(email))) {
      return auth.signOut().then(() => {
        const err = new Error("Email tidak diizinkan");
        err.code = "auth/email-not-allowed";
        throw err;
      });
    }
    return result;
  });
}
function signOutTeacher() {

}

/* ---------------------------------------------------------
   PENYIMPANAN LOKAL YANG "BERISIK"
   Dulu semua localStorage.setItem dibungkus try/catch kosong, jadi kalau kuota
   browser penuh (gampang terjadi karena audio disimpan base64) penyimpanan gagal
   diam-diam — guru baru sadar kosakatanya hilang setelah refresh. safeSetItem
   mengembalikan status kegagalan supaya UI bisa menampilkan peringatan.
--------------------------------------------------------- */
function isQuotaError(e) {
  if (!e) return false;
  return e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22 || e.code === 1014;
}
function safeSetItem(key, value) {
  try {
    localStorage.setItem(key, value);
    return { ok: true };
  } catch (e) {
    return {
      ok: false,
      quota: isQuotaError(e),
      message: isQuotaError(e)
        ? "Penyimpanan browser penuh — perubahan terakhir BELUM tersimpan. Hapus audio yang tidak terpakai, atau ekspor cadangan lalu bersihkan data."
        : "Browser menolak menyimpan data (mungkin mode penyamaran/incognito). Perubahan terakhir BELUM tersimpan.",
    };
  }
}
// Perkiraan pemakaian kuota localStorage untuk domain ini (dipakai buat indikator di UI).
function estimateStorageUsage() {
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      total += (k.length + (localStorage.getItem(k) || "").length) * 2; // UTF-16 ≈ 2 byte/char
    }
    return total;
  } catch (e) { return 0; }
}
function formatBytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}
// FITUR BARU: format detik jadi "mm:ss" — dipakai buat pengatur & tampilan hitung mundur waktu
// per babak Card Rush (baik di panel guru maupun layar siswa).
function formatDuration(totalSec) {
  const sec = Math.max(0, Math.round(totalSec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
// FITUR BARU (perbaikan kinerja): dulu gambar kartu Card Rush disimpan APA ADANYA dari file
// yang dipilih guru (cuma ditolak kalau lebih dari 250KB) — jadi guru harus mengompres sendiri
// dulu pakai aplikasi lain sebelum unggah, dan hasilnya sering "mepet" ke batas 250KB. Begitu
// "Mulai Babak Ini" ditekan, SEMUA gambar valid babak itu diunggah ulang sekaligus ke Firestore
// (lihat startRound()) — kalau satu babak punya 10+ pasang dan tiap gambar mepet 250KB, totalnya
// bisa 2-3MB dikirim sekaligus, jadi tombolnya terasa macet beberapa detik.
// Sekarang setiap foto OTOMATIS diperkecil & dikompres di browser guru (lewat <canvas>) sebelum
// disimpan — foto HP yang aslinya beberapa MB & beresolusi besar diciutkan ke maksimal 480px sisi
// terpanjang dan disimpan sebagai JPEG kualitas menengah, karena toh kartu ditampilkan kecil di
// papan permainan, jadi resolusi tinggi cuma buang-buang ukuran file tanpa menambah kejelasan.
// Hasilnya biasanya jauh di bawah 250KB TANPA guru perlu mengompres manual, sekaligus membuat
// "Mulai Babak Ini" jauh lebih cepat karena total data yang diunggah ke Firestore jauh lebih kecil.
function compressImageFile(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width <= 0 || height <= 0) { reject(new Error("Gambar tidak valid.")); return; }
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      if (!ctx) { reject(new Error("Browser tidak mendukung pemrosesan gambar.")); return; }
      // Latar putih dulu — kalau sumbernya PNG transparan, biar tidak berubah jadi hitam
      // begitu disimpan ulang sebagai JPEG (JPEG tidak punya kanal transparansi).
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Gagal memuat gambar — coba file lain.")); };
    img.src = url;
  });
}

// FITUR BARU: kompresi audio petunjuk (dipakai Word Search) sebelum disimpan — semangatnya sama
// dengan compressImageFile() di atas (audio HP guru sering beberapa MB, numpuk di kuota
// localStorage yang cuma 5-10MB total), TAPI beda mendasar dari gambar: tidak ada API instan
// semacam <canvas> untuk audio. Satu-satunya cara re-encode audio murni di browser tanpa memuat
// pustaka eksternal adalah memutar ulang audionya lewat AudioContext sambil merekam ULANG dalam
// format terkompresi (WebM/Opus) pakai MediaRecorder — dan karena ini benar-benar MEMUTAR ULANG
// real-time (bukan diproses instan), prosesnya makan waktu SAMA PERSIS dengan durasi audio
// aslinya (audio 8 detik → makan waktu ±8 detik untuk selesai dikompres), bukan sekejap.
// Fallback aman: kalau browser tidak mendukung MediaRecorder/format Opus, atau hasil kompresinya
// ternyata TIDAK lebih kecil dari aslinya, resolve(null) — pemanggilnya (uploadAudio) lalu
// otomatis pakai file asli tanpa kompresi, tidak pernah gagal total karena ini.
function compressAudioFile(file) {
  return new Promise((resolve) => {
    const AudioContextCls = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCls || typeof MediaRecorder === "undefined") { resolve(null); return; }
    let mimeType = null;
    for (const candidate of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidate)) { mimeType = candidate; break; }
    }
    if (!mimeType) { resolve(null); return; } // browser lawas (mis. Safari versi lama) — lewati kompresi

    const reader = new FileReader();
    reader.onload = () => {
      const audioCtx = new AudioContextCls();
      audioCtx.decodeAudioData(reader.result, (audioBuffer) => {
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        const dest = audioCtx.createMediaStreamDestination();
        source.connect(dest);
        let recorder;
        try {
          recorder = new MediaRecorder(dest.stream, { mimeType, audioBitsPerSecond: 48000 });
        } catch (e) { audioCtx.close(); resolve(null); return; }
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          audioCtx.close();
          const blob = new Blob(chunks, { type: mimeType });
          const fr = new FileReader();
          fr.onload = () => resolve({ dataUrl: fr.result, size: blob.size });
          fr.onerror = () => resolve(null);
          fr.readAsDataURL(blob);
        };
        recorder.onerror = () => { audioCtx.close(); resolve(null); };
        recorder.start();
        source.start(0);
        // Jeda kecil setelah audio selesai sebelum berhenti merekam, supaya ekor suara/gema
        // terakhir tidak ikut terpotong persis di ujung durasi.
        source.onended = () => setTimeout(() => { if (recorder.state !== "inactive") recorder.stop(); }, 150);
      }, () => { audioCtx.close(); resolve(null); });
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file);
  });
}

/* ---------------------------------------------------------
   BUGFIX (kebocoran data antar-guru): dulu SEMUA key localStorage kosakata/progres di bawah
   ("tck-setup-data", "tck-progress", "bk-setup-data", "bk-progress", "cck-setup-data",
   "custom-tema-list", "custom-tema-list-meta") bersifat GLOBAL satu browser — tidak dipisah
   per akun guru sama sekali. Padahal Riwayat Sesi & audio petunjuk sudah sengaja dipisah per
   `teacher.uid` di Firestore (lihat komentar TeacherLoginScreen), justru supaya data tiap guru
   tidak sembarang tercampur. Kalau satu komputer/laptop dipakai bergantian oleh beberapa guru
   (mis. komputer lab bahasa), Guru B yang login akan langsung melihat & bisa menimpa kosakata
   Guru A tanpa peringatan apa pun, dan efek auto-save bahkan bisa menyalin data Guru A itu ke
   cadangan cloud milik Guru B. scopedKey() menambahkan UID guru ke setiap key supaya tiap akun
   punya "kotak" localStorage sendiri-sendiri. Untuk guru yang sudah lebih dulu punya data di key
   lama (sebelum perbaikan ini), migrateLegacyKey() menyalin SEKALI SAJA data lama itu ke key baru
   miliknya saat pertama kali key baru belum ada — supaya guru yang sudah pakai aplikasi ini tidak
   kehilangan kosakata yang sudah disusun.
--------------------------------------------------------- */
function scopedKey(base, uid) {
  return uid ? `${base}::${uid}` : base;
}
function migrateLegacyKey(base, uid) {
  const newKey = scopedKey(base, uid);
  try {
    if (!uid) return newKey; // belum login (seharusnya tidak terjadi di layar guru) — pakai key lama apa adanya
    if (localStorage.getItem(newKey) !== null) return newKey; // sudah punya key sendiri, tidak perlu migrasi
    const legacy = localStorage.getItem(base);
    if (legacy !== null) {
      localStorage.setItem(newKey, legacy);
      // BUGFIX: dulu key lama TIDAK dihapus setelah disalin — niatnya migrasi "sekali saja" untuk
      // guru yang memang sudah lebih dulu punya data di key lama itu. Tapi karena tidak pernah
      // dihapus, guru KEDUA/KETIGA/dst yang login PERTAMA KALINYA di perangkat yang sama (mis.
      // komputer lab bahasa dipakai bergantian) ikut memicu migrasi ini juga — dan berakhir
      // mewarisi SALINAN data milik guru yang paling pertama, bukan mulai dari kosong. Ini
      // mengulang lagi masalah "data guru lain sembarang tercampur" yang justru ingin dihindari
      // oleh fungsi ini. Key lama dihapus setelah migrasi pertama supaya cuma guru yang MEMANG
      // pemilik data lama itu yang menerimanya; guru berikutnya mulai bersih.
      localStorage.removeItem(base);
    }
  } catch (e) {}
  return newKey;
}

/* ---------------------------------------------------------
   EKSPOR / IMPOR CADANGAN
   Semua materi & kosakata cuma hidup di localStorage browser itu. Ganti laptop,
   bersihkan cache, atau buka lewat incognito = hilang semua. Dua fungsi ini bikin
   guru bisa menyimpan cadangan ke file .json dan memuatnya lagi kapan saja.
--------------------------------------------------------- */
function downloadJson(filename, dataObj) {
  try {
    const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) { return false; }
}
// FITUR BARU: dulu guru harus buka Persiapan tiap game SATU-SATU untuk mengunduh cadangan
// (.json) tiap game lewat tombol "Cadangkan" masing-masing. Fungsi ini dipakai tombol "Simpan
// Semua Data" di layar "Pilih Game" — membaca data TERSIMPAN (localStorage, format & lokasinya
// PERSIS sama seperti yang dibaca tiap game lewat migrateLegacyKey) untuk KETIGA game sekaligus,
// digabung jadi SATU file .json (bukan 3 file terpisah seperti versi sebelumnya — lebih gampang
// disimpan/dikirim, dan waktu dimuat lagi cuma perlu unggah satu file, bukan pilih tiga-tiganya).
const ALL_GAMES_BACKUP_META = [
  { storageKey: "tck-setup-data", appId: "tebak-cari-kata" },
  { storageKey: "bk-setup-data", appId: "buka-kotak" },
  { storageKey: "cck-setup-data", appId: "card-rush" },
];
function exportAllGamesBackup(uid) {
  const games = {};
  let skipped = 0;
  ALL_GAMES_BACKUP_META.forEach(({ storageKey, appId }) => {
    try {
      const raw = localStorage.getItem(migrateLegacyKey(storageKey, uid));
      if (!raw) { skipped++; return; } // guru belum pernah isi materi apa pun di game ini — lewati
      const parsed = JSON.parse(raw);
      if (!parsed.dataByMateri) { skipped++; return; }
      games[appId] = appId === "card-rush"
        ? { dataByMateri: parsed.dataByMateri }
        : { selectedMateri: parsed.selectedMateri, dataByMateri: parsed.dataByMateri };
    } catch (e) { console.error("Gagal ekspor cadangan gabungan:", appId, e); }
  });
  const gameCount = Object.keys(games).length;
  if (gameCount === 0) return { saved: false, skipped };
  const ok = downloadJson(`cadangan-sankyuu-semua-game-${todayStamp()}.json`, {
    app: "sankyuu-semua-game", version: 1, exportedAt: new Date().toISOString(), games,
  });
  return { saved: ok, gameCount, skipped };
}
// FITUR BARU: pasangan dari exportAllGamesBackup — terima SATU file .json gabungan (format baru,
// field `games` berisi data ketiga game sekaligus), lalu terapkan masing-masing ke localStorage
// game terkait. Ditulis LANGSUNG ke localStorage (bukan lewat state React game masing-masing,
// karena game-nya belum tentu sedang dibuka) — begitu guru membuka game itu nanti, data yang
// baru dimuat otomatis kebaca seperti biasa. Materi dengan nama sama DITIMPA, materi lain & field
// lain (puzzleByBabak, surprises, dst.) yang sudah ada di localStorage TETAP aman karena
// di-merge, bukan ditimpa seluruhnya. File cadangan LAMA (dari versi sebelum fitur ini digabung
// jadi satu file, satu file per game dengan field `app` di root, bukan `games`) tetap dikenali
// juga, supaya cadangan lama masih bisa dipakai.
function importAllGamesBackup(uid, file) {
  return readJsonFile(file).then((data) => {
    // Format baru: satu file, field `games` berisi data ketiga game.
    // Format lama (sebelum digabung): satu file per game, field `app` di root langsung.
    const gamesData = data.games || (data.app ? { [data.app]: data } : null);
    if (!gamesData) return { updated: 0, skipped: 1, failed: 0 };
    let updated = 0, skipped = 0, failed = 0;
    ALL_GAMES_BACKUP_META.forEach(({ storageKey, appId }) => {
      const gameData = gamesData[appId];
      if (!gameData || !gameData.dataByMateri) { if (gamesData[appId] !== undefined) failed++; return; }
      try {
        const raw = localStorage.getItem(migrateLegacyKey(storageKey, uid));
        let existing = {};
        try { existing = raw ? JSON.parse(raw) : {}; } catch (e) { existing = {}; }
        const merged = {
          ...existing,
          dataByMateri: { ...(existing.dataByMateri || {}), ...gameData.dataByMateri },
          selectedMateri: gameData.selectedMateri || existing.selectedMateri,
          savedAt: Date.now(),
        };
        const res = safeSetItem(scopedKey(storageKey, uid), JSON.stringify(merged));
        res.ok ? updated++ : failed++;
      } catch (e) { console.error("Gagal muat cadangan gabungan:", appId, e); failed++; }
    });
    if (updated === 0 && failed === 0) skipped = 1;
    return { updated, skipped, failed };
  }).catch((e) => { console.error("Gagal baca file cadangan gabungan:", e); return { updated: 0, skipped: 0, failed: 1 }; });
}
function readJsonFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { resolve(JSON.parse(reader.result)); }
      catch (e) { reject(new Error("File tidak bisa dibaca — pastikan itu file cadangan .json dari aplikasi ini.")); }
    };
    reader.onerror = () => reject(new Error("Gagal membaca file."));
    reader.readAsText(file);
  });
}
function todayStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// FITUR BARU: kosakata/materi (Word Search & Mystery Box) dan kata+gambar (Card Rush)
// sebelumnya CUMA tersimpan di localStorage browser — kalau riwayat/data browser dibersihkan
// ("Clear browsing data" → "Cookies and other site data"), atau guru pindah device/browser,
// SEMUA kosakata yang sudah disusun hilang total tanpa jejak, karena Firebase tidak pernah ikut
// menyimpannya sama sekali (beda dengan "Riwayat Sesi" yang memang sudah di Firestore).
// Kedua fungsi ini menambahkan "cadangan otomatis" ke Firestore di bawah akun guru yang sedang
// login (users/{uid}/setupData/{docName}) — localStorage TETAP jadi sumber utama (lebih cepat,
// tetap jalan walau offline), Firestore cuma penyelamat kalau localStorage-nya hilang/basi.
// `savedAt` (angka Date.now() biasa, BUKAN firebase.firestore.FieldValue.serverTimestamp())
// dipakai untuk membandingkan mana yang lebih baru antara salinan lokal & salinan cloud saat
// dimuat — serverTimestamp() sengaja tidak dipakai di sini karena nilainya masih `null` sesaat
// sebelum server mengonfirmasi, jadi tidak bisa langsung dibandingkan secara numerik saat itu juga.
function loadSetupFromCloud(uid, docName) {
  if (!uid) return Promise.resolve(null);
  return db.collection("users").doc(uid).collection("setupData").doc(docName).get()
    .then((snap) => (snap.exists ? snap.data() : null))
    .catch((err) => { console.error("loadSetupFromCloud gagal:", docName, err); return null; }); // offline/gagal — diam-diam ke UI, localStorage yang sudah dimuat tetap dipakai, tapi tetap dicatat ke console supaya bisa dilacak
}
function saveSetupToCloud(uid, docName, payload) {
  if (!uid) return Promise.reject(new Error("belum login"));
  // FITUR BARU: dulu fungsi ini tidak me-return promise-nya sama sekali, jadi pemanggil tidak
  // bisa tahu kapan proses simpan selesai atau gagal — makanya guru sempat was-was apa datanya
  // BENAR-BENAR tersimpan di Firestore atau tidak (tidak ada penanda apa pun di layar). Sekarang
  // promise-nya dikembalikan supaya pemanggil (lihat useCloudSaveStatus di bawah) bisa menunggu
  // hasilnya dan menampilkan status "Tersimpan di cloud" / "Gagal" langsung di layar Persiapan.
  return db.collection("users").doc(uid).collection("setupData").doc(docName)
    .set({ ...payload, savedAt: Date.now() })
    .catch((err) => { console.error("saveSetupToCloud gagal:", docName, err); throw err; }); // best-effort ke UI (kegagalan di sini tidak boleh mengganggu penyimpanan lokal), tapi tetap dicatat & dilempar lagi supaya status di layar bisa diperbarui
}

// BUGFIX (Card Rush — dokumen backup melebihi batas 1MB Firestore): saveSetupToCloud generik di
// atas menjejalkan SELURUH dataByMateri (termasuk gambar base64 tiap pasangan kartu, dari SEMUA
// tema & babak sekaligus) ke SATU dokumen Firestore. Firestore membatasi ukuran 1 dokumen maks
// 1.048.576 byte (1 MiB) — begitu total gambarnya melewati itu (gampang terjadi kalau guru sudah
// punya banyak tema/babak berisi gambar), penyimpanan cloud gagal TOTAL & diam-diam (localStorage
// tetap jalan normal, makanya guru baru sadar lewat pesan "Gagal simpan ke cloud" di layar).
// Perbaikannya: gambar dipisah dari dokumen utama, disimpan satu-satu di subcollection
// "pairImages" (dokumen kecil per pasangan kartu) — sama persis pola yang sudah terbukti aman
// dipakai saat main (lihat subcollection "cardPairs" di rooms/{roomCode}).
function splitCardRushImages(dataByMateri) {
  const images = {}; // pairId -> base64 image
  const skeleton = {};
  Object.keys(dataByMateri || {}).forEach((materiName) => {
    skeleton[materiName] = (dataByMateri[materiName] || []).map((babak) => ({
      ...babak,
      pairs: (babak.pairs || []).map((p) => {
        if (p.image) images[p.id] = p.image;
        const { image, ...rest } = p;
        return rest;
      }),
    }));
  });
  return { skeleton, images };
}
function mergeCardRushImages(dataByMateri, images) {
  const merged = {};
  Object.keys(dataByMateri || {}).forEach((materiName) => {
    merged[materiName] = (dataByMateri[materiName] || []).map((babak) => ({
      ...babak,
      pairs: (babak.pairs || []).map((p) => (images[p.id] ? { ...p, image: images[p.id] } : p)),
    }));
  });
  return merged;
}
async function saveCardRushSetupToCloud(uid, payload) {
  if (!uid) throw new Error("belum login");
  const { skeleton, images } = splitCardRushImages(payload.dataByMateri);
  const docRef = db.collection("users").doc(uid).collection("setupData").doc("cardRush");
  await docRef.set({ dataByMateri: skeleton, selectedMateri: payload.selectedMateri, savedAt: Date.now() });
  // Ganti seluruh isi subcollection gambar dengan yang terbaru (hapus semua dulu, baru tulis ulang)
  // — supaya pasangan kartu yang sudah dihapus/diganti gambarnya tidak menyisakan dokumen basi
  // (jumlah pasangan kartu realistis cuma puluhan, jadi hapus-tulis-ulang setiap simpan masih murah).
  const imagesCol = docRef.collection("pairImages");
  const existing = await imagesCol.get();
  const batch = db.batch();
  existing.docs.forEach((d) => batch.delete(d.ref));
  Object.keys(images).forEach((pairId) => batch.set(imagesCol.doc(pairId), { image: images[pairId] }));
  await batch.commit();
}
async function loadCardRushSetupFromCloud(uid) {
  if (!uid) return null;
  const docRef = db.collection("users").doc(uid).collection("setupData").doc("cardRush");
  const snap = await docRef.get().catch((err) => { console.error("loadCardRushSetupFromCloud gagal:", err); return null; });
  if (!snap || !snap.exists) return null;
  const data = snap.data();
  const imagesSnap = await imagesColSafe(docRef);
  const images = {};
  imagesSnap.forEach((d) => { images[d.id] = d.data().image; });
  if (data.dataByMateri) data.dataByMateri = mergeCardRushImages(data.dataByMateri, images);
  return data;
}
function imagesColSafe(docRef) {
  return docRef.collection("pairImages").get().then((s) => s.docs).catch((err) => { console.error("Gagal muat gambar cadangan Card Rush:", err); return []; });
}

// Hook kecil buat menampilkan status "Tersimpan di cloud" di layar Persiapan — dipakai bareng
// oleh Word Search, Mystery Box, dan Card Rush (Langkah konsistensi visual: satu penanda yang
// sama persis di ketiga game, bukan masing-masing bikin sendiri).
function useCloudSaveStatus() {
  const [status, setStatus] = useState("idle"); // idle | saving | saved | error
  const [savedAt, setSavedAt] = useState(null);
  function track(promise) {
    setStatus("saving");
    promise.then(() => { setStatus("saved"); setSavedAt(Date.now()); }).catch(() => setStatus("error"));
  }
  return { status, savedAt, track };
}

// Badge kecil penanda status simpan cloud, ditaruh di header layar Persiapan tiap game.
function CloudSaveBadge({ t, status, savedAt }) {
  if (status === "idle") return null;
  const cfg = {
    saving: { icon: "☁️", text: "Menyimpan ke cloud…", color: t.dim },
    saved: { icon: "✅", text: savedAt ? `Tersimpan di cloud • ${new Date(savedAt).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })}` : "Tersimpan di cloud", color: "#3FBFAD" },
    error: { icon: "⚠️", text: "Gagal simpan ke cloud (localStorage tetap aman)", color: "#EF5B5B" },
  }[status];
  return (
    <div title={status === "error" ? "Koneksi bermasalah atau Firestore Security Rules belum mengizinkan users/{uid}/setupData. Kosakata TETAP tersimpan di browser ini." : "Kosakata ini juga tersalin ke Firestore, jadi tetap ada kalau kamu login dari device lain."}
      style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 14, color: cfg.color, fontWeight: 600 }}>

// Dulu tiap game (Tebak & Cari Kata, Buka Kotak, Card Rush) menulis ulang fungsi
// exportBackup/importBackup masing-masing — isinya nyaris sama persis (unduh .json
// berstempel tanggal, validasi field "app", tampilkan pesan sukses/gagal), cuma beda nama
// app dan cara membangun/menerapkan isi datanya. Sekarang disatukan di sini; tiap game
// tinggal kirim `buildPayload` (apa yang disimpan) dan `applyPayload` (validasi + terapkan
// saat dimuat) sesuai bentuk data masing-masing.
//
// FITUR BARU: dulu exportBackup() SELALU menyimpan SEMUA materi sekaligus — guru yang cuma
// mau membagikan/mencadangkan SATU materi (mis. baru selesai isi "Kazoku" dan mau kirim ke
// guru lain) terpaksa ikut mengirim 9 materi lainnya juga. Sekarang buildPayload menerima
// parameter `scope` ("all" | "current") supaya tiap game bisa memilih data mana yang disertakan;
// game yang tidak mengenal konsep "materi" (Card Rush) boleh abaikan `scope`-nya.
function makeBackupHandlers({ appId, appLabel, buildPayload, applyPayload, setImportMsg }) {
  function exportBackup(scope, scopeSlug) {
    const suffix = scopeSlug ? `-${scopeSlug}` : "";
    const ok = downloadJson(`cadangan-${appId}${suffix}-${todayStamp()}.json`, {
      app: appId, version: 1, exportedAt: new Date().toISOString(), ...buildPayload(scope),
    });
    setImportMsg(ok
      ? { ok: true, text: "Cadangan berhasil diunduh. Simpan file itu di tempat aman." }
      : { ok: false, text: "Gagal membuat file cadangan." });
  }
  function importBackup(file) {
    if (!file) return;
    readJsonFile(file).then((data) => {
      if (!data || data.app !== appId) throw new Error(`File ini bukan cadangan ${appLabel}.`);
      applyPayload(data);
    }).catch((err) => setImportMsg({ ok: false, text: err.message || "Gagal memuat cadangan." }));
  }
  return { exportBackup, importBackup };
}

/* ---------------------------------------------------------
   EFEK PERAYAAN saat jawaban benar — nada dibuat langsung lewat
   Web Audio API (bukan file audio eksternal), jadi tidak butuh
   koneksi internet, tidak butuh unggah aset, dan langsung bunyi
   tanpa jeda loading.
--------------------------------------------------------- */
function playCorrectSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const notes = [660, 880, 1320]; // arpeggio naik pendek — kesan "ding-ding-ding!" ceria
    notes.forEach((freq, i) => {
      const t0 = ctx.currentTime + i * 0.09;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.2, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.34);
    });
    setTimeout(() => ctx.close(), 700);
  } catch (e) { /* browser tanpa Web Audio API — abaikan saja, tidak fatal */ }
}
// FITUR BARU (Mystery Box): nada "pop" pendek & lembut untuk buka kotak BIASA — sengaja dibuat
// jauh lebih simpel/pelan daripada playCorrectSound() supaya kotak SPESIAL (yang pakai
// playCorrectSound + confetti) terasa jelas lebih "wah", bukan cuma efek suara yang sama.
function playPopSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(760, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.16);
    setTimeout(() => ctx.close(), 400);
  } catch (e) { /* abaikan, tidak fatal */ }
}
// FITUR BARU (Mystery Box): pesan kejutan untuk kotak SPESIAL — dipilih acak saat kotak spesial
// dibuka (bukan ditetapkan di awal), supaya kotak spesial yang sama bisa kasih kejutan berbeda
// kalau papannya di-reset & dimainkan ulang. Sengaja ringan/menyenangkan, bukan soal tambahan —
// karena Mystery Box ini permainan individu tanpa skor, "hadiah"-nya berupa apresiasi sosial
// kecil, bukan poin (tidak ada sistem skor sama sekali di game ini untuk poin ditambahkan ke).
const MYSTERY_BOX_SURPRISES = [
  "🎉 Kotak Keberuntungan! Minta tepuk tangan meriah dari seisi kelas.",
  "⭐ Jackpot! Kamu boleh lewati giliran menjawab kali ini — langsung pilih kotak lain.",
  "🍀 Beruntung! Ajak satu teman untuk maju bareng menjawab kotak berikutnya.",
  "🎁 Hadiah kejutan! Gurumu akan memberi pujian spesial untukmu.",
  "🥳 Selamat! Kamu dapat giliran ekstra — boleh langsung pilih satu kotak lagi.",
  "✨ Kotak Ajaib! Pilih teman yang harus bernyanyi lagu Jepang pendek sebagai hukuman lucu.",
];
// Sebaran partikel confetti di sekeliling titik tengah layar. `accentColor` biasanya warna
// kelompok yang baru menjawab benar, supaya perayaannya terasa "milik" kelompok itu.
function makeConfettiBurst(accentColor) {
  const palette = [accentColor, "#F4B740", "#3FBFAD", "#F2879E", "#5DA9E9", "#8FBF6B"];
  const count = 26;
  return Array.from({ length: count }, (_, i) => {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const dist = 90 + Math.random() * 170;
    return {
      id: `${Date.now()}-${i}`,
      color: palette[i % palette.length],
      size: 6 + Math.random() * 6,
      round: Math.random() > 0.5,
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist - 50, // sedikit condong ke atas biar terasa "meletup"
      rot: (Math.random() - 0.5) * 480,
      dur: 700 + Math.random() * 500,
      delay: Math.random() * 70,
    };
  });
}
// Overlay full-screen yang menampilkan partikel confetti. Dipasang di layar Proyektor DAN
// Panel Kontrol guru (keduanya pakai state `confetti` yang sama) supaya perayaannya terasa
// di kedua tampilan, bukan cuma satu sisi.
function CelebrationOverlay({ particles }) {
  if (!particles || particles.length === 0) return null;
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 95, overflow: "hidden" }}>
      {particles.map((p) => (
        <span key={p.id} style={{
          position: "absolute", top: "38%", left: "50%", width: p.size, height: p.size,
          background: p.color, borderRadius: p.round ? "50%" : 3,
          "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`,
          animation: `confettiPop ${p.dur}ms cubic-bezier(.15,.7,.3,1) ${p.delay}ms forwards`,
          opacity: 0,
        }} />
      ))}
    </div>
  );
}

function seedWithIds() {
  const out = {};
  for (const id of [1, 2, 3]) {
    out[id] = { ...SEED_BABAK[id], words: SEED_BABAK[id].words.map((w) => ({ id: uid(), audioUrl: null, ...w })) };
  }
  return out;
}

function initialDataByMateri() {
  const seeded = seedWithIds();
  return { "Gakkou no Seikatsu": { 1: seeded[1].words, 2: seeded[2].words, 3: seeded[3].words } };
}
function ensureMateri(data, materi) {
  if (data[materi]) return data;
  return { ...data, [materi]: { 1: [], 2: [], 3: [] } };
}

// SATU localStorage key dipakai bareng oleh Word Search & Mystery Box (lewat MateriPicker yang
// sama-sama dipakai keduanya), supaya tema yang ditambahkan dari game manapun langsung muncul
// juga di game satunya, tanpa perlu didaftarkan ulang.
function loadCustomTema(uid) {
  try {
    const key = migrateLegacyKey("custom-tema-list", uid);
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function saveCustomTema(list, uid) {
  try { localStorage.setItem(scopedKey("custom-tema-list", uid), JSON.stringify(list)); } catch (e) {}
}

function AddTemaModal({ t, existingNames, nextColorIndex, onAdd, onClose }) {
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  const [kana, setKana] = useState("");
  const [icon, setIcon] = useState("📘");
  const [kelas, setKelas] = useState(11);
  const trimmedName = name.trim();
  const duplicate = trimmedName && existingNames.some((n) => n.toLowerCase() === trimmedName.toLowerCase());
  const canSubmit = trimmedName.length > 0 && !duplicate;
  function submit() {
    if (!canSubmit) return;
    const palette = CUSTOM_TEMA_PALETTE[nextColorIndex % CUSTOM_TEMA_PALETTE.length];
    onAdd({ name: trimmedName, desc: desc.trim(), kana: kana.trim(), icon: icon.trim() || "📘", kelas, available: true, custom: true, ...palette });

        <div style={{ fontSize: 14, color: t.dim, marginBottom: 16 }}>Tema baru langsung muncul di Word Search & Mystery Box.</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={fieldLabel}>Nama tema (romaji)</label>
            <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="mis. Sports" style={fieldInput} />
            {duplicate && <div style={{ fontSize: 14, color: "#EF5B5B", marginTop: 4 }}>Nama ini sudah dipakai tema lain.</div>}
          </div>
          <div style={{ width: 64 }}>
            <label style={fieldLabel}>Ikon</label>
            <input value={icon} onChange={(e) => setIcon(e.target.value)} placeholder="📘" style={{ ...fieldInput, textAlign: "center", fontSize: 18, padding: "6px 8px" }} />

        <div style={{ marginBottom: 16 }}>

        <div style={{ marginBottom: 20 }}>
          <label style={fieldLabel}>Untuk kelas</label>
          <div style={{ display: "flex", gap: 8 }}>

// FITUR BARU: sekarang tema dikelompokkan per kelas (Kelas 11 / Kelas 12, sesuai kurikulum),
// dan guru bisa menambah tema sendiri di luar 14 bawaan lewat "+ Tambah Tema" — tersimpan di
// localStorage (loadCustomTema/saveCustomTema), dipakai bareng oleh Word Search & Mystery Box.
// FITUR BARU: daftar tema custom ini sekarang JUGA dicadangkan ke Firestore
// (users/{uid}/setupData/customTema), persis pola yang sudah dipakai kosakata Word Search/Mystery
// Box (loadSetupFromCloud/saveSetupToCloud) — localStorage tetap sumber utama & tetap jalan
// offline, Firestore cuma penyelamat kalau localStorage hilang/basi atau guru pindah device.
function MateriPicker({ t, selected, onSelect, teacher }) {
  const [customTema, setCustomTema] = useState(() => loadCustomTema(teacher && teacher.uid));
  const [addOpen, setAddOpen] = useState(false);
  const cloudCheckedRef = useRef(false);
  const allTema = [...MATERI_LIST, ...customTema];
  const byKelas = { 11: allTema.filter((m) => m.kelas === 11), 12: allTema.filter((m) => m.kelas === 12) };
  // FITUR BARU: dulu Kelas 11 & 12 ditampilkan sekaligus bertumpuk ke bawah — makin panjang
  // makin banyak tema custom ditambahkan. Sekarang cuma satu kelas ditampilkan sekaligus, dipilih
  // lewat switch di atas grid — defaultnya ikut kelas tema yang sedang aktif, biar tidak perlu
  // pindah switch dulu buat lihat tema yang sedang dipakai.
  const [kelasFilter, setKelasFilter] = useState(() => {
    const found = allTema.find((m) => m.name === selected);
    return found ? found.kelas : 11;
  });

  useEffect(() => {
    if (!teacher || !teacher.uid || cloudCheckedRef.current) return;
    cloudCheckedRef.current = true;
    let localSavedAt = 0;
    try {
      const meta = localStorage.getItem(migrateLegacyKey("custom-tema-list-meta", teacher.uid));
      if (meta) localSavedAt = JSON.parse(meta).savedAt || 0;
    } catch (e) {}
    loadSetupFromCloud(teacher.uid, "customTema").then((cloud) => {
      if (!cloud || !Array.isArray(cloud.list)) return;
      if ((cloud.savedAt || 0) > localSavedAt) {
        setCustomTema(cloud.list);
        saveCustomTema(cloud.list, teacher.uid);
      }
    });
  }, [teacher]);

  function persistCustomTema(updated) {
    setCustomTema(updated);
    saveCustomTema(updated, teacher && teacher.uid);
    try { localStorage.setItem(scopedKey("custom-tema-list-meta", teacher && teacher.uid), JSON.stringify({ savedAt: Date.now() })); } catch (e) {}
    if (teacher && teacher.uid) saveSetupToCloud(teacher.uid, "customTema", { list: updated });
  }

  function handleAdd(newTema) {
    persistCustomTema([...customTema, newTema]);
    onSelect(newTema.name);
    setKelasFilter(newTema.kelas);
    setAddOpen(false);
  }
  function handleDelete(name) {
    if (!window.confirm(`Hapus tema "${name}"? Kosakata yang mungkin sudah diisi untuk tema ini TIDAK ikut otomatis terhapus, tapi tema ini tidak akan muncul lagi di daftar pilihan.`)) return;
    persistCustomTema(customTema.filter((m) => m.name !== name));
    if (selected === name) onSelect(MATERI_LIST[0].name);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "inline-flex", background: t.panel2, borderRadius: 10, padding: 4, gap: 4, alignSelf: "flex-start" }}>
        {[11, 12].map((k) => (
          <button key={k} onClick={() => setKelasFilter(k)} className="sgt" style={{
            padding: "8px 22px", borderRadius: 7, border: "none", cursor: "pointer",
            background: kelasFilter === k ? "#F4B740" : "transparent", color: kelasFilter === k ? "#101B34" : t.text,
            fontWeight: 700, fontSize: 14, transition: "background .15s ease",
          }}>Kelas {k}</button>
        ))}
      </div>
      {/* FITUR BARU: kartu Tema diperbesar (angka minmax dinaikkan dari 150 → 190px) — di layar
          guru biasa jadinya otomatis 6 kartu per baris (tadinya 7), sesuai permintaan. Tetap
          auto-fill (bukan angka kolom tetap) supaya masih menyesuaikan diri & tidak kepotong
          kalau jendela browsernya lebih sempit. */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(190px, 1fr))", gap: 14 }}>
        {byKelas[kelasFilter].map((m, i) => (
          <TemaCard key={m.name} t={t} m={m} i={i} isSelected={selected === m.name} onSelect={onSelect} onDelete={handleDelete} />
        ))}
      </div>
      <button onClick={() => setAddOpen(true)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: "transparent", border: `1.5px dashed ${t.border}`, color: t.dim, borderRadius: 14, padding: "14px 0", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>

  "#B98CE6", "#FFA36C", "#6EC6FF", "#D4A373", "#7FD8A6", "#FF8FAB",
];
// Tanda tangan (fingerprint) daftar kata suatu babak — dipakai untuk tahu kapan puzzle preview
// di layar Persiapan sudah "basi" (kata berubah) dan perlu dibangun ulang otomatis.
function babakSignature(words) {
  return words.filter((w) => w.letters && w.letters.trim()).map((w) => w.id + ":" + w.letters.trim().toUpperCase()).join("|");
}
const ROMAJI_FILL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const HIRAGANA_FILL = Array.from(
  "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ"
);
// Kata cuma ditempatkan dengan arah "maju" (searah baca normal), supaya tidak ada jawaban yang
// terbalik (kanan-ke-kiri atau bawah-ke-atas): [0,1] kiri→kanan, [1,0] atas→bawah,
// [1,1] serong kiri-atas→kanan-bawah (↘), [-1,1] serong kiri-bawah→kanan-atas (↗).
const DIRECTIONS = [[0,1],[1,0],[1,1],[-1,1]];

function isKanaWord(letters) { return /[぀-ヿ]/.test(letters); }

// FIX (bug: "Simpan & Jeda" macet permanen di "Menyimpan…"): Firestore TIDAK MENDUKUNG
// array-di-dalam-array (nested array) sebagai nilai field — cuma array berisi object/string/
// number yang diperbolehkan. puzzle.grid (string[][]) dan puzzle.placements / foundMap[...].cells
// (masing-masing array pasangan [r,c]) semuanya nested array. Begitu dikirim langsung ke
// Firestore, panggilannya melempar error SINKRON sebelum promise-nya sempat terbentuk —
// akibatnya .then/.catch/.finally di confirmSaveSession() tidak pernah jalan, dan state
// `savingSession` tidak pernah balik ke false (tombol "Menyimpan…" macet selamanya, tanpa pesan
// error apa pun yang terlihat guru). Dua pasang fungsi ini mengubah struktur nested-array itu
// jadi bentuk yang aman untuk Firestore sebelum dikirim (baris grid → string, pasangan [r,c] →
// {r,c}), dan mengembalikannya lagi ke bentuk asli saat sesi itu dibuka lagi dari Riwayat.
function packPuzzleForSave(puzzle) {
  if (!puzzle) return null;
  const placements = {};
  Object.keys(puzzle.placements || {}).forEach((id) => {
    placements[id] = puzzle.placements[id].map(([r, c]) => ({ r, c }));
  });
  return { size: puzzle.size, gridRows: puzzle.grid.map((row) => row.join("")), placements };
}
function unpackPuzzleFromSave(saved) {
  if (!saved) return null;
  const placements = {};
  Object.keys(saved.placements || {}).forEach((id) => {
    placements[id] = saved.placements[id].map((o) => [o.r, o.c]);
  });
  return { size: saved.size, grid: (saved.gridRows || []).map((rowStr) => rowStr.split("")), placements };
}
function packFoundMapForSave(foundMap) {
  const packed = {};
  Object.keys(foundMap || {}).forEach((id) => {
    const f = foundMap[id];
    packed[id] = { color: f.color, revealed: !!f.revealed, cells: (f.cells || []).map(([r, c]) => ({ r, c })) };
  });
  return packed;
}
function unpackFoundMapFromSave(saved) {
  const foundMap = {};
  Object.keys(saved || {}).forEach((id) => {
    const f = saved[id];
    foundMap[id] = { color: f.color, revealed: !!f.revealed, cells: (f.cells || []).map((o) => [o.r, o.c]) };
  });
  return foundMap;
}
// puzzleByBabak berbentuk { [babakId]: { signature, puzzle } } — dipakai buat menyimpan/memuat
// cache "Kunci Jawaban" per babak baik ke localStorage MAUPUN ke Firestore (cadangan cloud lintas
// device). Sama seperti di atas, `puzzle`-nya harus di-pack/unpack juga supaya aman dikirim ke
// Firestore (lihat penjelasan nested-array di atas).
function packPuzzleByBabakForSave(puzzleByBabak) {
  const out = {};
  Object.keys(puzzleByBabak || {}).forEach((id) => {
    const entry = puzzleByBabak[id];
    if (entry) out[id] = { signature: entry.signature, puzzle: packPuzzleForSave(entry.puzzle) };
  });
  return out;
}
function unpackPuzzleByBabakFromSave(saved) {
  const out = {};
  Object.keys(saved || {}).forEach((id) => {
    const entry = saved[id];
    if (entry) out[id] = { signature: entry.signature, puzzle: unpackPuzzleFromSave(entry.puzzle) };
  });
  return out;
}

function buildPuzzle(words) {
  const valid = words.filter((w) => w.letters && w.letters.trim().length > 0);
  if (valid.length === 0) return null;
  const fillAlphabet = isKanaWord(valid[0].letters) ? HIRAGANA_FILL : ROMAJI_FILL;
  const lens = valid.map((w) => w.letters.length);
  const longest = Math.max(...lens);
  const totalLen = lens.reduce((a, l) => a + l, 0);
  // Mulai dari ukuran grid SEKECIL mungkin (bukan langsung digenerouskan seperti sebelumnya) —
  // supaya kata-kata "dipaksa" mencari kesempatan saling menimpa di huruf yang sama dulu (mirip
  // contoh word search yang rapat/padat), baru diperbesar selangkah demi selangkah kalau memang
  // tidak muat di ukuran sekecil itu.
  let size = Math.max(longest, Math.ceil(Math.sqrt(totalLen * 1.15)), 6);

  for (let sizeTry = 0; sizeTry < 16; sizeTry++) {
    const grid = Array.from({ length: size }, () => Array(size).fill(null));
    // Daftar sel yang sudah terisi huruf — dipakai untuk "menempelkan" kata baru ke huruf yang
    // sama persis, supaya kata-kata lebih sering berpotongan (overlap) alih-alih selalu cari
    // ruang kosong baru.
    const filledCells = [];
    const placements = {};
    const sorted = [...valid].sort((a, b) => b.letters.length - a.letters.length);
    let ok = true;
    for (const w of sorted) {
      let placed = false;
      for (let attempt = 0; attempt < 1500 && !placed; attempt++) {
        let dir, startR, startC;
        // Separuh percobaan: coba tempelkan kata ke salah satu huruf yang sudah ada di grid
        // (kalau kata ini memang punya huruf yang sama). Separuh sisanya: posisi acak biasa,
        // supaya kata tetap bisa ditempatkan walau tidak ada peluang menimpa.
        if (attempt % 2 === 0 && filledCells.length > 0) {
          const [fr, fc, fletter] = filledCells[Math.floor(Math.random() * filledCells.length)];
          const matchIdxs = [];
          for (let i = 0; i < w.letters.length; i++) if (w.letters[i] === fletter) matchIdxs.push(i);
          if (matchIdxs.length === 0) continue;
          const idx = matchIdxs[Math.floor(Math.random() * matchIdxs.length)];
          dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          startR = fr - dir[0] * idx;
          startC = fc - dir[1] * idx;
        } else {
          dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
          startR = Math.floor(Math.random() * size);
          startC = Math.floor(Math.random() * size);
        }
        const endR = startR + dir[0] * (w.letters.length - 1);
        const endC = startC + dir[1] * (w.letters.length - 1);
        if (startR < 0 || startR >= size || startC < 0 || startC >= size || endR < 0 || endR >= size || endC < 0 || endC >= size) continue;
        const cells = [];
        let fits = true;
        for (let i = 0; i < w.letters.length; i++) {
          const r = startR + dir[0] * i, c = startC + dir[1] * i;
          const existing = grid[r][c];
          if (existing && existing !== w.letters[i]) { fits = false; break; }
          cells.push([r, c]);
        }
        if (fits) {
          cells.forEach(([r, c], i) => { if (!grid[r][c]) filledCells.push([r, c, w.letters[i]]); grid[r][c] = w.letters[i]; });
          placements[w.id] = cells; placed = true;
        }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) {
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
        if (!grid[r][c]) grid[r][c] = fillAlphabet[Math.floor(Math.random() * fillAlphabet.length)];
      return { grid, size, placements };
    }
    size++;
  }
  return null;
}

function cellKey(r, c) { return `${r}-${c}`; }

// Dipakai buat menyembunyikan teks penjelas yang tidak krusial di layar sempit (HP) —
// supaya layar guru lebih ringkas & nggak penuh teks berulang.
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.innerWidth <= 640 : false));
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return isMobile;
}

  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

// Dipakai buat papan kartu Game 3 supaya benar-benar pas 1 layar. FIX: sebelumnya pakai CSS
// "100vh", ternyata di beberapa browser HP (terutama webview dalam-aplikasi seperti WhatsApp)
// "100vh" TIDAK sama dengan tinggi layar yang benar-benar terlihat — jadi papan kartu dihitung
// terlalu tinggi dan malah perlu di-scroll / kartunya jadi memanjang tidak proporsional.
// window.visualViewport jauh lebih akurat karena memang dirancang untuk melaporkan ukuran area
// yang BENAR-BENAR terlihat saat ini (memperhitungkan address bar, dsb). Dipakai untuk lebar
// JUGA (bukan cuma tinggi) supaya kartu bisa dibuat persegi (1:1) dan tetap pasti muat 1 layar.
function useViewportSize() {
  const getSize = () => {
    if (typeof window === "undefined") return { w: 400, h: 800 };
    if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
    return { w: window.innerWidth, h: window.innerHeight };
  };
  const [size, setSize] = useState(getSize);
  useEffect(() => {
    function update() { setSize(getSize()); }
    update();
    window.addEventListener("resize", update);
    window.addEventListener("orientationchange", update);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", update);
    return () => {
      window.removeEventListener("resize", update);
      window.removeEventListener("orientationchange", update);
      if (window.visualViewport) window.visualViewport.removeEventListener("resize", update);
    };
  }, []);
  return size;
}
// Peluang tabrakan kode 5 karakter memang sangat kecil (~1 banding 33 juta), tapi tetap dicek
// ke Firestore sebelum room dipakai, supaya dua kelas yang kebetulan dapat kode sama tidak
// saling menimpa data/buzzer masing-masing. Kalau cek gagal (mis. offline), lanjut pakai kode
// yang ada — daripada memblokir guru mulai mengajar hanya gara-gara jaringan.
async function ensureUniqueRoomCode(currentCode) {
  let code = currentCode;
  for (let i = 0; i < 5; i++) {
    try {
      const snap = await db.collection("rooms").doc(code).get();
      if (!snap.exists) return code;
    } catch (e) { return code; }
    code = makeRoomCode();
  }
  return code;
}

// Room di Firestore idealnya terhapus lewat endGame(), tapi kalau guru menutup tab/browser
// begitu saja tanpa klik "Akhiri Permainan", dokumennya akan tertinggal selamanya di koleksi "rooms".
// Karena tidak ada Cloud Functions terjadwal di setup ini, kita sapu room yang basi
// (tidak ter-update lagi selama ROOM_STALE_MS) secara best-effort setiap kali web ini dibuka.
const ROOM_STALE_MS = 4 * 60 * 60 * 1000; // 4 jam — sesi kelas wajar tidak akan sepanjang ini
// BUGFIX: menghapus dokumen room TIDAK otomatis menghapus subcollection di dalamnya (gotcha umum
// Firestore) — room Card Rush punya subcollection "cardPairs" berisi gambar kartu yang harus
// dihapus manual dulu, kalau tidak akan jadi sampah permanen di Firestore. Dipakai bareng oleh
// cleanupStaleRooms (di bawah) & endGame() Card Rush.
async function deleteRoomWithSubcollections(roomRef) {
  const cardPairs = await roomRef.collection("cardPairs").get();
  if (!cardPairs.empty) {
    const batch = db.batch();
    cardPairs.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
  await roomRef.delete();
}
function cleanupStaleRooms() {
  const cutoff = new Date(Date.now() - ROOM_STALE_MS);
  db.collection("rooms").where("updatedAt", "<", cutoff).get()
    .then((snap) => {
      if (snap.empty) return;
      return Promise.all(snap.docs.map((d) => deleteRoomWithSubcollections(d.ref).catch(() => {})));
    })
    .catch(() => { /* mis. sedang offline — biarkan, akan dicoba lagi lain kali web dibuka */ });
}

        {notice && <div style={{ marginTop: 8, fontSize: 14, color: "#EF5B5B" }}>{notice}</div>}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 14 }}>
          <button onClick={handleClose} style={{ background: "#F1EEE4", border: "none", color: "#101B34", padding: "9px 16px", borderRadius: 8, cursor: "pointer", fontSize: 14 }}>Batal</button>
          <button onClick={handleSubmit} disabled={!text.trim()} style={{ background: "#F4B740", border: "none", color: "#101B34", padding: "9px 16px", borderRadius: 8, cursor: text.trim() ? "pointer" : "default", opacity: text.trim() ? 1 : 0.5, fontWeight: 700, fontSize: 14 }}>Tambahkan Semua</button>
        </div>
      </div>
    </div>
  );
}
