  // Dengarkan kelompok yang join & angkat tangan dari HP siswa, tambahkan ke urutan lokal
  // (buzzOrder-nya diabaikan kalau mode sedang Manual — di mode itu HP siswa memang dikunci,
  // tapi status "sudah join" tetap dipantau terus supaya titik hijau di tombol kelompok akurat)
  useEffect(() => {
    if (stage !== "play") return;
    const ref = db.collection("rooms").doc(roomCode);
    const unsub = ref.onSnapshot((snap) => {
      const data = snap.data();
      if (!data) return;
      setJoinedGroups(data.groups || {});
      if (mode !== "digital") return;
      const roundId = currentWord ? currentWord.id : null;
      if (!roundId || data.roundId !== roundId || !Array.isArray(data.buzzOrder)) return;
      if (lastAppliedRoundRef.current !== roundId) {
        lastAppliedRoundRef.current = roundId;
        appliedGroupsRef.current = new Set();
      }
      data.buzzOrder.forEach((entry) => {
        if (!appliedGroupsRef.current.has(entry.group)) {
          appliedGroupsRef.current.add(entry.group);
          buzz(entry.group);
        }
      });
    });
    return () => unsub();
  }, [stage, roomCode, currentWord?.id, mode]);

  function scheduleRetry() {
    clearRetryTimer();
    if (audioMode !== "guru") return;
    retryTimerRef.current = setTimeout(() => {
      if (activeGroup !== null) return;
      const src = currentWord?.audioUrl;
      if (src && audioRef.current) { audioRef.current.currentTime = 0; audioRef.current.play(); setSpeaking(true); }
      if (babakId !== 1) setOpenToAll(true);
    }, 5000);
  }

  function playClue() {
    if (!currentWord) return;
    if (audioMode === "off" || !currentWord.audioUrl) { setClueRevealed(true); return; }
    setClueRevealed(true);
    const el = audioRef.current;
    el.src = currentWord.audioUrl; el.currentTime = 0; el.play(); setSpeaking(true);
  }

  function isEligible(g) { if (!triedSetRef.current.has(g)) return true; return babakId !== 1 && openToAllRef.current; }

  function buzz(group) {
    if (!currentWord || !clueRevealedRef.current || !isEligible(group)) return;
    if (buzzOrderRef.current.some((o) => o.group === group)) return; // sudah pernah angkat tangan di soal ini
    const newOrder = [...buzzOrderRef.current, { group }];
    buzzOrderRef.current = newOrder;
    setBuzzOrder(newOrder);
    if (activeGroupRef.current === null) {
      activeGroupRef.current = group;
      clearRetryTimer();
      if (audioRef.current) audioRef.current.pause();
      setSpeaking(false);
      setActiveGroup(group);
    }
  }

  function releaseTurn() { activeGroupRef.current = null; setActiveGroup(null); setSelStart(null); }

  function triggerCelebration(group) {
    const accent = GROUP_COLORS[(group - 1 + GROUP_COLORS.length) % GROUP_COLORS.length];
    setConfetti(makeConfettiBurst(accent));
    playCorrectSound();
    if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current);
    confettiTimerRef.current = setTimeout(() => setConfetti(null), 1300);
  }

  function nextQuestion() {
    setQueue((q) => q.slice(1));
    setClueRevealed(false); setTriedSet(new Set()); setOpenToAll(false);
    clearRetryTimer(); releaseTurn(); setSpeaking(false);
    setBuzzOrder([]);
    buzzOrderRef.current = []; triedSetRef.current = new Set(); openToAllRef.current = false;
    if (audioRef.current) audioRef.current.pause();
  }
  function skipWord() { if (currentWord) nextQuestion(); }

  function handleCellClick(r, c) {
    if (!currentWord || activeGroup === null || !puzzle) return;
    if (!selStart) { setSelStart([r, c]); return; }
    const [sr, sc] = selStart;
    const dr = Math.sign(r - sr), dc = Math.sign(c - sc);
    const len = Math.max(Math.abs(r - sr), Math.abs(c - sc)) + 1;
    const validLine = (dr === 0 && dc !== 0 && r === sr) || (dc === 0 && dr !== 0 && c === sc) || (dr !== 0 && dc !== 0 && Math.abs(r - sr) === Math.abs(c - sc));
    if (!validLine) { setSelStart([r, c]); return; }
    const cells = Array.from({ length: len }, (_, i) => [sr + dr * i, sc + dc * i]);
    const str = cells.map(([rr, cc]) => puzzle.grid[rr][cc]).join("");
    // FIX: sebelumnya jawaban yang dibalik arahnya (mis. "まど" dipilih dari "ど" ke "ま", kanan-ke-kiri)
    // ikut dianggap benar karena ada fallback "reversed === currentWord.letters". Kata di papan cuma
    // pernah ditempatkan dalam 4 arah maju (lihat DIRECTIONS: kanan, bawah, diagonal kanan-bawah,
    // diagonal kanan-atas) — jadi jawaban yang sah cuma yang dipilih persis mengikuti arah itu dari
    // huruf pertama kata. Fallback dihapus supaya berlaku sama di Babak 1, 2, maupun 3 (kode cek ini
    // memang satu-satunya & dipakai bareng oleh ketiga babak, bukan per-babak terpisah).
    const match = str === currentWord.letters;
    if (match) {
      // FIX: warna highlight jawaban dulu ikut warna kelompok yang menjawab (GROUP_COLORS) —
      // kalau kelompok yang sama beruntun menjawab benar (atau saat dites sendiri oleh guru),
      // semua garis jawaban jadi satu warna terus. Sekarang tiap kata dapat warna tetap dari
      // ANSWER_KEY_PALETTE berdasarkan urutannya di daftar kosakata babak ini (sama seperti
      // pewarnaan di pratinjau Kunci Jawaban Persiapan), jadi warnanya selalu bervariasi apa pun
      // kelompok yang menjawab.
      const segColor = answerKeyColorByWordId[currentWord.id] || GROUP_COLORS[activeGroup - 1];
      setFoundMap((f) => ({ ...f, [currentWord.id]: { cells, color: segColor } }));
      setScores((s) => ({ ...s, [activeGroup]: s[activeGroup] + babak.point }));
      setFlash({ type: "correct", group: activeGroup }); setTimeout(() => setFlash(null), 1400);
      triggerCelebration(activeGroup);
      nextQuestion();
    } else {
      const wrongGroup = activeGroup;
      const updatedTried = new Set(triedSet); updatedTried.add(wrongGroup);
      setTriedSet(updatedTried); triedSetRef.current = updatedTried;
      setFlash({ type: "wrong", group: wrongGroup }); setTimeout(() => setFlash(null), 900);
      // kalau ada kelompok lain yang sudah antre di urutan angkat tangan, langsung lanjut ke giliran mereka
      const next = buzzOrder.find((o) => o.group !== wrongGroup && !updatedTried.has(o.group));
      if (next) {
        clearRetryTimer();
        if (audioRef.current) audioRef.current.pause();
        setSpeaking(false);
        activeGroupRef.current = next.group;
        setActiveGroup(next.group);
      } else {
        releaseTurn(); scheduleRetry();
      }
    }
    setSelStart(null);
  }

  // FIX (UX): sama seperti Kunci Jawaban di Persiapan — kata yang sudah ketemu saat bermain
  // dulu diwarnai per-SEL (blok solid), berat di mata & kata diagonal jadi kelihatan patah-patah
  // (kotak demi kotak, bukan garis lurus). Sekarang tiap kata yang ketemu cukup digambar sebagai
  // satu garis tipis transparan dari sel pertama ke sel terakhir yang tadi diseleksi siswa —
  // otomatis lurus & mengikuti sudutnya sendiri, termasuk diagonal.
  const foundSegments = puzzle ? Object.values(foundMap).map(({ cells, color }, i) => {
    if (!cells || cells.length === 0) return null;
    const [r1, c1] = cells[0];
    const [r2, c2] = cells[cells.length - 1];
    return { id: i, x1: c1 + 0.5, y1: r1 + 0.5, x2: c2 + 0.5, y2: r2 + 0.5, color };
  }).filter(Boolean) : [];
  const leaderScore = Math.max(...Object.values(scores));
  const sortedGroups = [...GROUP_NAMES].sort((a, b) => scores[b] - scores[a]);
  // FIX (UX): ukuran huruf dulu relatif kecil dibanding jarak antar-huruf, apalagi setelah kotak
  // per-sel dihilangkan — papan jadi terasa renggang dan huruf terlihat kecil. Dinaikkan sedikit
  // supaya tetap nyaman dibaca dari proyektor.
  const cellFont = babakId === 1 ? (puzzle && puzzle.size > 16 ? 17 : 20) : (puzzle && puzzle.size > 16 ? 20 : 24);

  /* ---------- editing helpers (tahap persiapan) ---------- */
  function updateWord(id, wordId, field, value) {
    // FIX: kata jawaban dipaksa huruf besar begitu diketik, supaya konsisten dengan grid
    // (romaji ditulis kapital) dan tidak pernah gagal cocok dengan jawaban siswa gara-gara
    // guru tidak sengaja mengetik huruf kecil. Aman untuk hiragana karena .toUpperCase()
    // tidak mengubah karakter kana sama sekali.
    const finalValue = field === "letters" ? value.toUpperCase() : value;
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: materiData[id].map((w) => w.id === wordId ? { ...w, [field]: finalValue } : w) } };
    });
  }
  // SEMENTARA TANPA FIREBASE STORAGE: project belum di-upgrade ke paket Blaze (butuh kartu
  // debit/kredit), jadi audio disimpan sebagai data langsung (base64) di localStorage browser —
  // sama seperti sebelum fitur ini disambungkan ke Storage. Konsekuensinya: audio HANYA ada di
  // browser tempat ia diunggah, tidak ikut tersinkron ke device lain atau ke Riwayat Sesi lintas
  // device. Begitu project di-upgrade ke Blaze nanti, ini bisa disambungkan lagi ke Storage.
  function deleteAudioFile(url) {
    // Tidak ada file terpisah untuk dihapus (audio disimpan inline sebagai base64) — no-op.
  }
  function removeWord(id, wordId) {
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: materiData[id].filter((w) => w.id !== wordId) } };
    });
  }
  function addWord(id) {
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: [...materiData[id], { id: uid(), letters: "", clue: "", audioUrl: null }] } };
    });
  }
  // FITUR BARU: tambah banyak kosakata sekaligus dari teks yang ditempel guru, satu kosakata
  // per baris dengan format "kata/petunjuk". Baris tanpa "/" atau tanpa kata di depannya
  // dilewati (tidak dianggap error fatal — cukup tidak ikut ditambahkan), supaya satu baris
  // yang salah format tidak menggagalkan semua baris lain yang sudah benar.
  function addWordsBulk(id, text) {
    const newWords = text.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
      const sepIdx = line.indexOf("/");
      if (sepIdx === -1) return null;
      const letters = line.slice(0, sepIdx).trim().toUpperCase();
      const clue = line.slice(sepIdx + 1).trim();
      if (!letters) return null;
      return { id: uid(), letters, clue, audioUrl: null };
    }).filter(Boolean);
    if (newWords.length === 0) return 0;
    setDataByMateri((prev) => {
      const materiData = prev[selectedMateri] || { 1: [], 2: [], 3: [] };
      return { ...prev, [selectedMateri]: { ...materiData, [id]: [...materiData[id], ...newWords] } };
    });
    return newWords.length;
  }
  function uploadAudio(id, wordId, file) {
    if (!file) return;
    // Batas lebih ketat (2MB) daripada versi Storage (5MB) karena base64 membengkakkan ukuran
    // sekitar 33% dan semuanya numpuk di kuota localStorage browser (biasanya 5-10MB total).
    if (file.size > 2 * 1024 * 1024) {
      setAudioUploadError((e) => ({ ...e, [wordId]: "File audio maksimal 2MB (mode tanpa Storage)." }));
      return;
    }
    setAudioUploadError((e) => { const n = { ...e }; delete n[wordId]; return n; });
    setUploadingAudio((u) => ({ ...u, [wordId]: true }));
    const reader = new FileReader();
    reader.onload = () => {
      updateWord(id, wordId, "audioUrl", reader.result);
      setUploadingAudio((u) => { const n = { ...u }; delete n[wordId]; return n; });
    };
    reader.onerror = () => {
      setAudioUploadError((e) => ({ ...e, [wordId]: "Gagal membaca file audio, coba lagi." }));
      setUploadingAudio((u) => { const n = { ...u }; delete n[wordId]; return n; });
    };
    reader.readAsDataURL(file);
  }

  const canStart = [1, 2, 3].some((id) => (dataByMateri[selectedMateri]?.[id] || []).some((w) => w.letters.trim()));

  /* ---------------- Reusable game bits ---------------- */
  // FIX: buildPuzzle() bisa mengembalikan null karena dua alasan berbeda — (a) memang belum
  // ada kosakata valid di babak ini, atau (b) kosakata ADA tapi gagal disusun ke grid (mis.
  // terlalu banyak/panjang untuk ukuran papan). Sebelumnya kedua kasus ini tampil sama persis
  // ("Belum ada kosakata"), padahal (b) butuh tindakan berbeda dari guru (kurangi/perpendek kata).
  const hasWordsForBabak = babak.words.some((w) => w.letters.trim());
  // FIX (bug): Grid, Scoreboard, BuzzIndicator, dan ControlPanel di bawah ini tadinya
  // ditulis sebagai `const Grid = (...) => (...)` — komponen React yang didefinisikan
  // ULANG di setiap render TebakCariKataGame. Karena definisinya baru setiap render, React
  // menganggap `<Grid big />` sebagai TIPE komponen yang berbeda dari render sebelumnya (meski
  // isinya identik) — jadi seluruh papan/skor/panel dibongkar total lalu dipasang ulang dari nol
  // setiap kali ADA state apa pun yang berubah, termasuk klik tombol yang sama sekali tidak
  // berhubungan dengan papan (ganti mode, buka panel, dst). Bongkar-pasang inilah yang terlihat
  // sebagai "kedipan", dan juga memicu ulang animasi masuk (cardRise) tiap kali.
  // Sekarang ditulis sebagai FUNGSI BIASA yang dipanggil langsung (`renderGrid({ big: true })`),
  // bukan dipakai sebagai tag JSX (`<Grid big />`). Dengan begitu React melihatnya sebagai bagian
  // biasa dari pohon elemen induknya — tidak dianggap komponen terpisah — sehingga hanya
  // memperbarui bagian yang benar-benar berubah, tanpa bongkar-pasang total.
  function renderGrid({ big } = {}) { return !puzzle ? (
    <div style={{ padding: 24, color: t.dim, fontSize: 14 }}>
      {hasWordsForBabak
        ? `Papan gagal disusun dari kosakata Babak ${babakId} ini — coba kurangi jumlah kata atau perpendek beberapa kata, lalu buka layar Persiapan dan klik "Acak Ulang Posisi".`
        : "Belum ada kosakata untuk babak ini."}
    </div>
  ) : (
    <div style={{
      position: "relative", background: t.panel, padding: 10, borderRadius: 14, maxWidth: big ? 760 : 620, width: "100%", margin: big ? "0 auto" : undefined, boxSizing: "border-box",
      // FIX (UX): papan dulu diredupkan (opacity huruf 0.55) selama belum ada kelompok yang
      // mengangkat tangan — maksudnya menandakan "belum boleh diklik", tapi ini malah bikin siswa
      // susah membaca papan justru pada saat mereka paling butuh mencari kata (waktu audio/petunjuk
      // baru diputar). Sekarang papan SELALU terlihat jelas & tidak pernah pudar; sebagai gantinya
      // giliran kelompok ditandai dengan bingkai bersinar mengikuti warna kelompok yang sedang
      // pegang giliran menjawab (activeGroup) — begitu belum ada yang menang giliran, bingkai ini
      // tidak muncul sama sekali.
      boxShadow: activeGroup ? `0 0 0 3px ${GROUP_COLORS[activeGroup - 1]}, 0 0 22px 4px ${GROUP_COLORS[activeGroup - 1]}99` : "none",
      transition: "box-shadow .25s ease",
      animation: "cardRise .3s ease",
    }} key={currentWord ? currentWord.id : "kosong"}>
      <svg viewBox={`0 0 ${puzzle.size} ${puzzle.size}`} style={{ position: "absolute", top: 10, left: 10, right: 10, bottom: 10, pointerEvents: "none" }}>
        {foundSegments.map((seg) => (
          <line key={seg.id} x1={seg.x1} y1={seg.y1} x2={seg.x2} y2={seg.y2}
            stroke={seg.color} strokeWidth={0.62} strokeLinecap="round" opacity={0.6} />
        ))}
      </svg>
      {/* FIX (UX): sel papan dulu masing-masing digambar sebagai kotak solid berwarna (t.panel2)
          dengan celah antar-kotak. Begitu ada highlight jawaban (garis/pil SVG) yang melintang
          diagonal di atasnya, sudut-sudut kotak & celah antar-kotak tetap kelihatan mengintip di
          balik highlight, jadi terlihat kotak-kotak/patah-patah — terutama di kata diagonal.
          Sekarang latar per-sel dihilangkan (transparan, huruf langsung duduk di atas panel papan
          yang polos, sama seperti pratinjau Kunci Jawaban di Persiapan) supaya highlight jawaban
          terlihat mulus. Sel yang sedang dipilih (isSelStart) ditandai bulat, bukan kotak, supaya
          tetap tidak menambah kesan "kotak-kotak" pada papan. */}
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${puzzle.size}, minmax(0, 1fr))`, gap: big ? 3 : 2, position: "relative", zIndex: 1 }}>
        {puzzle.grid.map((row, r) => row.map((letter, c) => {
          const key = cellKey(r, c);
          const isSelStart = selStart && selStart[0] === r && selStart[1] === c;
          return (
            <button key={key} className="cell-btn" onClick={() => handleCellClick(r, c)} disabled={!currentWord || activeGroup === null}
              style={{
                aspectRatio: "1 / 1", border: "none", borderRadius: "50%", cursor: currentWord && activeGroup !== null ? "pointer" : "default",
                background: isSelStart ? "#F4B740" : "transparent", color: isSelStart ? "#101B34" : t.cellText,
                fontWeight: 700, fontSize: big ? cellFont + 4 : cellFont, display: "flex", alignItems: "center", justifyContent: "center",
                minWidth: 0, width: "100%", padding: 0,
              }}>{letter}</button>
          );
        }))}
      </div>
    </div>
  ); }

  function renderScoreboard({ big, compact, highlight } = {}) { return (
    <div style={{ background: compact ? "transparent" : t.panel, borderRadius: 14, padding: compact ? 0 : big ? 22 : 18 }}>
      {!compact && <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: big ? 15 : 13, color: t.dim, marginBottom: 10 }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>🏆</span> Papan Skor</div>}
      <div style={{ display: "flex", flexDirection: big ? "row" : "column", gap: big ? 12 : 6, flexWrap: "wrap" }}>
        {sortedGroups.map((g) => (
          <div key={g} style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
            background: g === highlight ? GROUP_COLORS[g - 1] : t.panel2, borderRadius: 10, padding: big ? "14px 20px" : compact ? "6px 10px" : "8px 12px",
            flex: big ? "1 1 140px" : undefined, boxShadow: activeGroup === g && !compact ? `0 0 0 2px ${GROUP_COLORS[g - 1]}` : "none",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: compact ? 9 : 12, height: compact ? 9 : 12, borderRadius: 4, background: GROUP_COLORS[g - 1], display: "inline-block" }} />
              <span style={{ fontSize: big ? 16 : compact ? 12.5 : 14, fontWeight: 600, color: g === highlight ? "#101B34" : t.text }}>Kelompok {g}</span>
              {scores[g] === leaderScore && leaderScore > 0 && <span style={{ fontSize: 16, lineHeight: 1, color: g === highlight ? "#101B34" : "#F4B740" }}>👑</span>}
            </div>
            <span className={`sgt${g === bumpedGroup ? " score-bump" : ""}`} style={{ fontWeight: 700, fontSize: big ? 22 : compact ? 13 : 15, color: g === highlight ? "#101B34" : t.text }}>{scores[g]}</span>
          </div>
        ))}
      </div>
    </div>
  ); }

  function renderBuzzIndicator({ big } = {}) { return (
    <div style={{ textAlign: "center", padding: big ? "18px 0" : "10px 0", borderRadius: 14, background: activeGroup ? GROUP_COLORS[activeGroup - 1] : t.panel, color: activeGroup ? "#101B34" : t.dim, fontWeight: 700, fontSize: big ? 22 : 14, transition: "background .2s ease" }}>
      {activeGroup ? `Kelompok ${activeGroup} mengangkat tangan duluan!` : "Menunggu ada yang mengangkat tangan…"}
    </div>
  ); }

  function renderControlPanel() { return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: t.panel, borderRadius: 14, padding: 18, boxShadow: t.shadowSm }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 13, color: t.dim }}>Petunjuk soal</div>
          <div style={{ display: "flex", background: t.panel2, borderRadius: 8, padding: 3 }}>
            <button onClick={() => setAudioMode("guru")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 9px", borderRadius: 6, border: "none", cursor: "pointer", background: audioMode === "guru" ? "#3FBFAD" : "transparent", color: audioMode === "guru" ? "#0D1730" : t.text, fontSize: 11.5, fontWeight: 600 }}><span style={{ fontSize: 12, lineHeight: 1, color: 'inherit' }}>🔊</span> Audio</button>
            <button onClick={() => setAudioMode("off")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 9px", borderRadius: 6, border: "none", cursor: "pointer", background: audioMode === "off" ? "#3FBFAD" : "transparent", color: audioMode === "off" ? "#0D1730" : t.text, fontSize: 11.5, fontWeight: 600 }}><span style={{ fontSize: 12, lineHeight: 1, color: 'inherit' }}>🔇</span> Nonaktif</button>
          </div>
        </div>

        {currentWord && (
          <button onClick={playClue} className="grp-btn" style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "#F4B740", color: "#101B34", border: "none", borderRadius: 10, padding: "12px 16px", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
            {audioMode === "guru" && currentWord.audioUrl ? <span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>🔊</span> : <span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>🔇</span>}
            {audioMode === "guru" && currentWord.audioUrl ? (speaking ? "Memutar…" : "Putar Petunjuk") : "Tampilkan teks (dibacakan guru)"}
          </button>
        )}
        {clueRevealed && currentWord && <div style={{ marginTop: 12, fontSize: 14, lineHeight: 1.5, color: t.text }}>"{currentWord.clue}"</div>}
        {audioMode === "guru" && <div style={{ marginTop: 10, fontSize: 11.5, color: t.faint }}>Kalau tidak ada yang angkat tangan 5 detik setelah audio selesai, audio diputar ulang otomatis.</div>}
      </div>

      <div style={{ background: t.panel, borderRadius: 14, padding: 18, boxShadow: t.shadowSm }}>
        <div style={{ fontSize: 13, color: t.dim, marginBottom: 10 }}>{mode === "digital" ? "Buzzer kelompok" : "Tunjuk kelompok penjawab"}</div>
        {currentWord && !clueRevealed && (
          <div style={{ marginBottom: 10, fontSize: 12, color: "#F4B740", background: "rgba(244,183,64,.12)", borderRadius: 8, padding: "8px 10px" }}>Tombol masih terkunci — klik "{audioMode === "guru" && currentWord.audioUrl ? "Putar Petunjuk" : "Tampilkan teks"}" di panel kanan dulu supaya kelompok bisa angkat tangan.</div>
        )}
        {/* FIX (fitur diminta): dulu di mode Manual, guru cuma bisa memilih SATU kelompok
            (klik langsung setActiveGroup), dan begitu satu kelompok aktif, tombol kelompok
            lain otomatis terkunci sampai giliran itu selesai — jadi kalau guru sudah tahu
            urutan mana yang mengangkat tangan duluan di kelas (mis. 4, lalu 2, lalu 1), guru
            harus menunggu dan mengklik ulang satu-satu setiap kali kelompok sebelumnya salah.
            Sekarang tombol kelompok di KEDUA mode memakai fungsi antrean yang sama (`buzz`)
            yang tadinya cuma dipakai mode Digital: klik kelompok manapun akan menambahkannya
            ke antrean; yang PERTAMA diklik langsung jadi giliran aktif, klik-klik berikutnya
            tetap bisa dilakukan sambil kelompok pertama masih menjawab, dan begitu kelompok
            yang aktif salah, giliran otomatis lanjut ke kelompok berikutnya sesuai URUTAN

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
          {GROUP_NAMES.map((g) => {
            const isActive = activeGroup === g;
            const eligible = isEligible(g);
            const buzzPos = buzzOrder.findIndex((o) => o.group === g);
            const alreadyBuzzed = buzzPos >= 0;
            const locked = !currentWord || !clueRevealed || !eligible || alreadyBuzzed;
            return (
              <button key={g} className="grp-btn" onClick={() => buzz(g)} disabled={locked}
                style={{ position: "relative", padding: "12px 0", borderRadius: 10, border: "none", cursor: locked ? "default" : "pointer", background: isActive ? GROUP_COLORS[g - 1] : t.panel2, color: isActive ? "#0D1730" : t.text, fontWeight: 700, fontSize: 14, opacity: locked && !isActive ? 0.4 : 1, boxShadow: isActive ? `0 0 0 2px ${GROUP_COLORS[g - 1]}` : "none" }}>
                K{g}
                {joinedGroups[g] && <span title="Sudah join lewat QR" style={{ position: "absolute", top: 4, right: 4, width: 7, height: 7, borderRadius: "50%", background: "#3FBFAD" }} />}
                {alreadyBuzzed && <span style={{ position: "absolute", top: -6, left: -6, width: 18, height: 18, borderRadius: "50%", background: "#101B34", color: "#F4B740", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{buzzPos + 1}</span>}
              </button>
            );
          })}
        </div>
        {buzzOrder.length > 0 && (
          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 4 }}>
            <div style={{ fontSize: 11.5, color: t.faint }}>Urutan angkat tangan:</div>
            {buzzOrder.map((o, i) => (
              <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                <span style={{ width: 18, height: 18, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                <span style={{ color: t.text }}>Kelompok {o.group}{o.group === activeGroup ? " — sedang menjawab" : ""}</span>
              </div>
            ))}
          </div>
        )}
        {activeGroup && <div style={{ marginTop: 10, fontSize: 13, color: t.dim }}>Kelompok {activeGroup} pegang giliran — klik huruf awal &amp; akhir kata di papan.</div>}
        <div style={{ marginTop: 10, fontSize: 11.5, color: t.faint }}>{babakId === 1 ? "Babak 1: kelompok yang sudah mencoba tidak bisa menjawab lagi untuk soal ini." : "Kelompok yang sudah mencoba boleh menjawab lagi kalau tidak ada kelompok lain yang mengangkat tangan."}</div>
        {currentWord && <button onClick={skipWord} style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px solid ${t.panel2}`, color: t.dim, borderRadius: 8, padding: "8px 12px", fontSize: 13, cursor: "pointer", width: "100%", justifyContent: "center" }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>⏭</span> Lewati soal ini</button>}
      </div>

      {renderScoreboard()}

      <button onClick={() => setPhonePreview(1)} style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "center", background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, borderRadius: 10, padding: "10px 12px", cursor: "pointer", fontSize: 13 }}>
        <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📱</span> Pratinjau HP Siswa
      </button>
    </div>
  );

  /* ---------------- Phone preview modal ---------------- */
  const PhonePreview = () => {
    const g = phonePreview;
    const eligible = isEligible(g);
    const won = activeGroup === g;
    const myPos = buzzOrder.findIndex((o) => o.group === g);
    const alreadyBuzzed = myPos >= 0;
    const lost = alreadyBuzzed && !won;
    let title = "Menunggu ronde berikutnya…";
    let sub = "Dengarkan petunjuk dari gurumu.";
    let btnDisabled = true;
    if (currentWord && !clueRevealed) { title = "Menunggu petunjuk…"; sub = "Guru belum menampilkan soal ini."; }
    else if (currentWord) {
      if (mode === "manual") { title = "Angkat tanganmu langsung"; sub = "Guru menilai kelompok mana yang paling cepat."; }
      else if (won) { title = "Giliranmu!"; sub = "Maju ke depan, tunjuk & bacakan katanya."; }
      else if (lost) { title = `Kamu urutan ke-${myPos + 1}`; sub = "Tunggu giliranmu kalau yang di depan salah."; }
      else if (!eligible) { title = "Kelompokmu sudah mencoba"; sub = "Tunggu kelompok lain dulu."; }
      else { title = "Ronde berjalan"; sub = "Sudah tahu jawabannya? Angkat tangan sekarang!"; btnDisabled = false; }
    }
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }} onClick={() => setPhonePreview(null)}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: "min(300px, 88vw)", background: t.modalBg, borderRadius: 32, padding: "20px 16px", boxShadow: "0 20px 60px rgba(0,0,0,.5)", position: "relative", transform: justWonPulse ? "scale(1.03)" : "scale(1)", transition: "transform .2s ease" }}>
          <button onClick={() => setPhonePreview(null)} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: t.dim, cursor: "pointer" }}><span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>✕</span></button>
          <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 14 }}>
            {GROUP_NAMES.map((n) => (
              <button key={n} onClick={() => setPhonePreview(n)} style={{ width: 26, height: 26, borderRadius: 7, border: "none", cursor: "pointer", background: n === g ? GROUP_COLORS[n - 1] : t.panel2, color: n === g ? "#101B34" : t.text, fontSize: 11, fontWeight: 700 }}>{n}</button>
            ))}
          </div>
          <div style={{ textAlign: "center", fontSize: 12, color: t.dim, marginBottom: 2 }}>Layar HP — Kelompok {g}</div>
          <div style={{ background: t.panel, borderRadius: 20, padding: 22, minHeight: 260, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, animation: justWonPulse ? "wonPulse .6s ease" : "none" }}>
            <div style={{ width: 14, height: 14, borderRadius: 5, background: GROUP_COLORS[g - 1] }} />
            <div className="sgt" style={{ fontSize: 18, fontWeight: 700, textAlign: "center", color: won ? GROUP_COLORS[g - 1] : t.text }}>{title}</div>
            <div style={{ fontSize: 12.5, color: t.dim, textAlign: "center" }}>{sub}</div>
            {mode === "digital" && (
              <button disabled={btnDisabled || alreadyBuzzed} onClick={() => buzz(g)} style={{
                width: 140, height: 140, borderRadius: "50%", border: "none", cursor: (btnDisabled || alreadyBuzzed) ? "default" : "pointer",
                background: won ? GROUP_COLORS[g - 1] : (btnDisabled || alreadyBuzzed) ? t.panel2 : GROUP_COLORS[g - 1],
                color: "#101B34", fontWeight: 700, fontSize: 15, opacity: (btnDisabled || alreadyBuzzed) && !won ? 0.35 : 1,
                display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center",
              }}>{won ? <span style={{ fontSize: 40, lineHeight: 1, color: 'inherit' }}>✅</span> : alreadyBuzzed ? `#${myPos + 1}` : "ANGKAT\nTANGAN"}</button>
            )}
          </div>
          <div style={{ marginTop: 12 }}>{renderScoreboard({ compact: true, highlight: g })}</div>
        </div>
      </div>
    );
  };

  /* ---------------- Modal: Simpan & Jeda (nama kelas) ---------------- */
  const SaveNameModal = () => (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70 }} onClick={() => !savingSession && setSaveNameOpen(false)}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(360px, 90vw)", background: t.modalBg, borderRadius: 20, padding: 24, boxShadow: "0 20px 60px rgba(0,0,0,.4)" }}>
        <div className="sgt" style={{ fontSize: 17, fontWeight: 700, color: t.text, marginBottom: 6 }}>Simpan & Jeda Sesi</div>
        <div style={{ fontSize: 12.5, color: t.dim, marginBottom: 14, lineHeight: 1.5 }}>Progres, skor, dan babak yang sedang berjalan akan tersimpan di Riwayat — bisa dilanjutkan nanti dari device mana pun. Audio soal tidak ikut tersimpan lintas device (mode tanpa Storage) — perlu diunggah ulang di device tempat melanjutkan.</div>
        <label style={{ fontSize: 10.5, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 }}>Nama kelas</label>
        <input autoFocus value={saveNameInput} onChange={(e) => setSaveNameInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") confirmSaveSession(); }}
          placeholder="mis. XI IPA 1" style={{ width: "100%", marginTop: 6, marginBottom: 16, padding: "10px 12px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 14, boxSizing: "border-box" }} />
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={() => setSaveNameOpen(false)} disabled={savingSession} style={{ background: "transparent", border: "none", color: t.dim, padding: "10px 14px", borderRadius: 8, cursor: "pointer", fontSize: 13 }}>Batal</button>
          <button onClick={confirmSaveSession} disabled={!saveNameInput.trim() || savingSession} style={{ background: saveNameInput.trim() ? "#F4B740" : t.panel2, color: saveNameInput.trim() ? "#101B34" : t.faint, border: "none", padding: "10px 16px", borderRadius: 8, cursor: saveNameInput.trim() ? "pointer" : "default", fontSize: 13, fontWeight: 700 }}>{savingSession ? "Menyimpan…" : "Simpan & Jeda"}</button>
        </div>
      </div>
    </div>
  );

  /* ---------------- Modal: Riwayat Sesi ---------------- */
  const HistoryModal = () => (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 20 }} onClick={() => setHistoryOpen(false)}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(520px, 92vw)", maxHeight: "80vh", overflowY: "auto", background: t.modalBg, borderRadius: 20, padding: 24, boxShadow: "0 20px 60px rgba(0,0,0,.4)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div className="sgt" style={{ fontSize: 18, fontWeight: 700, color: t.text }}>📜 Riwayat Sesi</div>
          <button onClick={() => setHistoryOpen(false)} style={{ background: "none", border: "none", color: t.dim, cursor: "pointer" }}><span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>✕</span></button>
        </div>
        <div style={{ fontSize: 12, color: t.dim, marginBottom: 14 }}>Sesi kelas yang dijeda, tersimpan di Firebase — muncul dari device manapun. Maksimal 10 sesi terbaru.</div>
        {!historyLoaded ? (
          <div style={{ padding: "20px 0", textAlign: "center", color: t.faint, fontSize: 13 }}>Memuat riwayat…</div>
        ) : historyList.length === 0 ? (
          <div style={{ padding: "20px 0", textAlign: "center", color: t.faint, fontSize: 13 }}>Belum ada sesi yang dijeda.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {historyList.map((it) => (
              <div key={it.id} className="list-row" style={{ background: t.panel, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 160 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: t.text }}>{it.className || "(tanpa nama)"}</div>
                  <div style={{ fontSize: 11.5, color: t.dim, marginTop: 2 }}>{it.materi} · Babak {it.babakId} · {formatSavedAt(it.savedAt)}</div>
                </div>
                <button onClick={() => resumeSession(it)} style={{ background: "#F4B740", border: "none", color: "#101B34", padding: "8px 12px", borderRadius: 8, cursor: "pointer", fontSize: 12.5, fontWeight: 700 }}>Lanjutkan</button>
                <button onClick={() => deleteHistoryItem(it.id)} title="Hapus sesi ini" className="row-del" style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 8, borderRadius: 8 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  ); }

  /* ---------------- STAGE: SETUP (Persiapan) ---------------- */
  if (stage === "setup") {
    const fieldLabelStyle = { fontSize: 10.5, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 };
    const iconBtn = { position: "relative", display: "flex", alignItems: "center", justifyContent: "center", width: 34, height: 34, background: "transparent", border: "none", borderRadius: 8, color: t.text, cursor: "pointer" };
    // FIX (UX): kunci jawaban dulu mewarnai SETIAP SEL kata dengan blok warna solid — kalau
    // banyak kata & banyak yang tumpang tindih, tampilannya jadi penuh kotak-kotak dan berat di
    // mata (apalagi kata diagonal jadi terlihat "patah-patah" karena tiap sel diagonal digambar
    // sebagai kotak terpisah, bukan garis lurus menyambung). Sekarang tiap kata cukup digambar
    // sebagai SATU garis tipis transparan dari huruf pertama ke huruf terakhir (mengikuti sudut
    // aslinya, termasuk diagonal), mirip tampilan word-search pada umumnya — jauh lebih ringan
    // dilihat dan tetap jelas menunjukkan posisi & arah tiap kata.
    const answerKeySegments = [];
    if (showAnswerKey && puzzlePreview) {
      babak.words.forEach((w) => {
        const cells = puzzlePreview.placements[w.id];
        if (!cells || cells.length === 0) return;
        const [r1, c1] = cells[0];
        const [r2, c2] = cells[cells.length - 1];
        answerKeySegments.push({ id: w.id, x1: c1 + 0.5, y1: r1 + 0.5, x2: c2 + 0.5, y2: r2 + 0.5, color: answerKeyColorByWordId[w.id] });
      });
    }
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
        <style>{fontImport}</style>
        {historyOpen && <HistoryModal />}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 26, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 28, fontWeight: 700 }}>Persiapan Permainan</div>
            <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Susun materi & kosakata sebelum mulai bermain bersama siswa.</div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            {/* Tombol sekunder (cadangan, riwayat, tema) diringkas jadi ikon saja supaya toolbar
                tidak ramai — teksnya tetap muncul sebagai tooltip saat disentuh/hover. */}
            <div style={{ display: "flex", gap: 2, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, borderRadius: 10, padding: 3 }}>
              <button onClick={() => setHistoryOpen(true)} title="Riwayat sesi tersimpan" style={iconBtn}>
                <span style={{ fontSize: 15, lineHeight: 1 }}>📜</span>
                {historyList.length > 0 && <span style={{ position: "absolute", top: 1, right: 1, background: "#EF5B5B", color: "#fff", borderRadius: "50%", width: 15, height: 15, fontSize: 9, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{historyList.length}</span>}
              </button>
              <button onClick={exportBackup} title="Cadangkan semua materi & kosakata ke file .json" style={iconBtn}><span style={{ fontSize: 15, lineHeight: 1 }}>💾</span></button>
              <label title="Muat cadangan dari file .json" style={{ ...iconBtn, cursor: "pointer" }}>
                <span style={{ fontSize: 15, lineHeight: 1 }}>📂</span>
                <input type="file" accept="application/json,.json" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
              </label>
              <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} title="Ganti tema terang/gelap" style={iconBtn} />
            </div>
            <button onClick={onBack} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>← Pilih Game</button>
          </div>
        </div>

        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={1} hint="(sesuai Prota Bahasa Jepang kelas XI Fase F)" faint={t.faint}>Pilih materi</SectionLabel>
          {/* Dulu tiap materi berupa kartu besar 2 baris — 9 kartu memakan hampir sepertiga
              layar padahal cuma dipilih sekali di awal. Sekarang jadi chip satu baris yang
              jauh lebih ringkas; deskripsinya pindah ke tooltip. */}
          <MateriPicker t={t} selected={selectedMateri} showDescription
            onSelect={(name) => { setSelectedMateri(name); setDataByMateri((prev) => ensureMateri(prev, name)); setBabakId(1); }} />
        </div>

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <SectionLabel n={2} hint="— edit, hapus, tambah, unggah audio" faint={t.faint}>Kosakata per babak</SectionLabel>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <button onClick={() => setBulkAddOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px dashed ${t.border}`, color: t.dim, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>📋</span> Tambah Banyak Sekaligus</button>
              <div style={{ display: "flex", gap: 6, background: t.panel2, padding: 4, borderRadius: 10 }}>
                {[1, 2, 3].map((id) => (
                  <button key={id} onClick={() => setBabakId(id)} style={{ padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", background: babakId === id ? "#F4B740" : "transparent", color: babakId === id ? "#101B34" : t.text, fontWeight: 600, fontSize: 13 }}>Babak {id}</button>
                ))}
              </div>
            </div>
          </div>

          <div style={{ fontSize: 12.5, color: t.faint, marginBottom: 12 }}>{babak.sub} · {babak.point} poin / soal · {babak.words.length} kosakata</div>

          {/* Label kolom cukup ditulis SEKALI di sini. Sebelumnya tiap baris mengulang
              "KATA / PETUNJUK / AUDIO" — 12 kata = 36 label, bikin halaman terasa penuh.
              Disembunyikan di HP karena lebar kolom tetapnya (>500px total) pasti overflow
              di layar sempit, dan sudah tergantikan oleh placeholder tiap input. */}
          {!isMobile && babak.words.length > 0 && (
            <div style={{ display: "flex", gap: 12, alignItems: "center", padding: "0 14px 8px", ...fieldLabelStyle }}>
              <span style={{ width: 24, flexShrink: 0 }} />
              <span style={{ width: 160, flexShrink: 0 }}>Kata (jawaban)</span>
              <span style={{ flex: 1, minWidth: 220 }}>Petunjuk (Bahasa Indonesia)</span>
              <span style={{ width: 44, textAlign: "center", flexShrink: 0 }}>Audio</span>
              <span style={{ width: 32, flexShrink: 0 }} />
            </div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {babak.words.map((w, idx) => (
              <div key={w.id} className="list-row" style={{ display: "flex", gap: 12, alignItems: "center", background: t.panel2, borderRadius: 12, padding: "10px 14px", flexWrap: "wrap" }}>
                <div style={{ width: 24, height: 24, borderRadius: "50%", background: t.panel, color: t.faint, fontSize: 11.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{idx + 1}</div>
                <input value={w.letters} onChange={(e) => updateWord(babakId, w.id, "letters", e.target.value)} placeholder="mis. BOTORU"
                  style={{ width: 160, flexShrink: 0, padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 13, fontWeight: 600 }} />
                <textarea value={w.clue} onChange={(e) => updateWord(babakId, w.id, "clue", e.target.value)} placeholder="Jelaskan kata ini dengan bahasa Indonesia" rows={1}
                  style={{ flex: 1, minWidth: 220, padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 13, resize: "vertical", fontFamily: "inherit", lineHeight: 1.45 }} />
                <div style={{ width: 44, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, flexShrink: 0 }}>
                  <label title={uploadingAudio[w.id] ? "Sedang mengunggah…" : w.audioUrl ? "Audio sudah diunggah — klik untuk ganti" : "Unggah audio"} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 36, height: 36, background: t.panel, border: `1px solid ${t.border}`, borderRadius: 8, color: uploadingAudio[w.id] ? "#F4B740" : w.audioUrl ? "#3FBFAD" : t.faint, cursor: uploadingAudio[w.id] ? "default" : "pointer", opacity: uploadingAudio[w.id] ? 0.6 : 1 }}>
                    {uploadingAudio[w.id] ? <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏳</span> : w.audioUrl ? <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🎵</span> : <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⬆</span>}
                    <input type="file" accept="audio/*" disabled={uploadingAudio[w.id]} onChange={(e) => uploadAudio(babakId, w.id, e.target.files[0])} style={{ display: "none" }} />
                  </label>
                  {audioUploadError[w.id] && <div style={{ fontSize: 10, color: "#EF5B5B", textAlign: "center", lineHeight: 1.3 }}>{audioUploadError[w.id]}</div>}
                </div>
                <button onClick={() => removeWord(babakId, w.id)} title="Hapus kosakata ini" className="row-del" style={{ width: 32, height: 32, flexShrink: 0, background: "transparent", border: "none", color: t.faint, cursor: "pointer", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
              </div>
            ))}
          </div>
          <button onClick={() => addWord(babakId)} style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>➕</span> Tambah Kosakata</button>
          <BulkAddModal
            open={bulkAddOpen}
            onClose={() => setBulkAddOpen(false)}
            onAdd={(text) => addWordsBulk(babakId, text)}
            title={`Tambah Banyak Kosakata Sekaligus — Babak ${babakId}`}
            formatHint={'Satu kosakata per baris, format: kata/petunjuk (dipisah tanda garis miring "/"). Baris yang tidak punya "/" akan dilewati.'}
            placeholder={"gomibako/Wadah penampung barang bekas atau sisa pakai yang sudah tidak digunakan\nkarendaa/Lembaran penanggalan yang menunjukkan susunan hari, tanggal, dan bulan dalam setahun"}
          />
        </div>

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
            <SectionLabel n={3} hint="— papan ini persis yang dipakai saat Mulai Permainan" faint={t.faint}>Kunci jawaban &amp; acak posisi — Babak {babakId}</SectionLabel>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => setShowAnswerKey((s) => !s)} style={{ display: "flex", alignItems: "center", gap: 6, background: showAnswerKey ? "#F4B740" : t.panel2, color: showAnswerKey ? "#101B34" : t.text, border: "none", borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
                <span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>{showAnswerKey ? "🙈" : "👁"}</span> {showAnswerKey ? "Sembunyikan Kunci" : "Tampilkan Kunci Jawaban"}
              </button>
              <button onClick={shufflePuzzlePreview} disabled={!babakWordsSig} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "8px 14px", cursor: babakWordsSig ? "pointer" : "default", fontSize: 13, fontWeight: 600, opacity: babakWordsSig ? 1 : 0.5 }}>
                <span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>🔀</span> Acak Ulang Posisi
              </button>
            </div>
          </div>

          {!puzzlePreview ? (
            <div style={{ padding: 20, color: t.dim, fontSize: 13.5, textAlign: "center" }}>
              {/* FIX: puzzlePreviewEntry.puzzle === null berarti kosakata sudah diisi tapi grid
                  gagal dibangun (bukan sekadar belum diisi) — beri pesan & solusi yang berbeda. */}
              {puzzlePreviewEntry && puzzlePreviewEntry.signature === babakWordsSig && puzzlePreviewEntry.puzzle === null
                ? `Papan gagal disusun dari kosakata Babak ${babakId} — coba kurangi jumlah kata atau perpendek beberapa kata, lalu klik "Acak Ulang Posisi" lagi.`
                : `Isi kosakata Babak ${babakId} dulu untuk melihat pratinjau papan.`}
            </div>
          ) : (
            <>
              <div style={{ fontSize: 12, color: t.faint, marginBottom: 10, lineHeight: 1.5 }}>
                Susunan huruf di bawah ini yang akan dipakai persis saat "Mulai Permainan" untuk Babak {babakId} — bukan diacak ulang otomatis. Klik "Acak Ulang Posisi" kalau ingin susunan lain sebelum sesi dimulai bersama siswa.
              </div>
              <div style={{ background: t.panel2, borderRadius: 12, padding: 10, maxWidth: 440, margin: "0 auto", boxSizing: "border-box" }}>
                <svg viewBox={`0 0 ${puzzlePreview.size} ${puzzlePreview.size}`} style={{ width: "100%", height: "auto", display: "block" }}>
                  {answerKeySegments.map((seg) => (
                    <line key={seg.id} x1={seg.x1} y1={seg.y1} x2={seg.x2} y2={seg.y2}
                      stroke={seg.color} strokeWidth={0.62} strokeLinecap="round" opacity={0.55} />
                  ))}
                  {puzzlePreview.grid.map((row, r) => row.map((letter, c) => (
                    <text key={cellKey(r, c)} x={c + 0.5} y={r + 0.5} textAnchor="middle" dominantBaseline="central"
                      fontSize={0.44} fontWeight={700} fill={t.cellText} style={{ fontFamily: "'Work Sans', system-ui, sans-serif" }}>{letter}</text>
                  )))}
                </svg>
              </div>
              {showAnswerKey && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12 }}>
                  {babak.words.filter((w) => w.letters.trim()).map((w) => (
                    <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel2, borderRadius: 8, padding: "5px 10px" }}>
                      <span style={{ width: 10, height: 10, borderRadius: 3, background: answerKeyColorByWordId[w.id], flexShrink: 0 }} />
                      <span style={{ fontSize: 12, fontWeight: 600 }}>{w.letters}</span>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>

        <button onClick={startGame} disabled={!canStart} style={{
          display: "flex", alignItems: "center", gap: 8, background: canStart ? "#F4B740" : t.panel2, color: canStart ? "#101B34" : t.faint,
          border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: canStart ? "pointer" : "default",
        }}>Mulai Permainan <span style={{ fontSize: 17, lineHeight: 1, color: 'inherit' }}>➡</span></button>
        {!canStart && <div style={{ marginTop: 8, fontSize: 12.5, color: t.faint }}>Isi minimal satu kosakata di Babak 1, 2, dan 3 untuk mulai.</div>}
      </div>
    );
  }

  /* ---------------- STAGE: PLAY — Projector view ---------------- */
  if (projectorMode) {
    return (
      <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", boxSizing: "border-box", position: "relative", overflowX: "hidden" }}>
        <style>{fontImport}</style>
        <audio ref={audioRef} style={{ display: "none" }} />
        {phonePreview && <PhonePreview />}
        {saveNameOpen && <SaveNameModal />}
        <CelebrationOverlay particles={confetti} />
        <button onClick={() => setProjectorMode(false)} title="Keluar mode proyektor" style={{ position: "fixed", top: 16, right: 16, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer", zIndex: 30 }}><span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>⤡</span></button>
        <div style={{ position: "fixed", top: 16, left: 16, display: "flex", gap: 8, zIndex: 30 }}>
          <button onClick={endGame} title="Akhiri permainan" style={{ display: "flex", alignItems: "center", gap: 6, background: t.bg, border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏹</span> Akhiri</button>
          <button onClick={openSaveNamePrompt} title="Simpan progres & jeda, lanjutkan nanti" style={{ display: "flex", alignItems: "center", gap: 6, background: t.bg, border: "1px solid #F4B740", color: "#F4B740", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>💾</span> Simpan & Jeda</button>
        </div>

        <div style={{ maxWidth: isMobile ? "100%" : (controlsOpen ? "calc(100% - 356px)" : 900), margin: "0 auto", padding: "28px 28px 100px", boxSizing: "border-box", transition: "max-width .2s ease" }}>
          <div className="sgt" style={{ fontSize: 24, fontWeight: 700, textAlign: "center", marginBottom: 16 }}>Word Search — {babak.label}</div>
          <div style={{ marginBottom: 18 }}>{renderBuzzIndicator({ big: true })}</div>
          {buzzOrder.length > 1 && (
            <div style={{ display: "flex", justifyContent: "center", gap: 10, flexWrap: "wrap", marginBottom: 18 }}>
              {buzzOrder.map((o, i) => (
                <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel, borderRadius: 10, padding: "8px 14px" }}>
                  <span style={{ width: 22, height: 22, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                  <span className="sgt" style={{ fontWeight: 700, fontSize: 14 }}>Kelompok {o.group}</span>
                </div>
              ))}
            </div>
          )}
          <div style={{ marginBottom: 18 }}>{renderGrid({ big: true })}</div>
          {renderScoreboard({ big: true })}
        </div>

        <button onClick={() => setControlsOpen((o) => !o)} style={{ position: "fixed", bottom: 16, right: 16, display: "flex", alignItems: "center", gap: 6, background: "#F4B740", color: "#101B34", border: "none", borderRadius: 10, padding: "10px 14px", cursor: "pointer", zIndex: 30, fontWeight: 700, fontSize: 13, boxShadow: "0 4px 16px rgba(0,0,0,.25)" }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>⚙</span> {controlsOpen ? "Sembunyikan Panel" : "Panel Guru"}</button>
        {controlsOpen && (
          <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, left: isMobile ? 0 : "auto", width: isMobile ? "auto" : 336, padding: "16px 16px 76px", overflowY: "auto", background: t.modalBg, boxShadow: "-8px 0 30px rgba(0,0,0,.3)", zIndex: 25, boxSizing: "border-box" }}>
            <div style={{ fontSize: 12, color: t.faint, marginBottom: 10, textAlign: "center" }}>Panel ini hanya guru yang lihat</div>
            {renderControlPanel()}
          </div>
        )}
      </div>
    );
  }

  /* ---------------- STAGE: PLAY — Control view ---------------- */
  return (
    <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
      <style>{fontImport}</style>
      <audio ref={audioRef} style={{ display: "none" }} />
      {phonePreview && <PhonePreview />}
      {saveNameOpen && <SaveNameModal />}
      <CelebrationOverlay particles={confetti} />
      <QrJoinModal open={qrOpen} onClose={() => setQrOpen(false)} roomCode={roomCode} joinedCount={Object.keys(joinedGroups).length} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16, marginBottom: 14 }}>
        <div>
          <div className="sgt page-title" style={{ fontSize: 30, fontWeight: 700, letterSpacing: -0.5 }}>Word Search</div>
          <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>{babak.label} · {babak.sub} · {babak.point} poin / soal</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <button onClick={() => setStage("setup")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13 }}>← Persiapan</button>
          <div style={{ display: "flex", gap: 6, background: t.panel, padding: 4, borderRadius: 10 }}>
            {[1, 2, 3].map((id) => (
              <button key={id} onClick={() => switchBabak(id)} style={{ padding: "8px 16px", borderRadius: 7, border: "none", cursor: "pointer", background: babakId === id ? "#F4B740" : "transparent", color: babakId === id ? "#101B34" : t.text, fontWeight: 600, fontSize: 14 }}>Babak {id}</button>
            ))}
          </div>
        </div>
      </div>

      {/* FIX (UX): toolbar ini dulu berisi 6 tombol berjajar tanpa pengelompokan yang jelas
          (info room, tampilan, & aksi sesi bercampur begitu saja), jadi terasa penuh & kurang
          rapi. Sekarang dikelompokkan jadi 3 bagian dengan pemisah tipis: (1) info room & join
          siswa, (2) opsi tampilan (tema & proyektor), (3) kontrol sesi (simpan/akhiri) yang
          didorong ke kanan. Tombol "Papan baru" (resetRound di tengah sesi) juga dihilangkan —
          papan sengaja dikunci sejak Persiapan (lihat shufflePuzzlePreview) supaya tidak berubah
          waktu siswa sedang bermain, jadi tombol ini pada praktiknya jarang benar-benar mengacak
          ulang papan (hanya mereset progres soal yang sudah ditemukan). Kalau memang perlu susunan
          baru, itu harus dilakukan di Persiapan lewat "Acak Ulang Posisi" SEBELUM permainan
          dimulai — bukan di tengah sesi. */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 22 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel, padding: "6px 8px", borderRadius: 10 }}>
            <span style={{ fontSize: 16, lineHeight: 1, color: t.dim }}>🔳</span><span style={{ fontSize: 13, color: t.dim }}>Kode Room</span>
            <span className="sgt" style={{ fontSize: 16, fontWeight: 700, letterSpacing: 2 }}>{roomCode}</span>
          </div>
          <button onClick={() => setQrOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#3FBFAD", border: "none", color: "#0D1730", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📷</span> QR Gabung</button>
        </div>

        <div style={{ width: 1, alignSelf: "stretch", background: t.panel2, margin: "0 2px" }} />

        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
          <button onClick={() => setProjectorMode(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#F4B740", border: "none", color: "#101B34", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⤢</span> Mode Proyektor</button>
        </div>

        <div style={{ flex: "1 0 auto" }} />

        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <button onClick={openSaveNamePrompt} title="Simpan progres & jeda, lanjutkan nanti (mis. pindah ke kelas lain)" style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "1px solid #F4B740", color: "#F4B740", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>💾</span> Simpan & Jeda</button>
          <button onClick={endGame} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏹</span> Akhiri Permainan</button>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <span style={{ fontSize: 13, color: t.dim }}>Mode angkat tangan:</span>
        <div style={{ display: "flex", background: t.panel, borderRadius: 10, padding: 4 }}>
          <button onClick={() => { setMode("digital"); releaseTurn(); }} style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", background: mode === "digital" ? "#3FBFAD" : "transparent", color: mode === "digital" ? "#0D1730" : t.text, fontWeight: 600, fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>📻</span> Digital</button>
          <button onClick={() => { setMode("manual"); releaseTurn(); }} style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", background: mode === "manual" ? "#3FBFAD" : "transparent", color: mode === "manual" ? "#0D1730" : t.text, fontWeight: 600, fontSize: 13 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>✋</span> Manual</button>
        </div>
        <span style={{ fontSize: 12.5, color: t.faint }}>{mode === "digital" ? "Kelompok pencet tombol duluan untuk mengunci giliran." : "Guru klik kelompok sesuai urutan angkat tangan di kelas — bisa klik beberapa kelompok berurutan sekaligus."}</span>
      </div>

      <div style={{ display: "flex", gap: 22, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 520px", position: "relative" }}>
          <div style={{ fontSize: 13, color: t.dim, marginBottom: 10 }}>
            {puzzle ? (currentWord ? `Soal ${foundCount + 1} dari ${totalWords}` : "Semua soal selesai 🎉") : ""}
            {selStart && currentWord && <span style={{ color: "#F4B740" }}> — klik huruf terakhir kata</span>}
          </div>
          {flash && (
            <div style={{ position: "absolute", top: 34, left: "50%", transform: "translateX(-50%)", zIndex: 5, padding: "8px 18px", borderRadius: 10, fontWeight: 700, fontSize: 14, background: flash.type === "correct" ? "#3FBFAD" : "#EF5B5B", color: "#0D1730", animation: "pulseFlash 1.2s ease forwards" }}>
              {flash.type === "correct" ? `Benar! Kelompok ${flash.group} +${babak.point} poin` : `Belum tepat — giliran dibuka lagi`}
            </div>
          )}
          {renderGrid()}
          {puzzle && !currentWord && <div style={{ marginTop: 16, fontSize: 14, color: t.dim }}>Semua kosakata di babak ini sudah ditemukan. Ganti babak untuk melanjutkan.</div>}
        </div>
        <div style={{ flex: "1 1 280px" }}>{renderControlPanel()}</div>
      </div>
    </div>
  );
}

/* ===========================================================
   GAME 2 — BUKA KOTAK (gaya Wordwall: pilih nomor, kerjakan perintah)
   Individu, tanpa batas waktu, tanpa skor — murni latihan.
=========================================================== */
const BOX_COLORS = ["#F4B740", "#EF5B5B", "#3FBFAD", "#F2879E", "#5DA9E9", "#8FBF6B"];

const SEED_INSTRUCTIONS = [
  "Tuliskan 3 kosakata benda yang berhubungan dengan alat elektronik.",
  "Sebutkan 6 kosakata perlengkapan alat tulis yang ada di atas meja belajarmu.",
  "Sebutkan 5 nama benda yang biasa dibawa siswa di dalam tas sekolah!",
  "Tuliskan 3 nama ruangan di sekolah yang memiliki akhiran -shitsu beserta artinya!",
  "Sebutkan 4 nama fasilitas atau tempat umum di sekolah selain ruang kelas!",
  "Sebutkan 3 nama benda di dalam kelas yang letaknya biasanya menempel di dinding!",
  "Sebutkan 3 kosakata benda di kelas yang biasa terbuat dari kayu!",
  "Buat 2 kalimat tunjuk benda yang letaknya dekat dengan pembicara dan jauh dari keduanya",
  "Buat 2 kalimat pernyataan kepemilikan barang",
  "Buat 1 kalimat penyangkalan kepemilikan barang",
  "Buat 2 kalimat untuk menyatakan nama benda ke dalam bahasa Jepang",
  "Buat 1 kalimat tanya kepemilikan barang menggunakan kata tanya dare",
  "Buat 1 kalimat tanya untuk memastikan benda di dekat lawan bicara, beserta contoh jawaban penyangkalannya!",
  "Terjemahkan ke dalam bahasa Jepang: \"Ini adalah buku catatan milik guru\"!",
  "Terjemahkan ke dalam bahasa Jepang: \"Itu (jauh) bukan kamus milik Tono\"!",
  "Buat 2 kalimat letak benda yang menggunakan posisi ue dan shita!",
  "Buat 1 kalimat yang menyatakan bahwa suatu benda berada di dalam tempat lain!",
