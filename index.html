                                    fill={t.panel} stroke={t.border} strokeWidth={0.03} />
                                )))}
                                {answerKeySegments.map((seg) => (
                                  <line key={seg.id} x1={seg.x1} y1={seg.y1} x2={seg.x2} y2={seg.y2}
                                    stroke={seg.color} strokeWidth={0.72} strokeLinecap="round" opacity={0.5} />
                                ))}
                                {puzzlePreview.grid.map((row, r) => row.map((letter, c) => (
                                  <text key={cellKey(r, c)} x={c + 0.5} y={r + 0.5} textAnchor="middle" dominantBaseline="central"
                                    fontSize={0.44} fontWeight={700} fill={t.cellText} style={{ fontFamily: "'Work Sans', system-ui, sans-serif" }}>{letter}</text>
                                )))}
                              </svg>
                            </div>
                          )}
                          </div>

                          {/* Kolom kanan: judul + tombol + catatan + kunci jawaban */}
                          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                            {/* Judul */}
                            <div className="sgt" style={{ fontSize: 14, fontWeight: 700, color: t.dim, textTransform: "uppercase", letterSpacing: 0.4 }}>Papan &amp; kunci jawaban</div>

                            {/* Tombol Tampilkan Kunci & Acak Ulang */}
                            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                              <button onClick={() => setShowAnswerKey((s) => !s)} style={{ display: "flex", alignItems: "center", gap: 6, background: showAnswerKey ? "#F4B740" : t.panel, color: showAnswerKey ? "#101B34" : t.text, border: "none", borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>
                                <span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>{showAnswerKey ? "🙈" : "👁"}</span> {showAnswerKey ? "Sembunyikan Kunci" : "Tampilkan Kunci"}
                              </button>
                              <button onClick={shufflePuzzlePreview} disabled={!babakWordsSig} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: "none", color: t.text, borderRadius: 8, padding: "8px 14px", cursor: babakWordsSig ? "pointer" : "default", fontSize: 14, fontWeight: 600, opacity: babakWordsSig ? 1 : 0.5 }}>
                                <span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>🔀</span> Acak Ulang
                              </button>
                            </div>

                            {/* Catatan di bawah papan */}
                            <div style={{ fontSize: 14, color: t.dim, lineHeight: 1.6 }}>
                              Papan ini persis yang dipakai saat "Mulai Permainan" — bukan diacak ulang otomatis.
                            </div>

                            {/* Kunci jawaban (legend warna) */}
                            {showAnswerKey && puzzlePreview && (
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                                {babak.words.filter((w) => w.letters.trim()).map((w) => (
                                  <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel2, borderRadius: 8, padding: "4px 10px" }}>
                                    <span style={{ width: 9, height: 9, borderRadius: 3, background: answerKeyColorByWordId[w.id], flexShrink: 0 }} />
                                    <span style={{ fontSize: 14, fontWeight: 600 }}>{w.letters}</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>{/* end baris atas */}

                        {/* Daftar kosakata — di bawah, full width */}
                        <div style={{ width: "100%" }}>
                          {/* Label kolom cukup ditulis SEKALI di sini. Sebelumnya tiap baris mengulang
                              "KATA / PETUNJUK / AUDIO" — 12 kata = 36 label, bikin halaman terasa penuh.
                              Disembunyikan di HP karena lebar kolom tetapnya (>500px total) pasti overflow
                              di layar sempit, dan sudah tergantikan oleh placeholder tiap input. */}
                          {!isMobile && babak.words.length > 0 && (
                            <div style={{ display: "flex", gap: 12, alignItems: "center", padding: "0 14px 8px", ...fieldLabelStyle }}>
                              <span style={{ width: 24, flexShrink: 0 }} />
                              <span style={{ width: 160, flexShrink: 0 }}>Kata (jawaban)</span>
                              <span style={{ flex: 1, minWidth: 220 }}>Petunjuk (Bahasa Indonesia)</span>
                              <span style={{ width: 44, textAlign: "center", flexShrink: 0 }}>Audio</span>
                              <span style={{ width: 32, flexShrink: 0 }} />
                            </div>
                          )}

                          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {babak.words.map((w, idx) => (
                              <div key={w.id} className="list-row" style={{ display: "flex", gap: 12, alignItems: "center", background: t.panel, borderRadius: 12, padding: "10px 14px", flexWrap: "wrap" }}>
                                <div style={{ width: 26, height: 26, borderRadius: "50%", background: t.panel2, color: t.faint, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{idx + 1}</div>
                                <input value={w.letters} onChange={(e) => updateWord(babakId, w.id, "letters", e.target.value)} placeholder="mis. BOTORU"
                                  style={{ width: 160, flexShrink: 0, padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel2, color: t.text, fontSize: 14, fontWeight: 600 }} />
                                <textarea value={w.clue} onChange={(e) => updateWord(babakId, w.id, "clue", e.target.value)} placeholder="Jelaskan kata ini dengan bahasa Indonesia" rows={1}
                                  style={{ flex: 1, minWidth: 220, padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel2, color: t.text, fontSize: 14, resize: "vertical", fontFamily: "inherit", lineHeight: 1.45 }} />
                                <div style={{ width: 44, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, flexShrink: 0 }}>
                                  <label title={uploadingAudio[w.id] ? "Sedang memampatkan audio — bisa makan waktu semirip durasi klipnya, mohon tunggu…" : w.audioUrl ? "Audio sudah diunggah — klik untuk ganti" : "Unggah audio"} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 36, height: 36, background: t.panel2, border: `1px solid ${t.border}`, borderRadius: 8, color: uploadingAudio[w.id] ? "#F4B740" : w.audioUrl ? "#3FBFAD" : t.faint, cursor: uploadingAudio[w.id] ? "default" : "pointer", opacity: uploadingAudio[w.id] ? 0.6 : 1 }}>
                                    {uploadingAudio[w.id] ? <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏳</span> : w.audioUrl ? <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🎵</span> : <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⬆</span>}
                                    <input type="file" accept="audio/*" disabled={uploadingAudio[w.id]} onChange={(e) => uploadAudio(babakId, w.id, e.target.files[0])} style={{ display: "none" }} />
                                  </label>
                                  {audioUploadError[w.id] && <div style={{ fontSize: 14, color: "#EF5B5B", textAlign: "center", lineHeight: 1.3 }}>{audioUploadError[w.id]}</div>}
                                </div>
                                <button onClick={() => removeWord(babakId, w.id)} title="Hapus kosakata ini" className="row-del" style={{ width: 32, height: 32, flexShrink: 0, background: "transparent", border: "none", color: t.faint, cursor: "pointer", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
                              </div>
                            ))}
                          </div>
                          <button onClick={() => addWord(babakId)} style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, background: t.panel, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 14 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>➕</span> Tambah Kosakata</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <BulkAddModal
            open={bulkAddOpen}
            onClose={() => setBulkAddOpen(false)}
            onAdd={(text) => addWordsBulk(babakId, text)}
            title={`Tambah Banyak Kosakata Sekaligus — Babak ${babakId}`}
            formatHint={'Satu kosakata per baris, format: kata/petunjuk (dipisah tanda garis miring "/"). Baris yang tidak punya "/" akan dilewati.'}
            placeholder={"gomibako/Wadah penampung barang bekas atau sisa pakai yang sudah tidak digunakan\nkarendaa/Lembaran penanggalan yang menunjukkan susunan hari, tanggal, dan bulan dalam setahun"}
          />
        </div>


        {/* Tombol Mulai Permainan — sticky di bawah, full prominence */}
        <div style={{ position: "sticky", bottom: 20, display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 6, marginTop: 8, zIndex: 10 }}>
          <button onClick={startGame} disabled={!canStart || startingGame} style={{
            display: "flex", alignItems: "center", gap: 10,
            background: canStart ? "#F4B740" : t.panel2,
            color: canStart ? "#101B34" : t.faint,
            border: "none", borderRadius: 14,
            padding: "16px 28px",
            fontWeight: 800, fontSize: 17,
            cursor: canStart && !startingGame ? "pointer" : "default",
            boxShadow: canStart ? "0 4px 18px rgba(244,183,64,0.45)" : "none",
            transition: "box-shadow .2s, background .2s",
            opacity: startingGame ? 0.75 : 1,
          }}>
            {startingGame
              ? (<><span className="spin-icon" style={{ fontSize: 18, lineHeight: 1 }}>🔄</span> Memulai…</>)
              : (<>Mulai Permainan <span style={{ fontSize: 20, lineHeight: 1, color: "inherit" }}>➡</span></>)}
          </button>
          {!canStart && <div style={{ fontSize: 14, color: t.faint }}>Isi minimal satu kosakata di salah satu babak untuk mulai.</div>}
        </div>
        </div>
      </div>
    );
  }

  /* ---------------- STAGE: PLAY — Projector view ---------------- */
  if (projectorMode) {
    const topOverlayButtons = (
      <React.Fragment>
        <button onClick={() => setProjectorMode(false)} title="Keluar mode proyektor" style={{ position: "fixed", top: 16, right: 16, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer", zIndex: 30 }}><span style={{ fontSize: 18, lineHeight: 1, color: 'inherit' }}>⤡</span></button>
        <div style={{ position: "fixed", top: 16, left: 16, display: "flex", gap: 8, zIndex: 30 }}>
          <button onClick={endGame} title="Akhiri permainan" style={{ display: "flex", alignItems: "center", gap: 6, background: t.bg, border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>⏹</span> Akhiri</button>
          <button onClick={openSaveNamePrompt} title="Simpan progres & jeda, lanjutkan nanti" style={{ display: "flex", alignItems: "center", gap: 6, background: t.bg, border: "1px solid #F4B740", color: "#F4B740", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>💾</span> Simpan & Jeda</button>
        </div>
      </React.Fragment>
    );
    const flashBanner = flash && (
      <div style={{ position: "absolute", top: -8, left: "50%", transform: "translate(-50%, -100%)", zIndex: 5, padding: "10px 22px", borderRadius: 12, fontWeight: 700, fontSize: 17, textAlign: "center", background: flash.type === "correct" ? "#3FBFAD" : flash.type === "revealed" ? REVEALED_COLOR : "#EF5B5B", color: "#0D1730", animation: `pulseFlash ${flash.type === "revealed" ? 2.4 : flash.type === "correct" ? 1.4 : 0.9}s ease forwards`, maxWidth: "90%", boxShadow: "0 6px 20px rgba(0,0,0,.25)" }}>
        {flash.type === "correct" ? `Benar! Kelompok ${flash.group} +${babak.point} poin`
          : flash.type === "revealed" ? `Jawaban: ${flash.word}`
          : "Belum tepat — giliran dibuka lagi"}
      </div>
    );
    const autoNextBanner = autoNext !== null && (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, background: t.panel, padding: "10px 16px", borderRadius: 12, marginTop: 10, flexWrap: "wrap" }}>
        <span className="sgt" style={{ fontSize: 14, fontWeight: 700 }}>🎉 Babak {babakId} selesai! Lanjut ke Babak {babakId + 1} dalam {autoNext} detik…</span>
        <button onClick={cancelAutoNext} style={{ background: t.panel2, border: "none", color: t.dim, borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>Batalkan</button>
      </div>
    );

    // Layar besar (proyektor/laptop) — dulu papan skor & panel guru ditaruh DI BAWAH papan huruf,
    // jadi kelas harus scroll ke bawah untuk lihat skor, dan panel guru cuma bisa dibuka lewat
    // tombol mengambang yang menutupi papan. Padahal kiri-kanan layar proyektor kosong tidak
    // terpakai. Sekarang jadi 3 kolom penuh layar (tanpa scroll halaman): kiri = Papan Skor,
    // tengah = papan huruf & indikator giliran (fokus utama kelas), kanan = navigasi/panel guru
    // (selalu terlihat, tidak perlu dibuka-tutup lagi). Di HP tetap pakai tata letak lama yang
    // bisa di-scroll, karena 3 kolom tidak akan muat di layar sempit.
    if (!isMobile) {
      // Ukuran & font papan dihitung dari ruang yang benar-benar terukur (projectorBoardPx, lihat
      // ResizeObserver di atas) — bukan angka tetap — supaya selalu pas apa pun ukuran puzzle-nya.
      const projectorFontPx = puzzle ? Math.max(9, Math.floor((projectorBoardPx / puzzle.size) * 0.42)) : 20;
      return (
        <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, height: "100vh", width: "100vw", boxSizing: "border-box", overflow: "hidden", display: "grid", gridTemplateColumns: "220px minmax(0,1fr) 320px", gap: 16, padding: "58px 16px 16px" }}>
          <style>{fontImport}</style>
          <audio ref={audioRef} style={{ display: "none" }} />
          {saveNameOpen && renderSaveNameModal()}
      {showBackConfirm && renderBackConfirmModal()}
          <CelebrationOverlay particles={confetti} />
          {renderHintOverlay()}
          {topOverlayButtons}

          <div style={{ overflowY: "auto", minHeight: 0, display: "flex", flexDirection: "column", gap: 12 }}>
            {/* FIX (UX): judul, indikator "siapa angkat tangan duluan", & badge urutan angkat tangan
                tadinya ditaruh DI ATAS papan (kolom tengah) — bikin kolom tengah tidak murni papan
                saja, dan siswa yang fokus ke papan jadi terganggu elemen lain di sekitarnya.
                Dipindah ke sini (kolom kiri, atas Papan Skor) supaya kolom tengah proyektor
                benar-benar cuma berisi papan huruf. */}
            <div className="sgt" style={{ fontSize: 16, fontWeight: 700, textAlign: "center" }}>Word Search — {babak.label}</div>
            {renderBuzzIndicator()}
            {buzzOrder.length > 1 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {buzzOrder.map((o, i) => (
                  <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, borderRadius: 10, padding: "5px 10px" }}>
                    <span style={{ width: 26, height: 26, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</span>
                    <span className="sgt" style={{ fontWeight: 700, fontSize: 14, flex: 1 }}>Kelompok {o.group}</span>
                    <button onClick={() => skipGroupFromQueue(o.group)} title={`Lewati Kelompok ${o.group} (angkat tangan tapi tidak tahu jawabannya)`} style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 2, display: "flex", alignItems: "center", flexShrink: 0 }}><span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>⏭</span></button>
                  </div>
                ))}
              </div>
            )}
            {renderScoreboard({ editable: guruModeOn })}
          </div>

          <div style={{ minHeight: 0, minWidth: 0, height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            {/* FIX (UX / bug "kedipan"): flashBanner (pesan benar/salah/jawaban) yang dulu melayang
                DI ATAS papan sudah dipindah jadi teks statis di panel kanan (lihat renderControlPanel)
                — jadi kolom tengah proyektor sekarang murni cuma papan, tidak ada apa pun yang
                menutupi atau bongkar-pasang di atasnya tiap soal berganti. */}
            <div ref={projectorGridAreaRef} style={{ flex: 1, minHeight: 0, width: "100%", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {renderGrid({ sizePx: projectorBoardPx, fontPx: projectorFontPx })}
            </div>
            {autoNextBanner}
          </div>

          <div style={{ overflowY: "auto", minHeight: 0 }}>
            {/* FIX: dulu ada label "Panel ini hanya guru yang lihat" di sini — padahal kolom ini
                dirender di halaman yang SAMA dengan papan huruf yang diproyeksikan. Kalau layar
                laptop di-mirror ke proyektor (setup paling umum), kolom ini ikut terlihat kelas
                juga. Labelnya dihapus karena menyesatkan — tidak ada pemisahan teknis sungguhan
                antara "yang guru lihat" dan "yang kelas lihat" di mode ini. */}
            {/* hideBuzzOrder: daftar urutan angkat tangan sudah ditampilkan di kolom kiri (atas), lihat di atas */}
            {renderControlPanel({ hideScoreboard: true, hideBuzzOrder: true })}
          </div>
        </div>
      );
    }

    return (
      <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", boxSizing: "border-box", position: "relative", overflowX: "hidden" }}>
        <style>{fontImport}</style>
        <audio ref={audioRef} style={{ display: "none" }} />
        {saveNameOpen && renderSaveNameModal()}
      {showBackConfirm && renderBackConfirmModal()}
        <CelebrationOverlay particles={confetti} />
        {renderHintOverlay()}
        {topOverlayButtons}

        <div style={{ maxWidth: "100%", margin: "0 auto", padding: "28px 20px 100px", boxSizing: "border-box" }}>
          <div className="sgt" style={{ fontSize: 22, fontWeight: 700, textAlign: "center", marginBottom: 16 }}>Word Search — {babak.label}</div>
          <div style={{ marginBottom: 18 }}>{renderBuzzIndicator({ big: true })}</div>
          {buzzOrder.length > 1 && (
            <div style={{ display: "flex", justifyContent: "center", gap: 10, flexWrap: "wrap", marginBottom: 18 }}>
              {buzzOrder.map((o, i) => (
                <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel, borderRadius: 10, padding: "8px 14px" }}>
                  <span style={{ width: 26, height: 26, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                  <span className="sgt" style={{ fontWeight: 700, fontSize: 14 }}>Kelompok {o.group}</span>
                  <button onClick={() => skipGroupFromQueue(o.group)} title={`Lewati Kelompok ${o.group} (angkat tangan tapi tidak tahu jawabannya)`} style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 2, display: "flex", alignItems: "center" }}><span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>⏭</span></button>
                </div>
              ))}
            </div>
          )}
          <div style={{ position: "relative" }}>
            {flashBanner}
            <div style={{ marginBottom: 18 }}>{renderGrid({ big: true })}</div>
            {autoNextBanner}
          </div>
          {renderScoreboard({ big: true })}
        </div>

        <button onClick={() => setControlsOpen((o) => !o)} style={{ position: "fixed", bottom: 16, right: 16, display: "flex", alignItems: "center", gap: 6, background: "#F4B740", color: "#101B34", border: "none", borderRadius: 10, padding: "10px 14px", cursor: "pointer", zIndex: 30, fontWeight: 700, fontSize: 14, boxShadow: "0 4px 16px rgba(0,0,0,.25)" }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>⚙</span> {controlsOpen ? "Sembunyikan Panel" : "Panel Guru"}</button>
        {controlsOpen && (
          <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, left: 0, padding: "16px 16px 76px", overflowY: "auto", background: t.modalBg, boxShadow: "-8px 0 30px rgba(0,0,0,.3)", zIndex: 25, boxSizing: "border-box" }}>
            {/* FIX: label "Panel ini hanya guru yang lihat" dihapus — menyesatkan, karena kalau
                layar guru di-mirror ke proyektor (setup paling umum), panel ini ikut tampil ke
                seluruh kelas juga, bukan cuma guru. */}
            {/* hideBuzzOrder: daftar urutan angkat tangan sudah ditampilkan di atas papan, lihat di atas */}
            {renderControlPanel({ hideBuzzOrder: true })}
          </div>
        )}
      </div>
    );
  }

  /* ---------------- STAGE: PLAY — Control view (satu layar penuh, tanpa scroll) ---------------- */
  return (
    <div className="app-screen" style={{
      fontFamily: "'Work Sans', system-ui, sans-serif",
      background: t.bg, color: t.text,
      height: "100vh", width: "100vw",
      boxSizing: "border-box",
      display: "flex", flexDirection: "column",
      overflow: "hidden", padding: "12px 16px 10px",
    }}>
      <style>{fontImport}</style>
      <audio ref={audioRef} style={{ display: "none" }} />
      {saveNameOpen && renderSaveNameModal()}
      {showBackConfirm && renderBackConfirmModal()}
      <CelebrationOverlay particles={confetti} />
      {renderHintOverlay()}
      <QrJoinModal open={qrOpen} onClose={() => setQrOpen(false)} roomCode={roomCode} joinedCount={Object.keys(joinedGroups).length} />

      {/* BARIS 1: Judul + navigasi babak */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8, flexShrink: 0 }}>
        <div>
          <div className="sgt page-title" style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.3 }}>Word Search</div>
          <div style={{ fontSize: 14, color: t.dim }}>{babak.label} · {babak.sub} · {babak.point} poin / soal</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => setShowBackConfirm(true)} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "7px 12px", borderRadius: 8, cursor: "pointer", fontSize: 14 }}>← Persiapan</button>
          <div style={{ display: "flex", gap: 4, background: t.panel, padding: 3, borderRadius: 8 }}>
            {[1, 2, 3].map((id) => (
              <button key={id} onClick={() => switchBabak(id)} style={{ padding: "6px 12px", borderRadius: 6, border: "none", cursor: "pointer", background: babakId === id ? "#F4B740" : "transparent", color: babakId === id ? "#101B34" : t.text, fontWeight: 600, fontSize: 14 }}>Babak {id}</button>
            ))}
          </div>
        </div>
      </div>

      {/* BARIS 2: Toolbar (kode room, proyektor, simpan, akhiri) — compact */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8, flexShrink: 0 }}>
        {/* Kode Room & QR */}
        <div style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, padding: "5px 8px", borderRadius: 8 }}>
          <span style={{ fontSize: 14, lineHeight: 1, color: t.dim }}>🔳</span>
          <span style={{ fontSize: 14, color: t.dim }}>Kode Room</span>
          <span className="sgt" style={{ fontSize: 14, fontWeight: 700, letterSpacing: 2 }}>{roomCode}</span>
        </div>
        <button onClick={() => setQrOpen(true)} style={{ display: "flex", alignItems: "center", gap: 5, background: "#3FBFAD", border: "none", color: "#0D1730", padding: "7px 11px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 14, lineHeight: 1 }}>📷</span> QR Gabung</button>

        <div style={{ width: 1, alignSelf: "stretch", background: t.border, margin: "0 2px" }} />

        <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, color: t.text, padding: 7, borderRadius: 8, cursor: "pointer" }} />
        <button onClick={() => setProjectorMode(true)} style={{ display: "flex", alignItems: "center", gap: 5, background: "#F4B740", border: "none", color: "#101B34", padding: "7px 11px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 14, lineHeight: 1 }}>⤢</span> Mode Proyektor</button>

        <div style={{ flex: "1 0 auto" }} />

        <button onClick={openSaveNamePrompt} style={{ display: "flex", alignItems: "center", gap: 5, background: "transparent", border: "1px solid #F4B740", color: "#F4B740", padding: "7px 11px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 14, lineHeight: 1 }}>💾</span> Simpan & Jeda</button>
        <button onClick={endGame} style={{ display: "flex", alignItems: "center", gap: 5, background: "transparent", border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "7px 11px", borderRadius: 8, cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 14, lineHeight: 1 }}>⏹</span> Akhiri Permainan</button>
      </div>

      {/* BARIS 3: Mode angkat tangan — compact */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexShrink: 0 }}>
        <span style={{ fontSize: 14, color: t.dim }}>Mode angkat tangan:</span>
        <div style={{ display: "flex", background: t.panel, borderRadius: 8, padding: 3 }}>
          <button onClick={() => switchInputMode("digital")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 6, border: "none", cursor: "pointer", background: mode === "digital" ? "#3FBFAD" : "transparent", color: mode === "digital" ? "#0D1730" : t.text, fontWeight: 600, fontSize: 14 }}><span style={{ fontSize: 14, lineHeight: 1 }}>📻</span> Digital</button>
          <button onClick={() => switchInputMode("manual")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 6, border: "none", cursor: "pointer", background: mode === "manual" ? "#3FBFAD" : "transparent", color: mode === "manual" ? "#0D1730" : t.text, fontWeight: 600, fontSize: 14 }}><span style={{ fontSize: 14, lineHeight: 1 }}>✋</span> Manual</button>
        </div>
        <span style={{ fontSize: 14, color: t.faint }}>{mode === "digital" ? "Kelompok pencet tombol duluan untuk mengunci giliran." : "Guru klik kelompok sesuai urutan angkat tangan."}</span>
      </div>

      {/* BARIS 4: Konten utama — 3 kolom seperti mode proyektor */}
      <div style={{ display: "grid", gridTemplateColumns: "200px minmax(0,1fr) 300px", gap: 14, flex: 1, minHeight: 0 }}>

        {/* Kolom kiri: Papan Skor + buzz order */}
        <div style={{ overflowY: "auto", minHeight: 0, display: "flex", flexDirection: "column", gap: 10 }}>
          <div className="sgt" style={{ fontSize: 14, fontWeight: 700, textAlign: "center", color: t.dim }}>Word Search — {babak.label}</div>
          {renderBuzzIndicator()}
          {buzzOrder.length > 1 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {buzzOrder.map((o, i) => (
                <div key={o.group} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, borderRadius: 8, padding: "4px 8px" }}>
                  <span style={{ width: 26, height: 26, borderRadius: "50%", background: GROUP_COLORS[o.group - 1], color: "#101B34", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</span>
                  <span className="sgt" style={{ fontWeight: 700, fontSize: 14, flex: 1 }}>Kelompok {o.group}</span>
                  <button onClick={() => skipGroupFromQueue(o.group)} title={`Lewati Kelompok ${o.group} (angkat tangan tapi tidak tahu jawabannya)`} style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 2, display: "flex", alignItems: "center", flexShrink: 0 }}><span style={{ fontSize: 14, lineHeight: 1, color: "inherit" }}>⏭</span></button>
                </div>
              ))}
            </div>
          )}
          {renderScoreboard({ editable: guruModeOn })}
        </div>

        {/* Kolom tengah: papan huruf — fokus utama, sebesar mungkin */}
        <div style={{ minHeight: 0, minWidth: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <div style={{ flex: 1, minHeight: 0, width: "100%", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {renderGrid()}
          </div>
          {puzzle && !currentWord && (
            autoNext !== null ? (
              <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 10, background: t.panel, padding: "8px 12px", borderRadius: 10, flexWrap: "wrap", flexShrink: 0, width: "100%" }}>
                <span style={{ fontSize: 14, color: t.text }}>🎉 Babak {babakId} selesai! Lanjut ke Babak {babakId + 1} dalam <b>{autoNext}</b> detik…</span>
                <button onClick={cancelAutoNext} style={{ background: t.panel2, border: "none", color: t.dim, borderRadius: 7, padding: "5px 10px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>Batalkan</button>
              </div>
            ) : (
              <div style={{ marginTop: 8, fontSize: 14, color: t.dim, flexShrink: 0 }}>Semua kosakata sudah ditemukan. Ganti babak untuk melanjutkan.</div>
            )
          )}
        </div>

        {/* Kolom kanan: panel kontrol guru */}
        <div style={{ overflowY: "auto", minHeight: 0, display: "flex", flexDirection: "column", gap: 10 }}>
          {renderControlPanel({ hideScoreboard: true, hideBuzzOrder: true })}
        </div>
      </div>
    </div>
  );
}

const BOX_COLORS = ["#F4B740", "#EF5B5B", "#3FBFAD", "#F2879E", "#5DA9E9", "#8FBF6B"];
// FITUR BARU: dipakai untuk memberi efek gradien pada kotak Mystery Box (dari warna aslinya ke
// versi lebih gelap/terang) supaya kotaknya terasa lebih "berbentuk" (chunky button), bukan
// blok warna polos satu lapis seperti sebelumnya. percent negatif = digelapkan, positif = diterangkan.
function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const r = Math.min(255, Math.max(0, (num >> 16) + amt));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00ff) + amt));
  const b = Math.min(255, Math.max(0, (num & 0x0000ff) + amt));
  return `#${(0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1)}`;
}

// FITUR BARU: Card Rush sekarang ikut punya konsep "14 Tema" seperti Word Search & Mystery

function BukaKotakGame({ onBack, theme, setTheme, teacher }) {
  const t = THEMES[theme];
  const cloudSave = useCloudSaveStatus();
  const [stage, setStage] = useState("setup"); // 'setup' | 'play'
  const [selectedMateri, setSelectedMateri] = useState("Aisatsu"); // FIX: default dulu selalu ke tema 3 "Gakkou no Seikatsu" — diubah jadi tema 1 sesuai permintaan guru, berlaku sama di ketiga game
  const [dataByMateri, setDataByMateri] = useState(initialBoxDataByMateri);
  const [loaded, setLoaded] = useState(false);
  const [storageWarning, setStorageWarning] = useState(null); // pesan kalau localStorage gagal menyimpan
  const [importMsg, setImportMsg] = useState(null); // { ok, text } hasil ekspor/impor cadangan
  const [guideOpen, setGuideOpen] = useState(false);
  const [bulkAddOpen, setBulkAddOpen] = useState(false);
  // FITUR BARU: dulu "Daftar Perintah" selalu terbuka penuh — kalau kotaknya banyak (mis. 36),
  // guru harus scroll panjang tiap kali cuma mau lihat/edit bagian "Pilih Tema" atau "Kejutan
  // Kotak Spesial" di atas/bawahnya. Beda dengan Word Search/Card Rush yang listnya sudah bisa
  // dilipat per-babak — Mystery Box tidak punya konsep "babak", jadi disediakan SATU tombol
  // lipat/buka untuk seluruh daftar sekaligus (bukan per-baris), defaultnya tetap terbuka biar
  // tidak mengejutkan guru yang baru pertama buka halaman ini.
  const [perintahListOpen, setPerintahListOpen] = useState(true);
  const [opened, setOpened] = useState({}); // id -> true
  const [activeBox, setActiveBox] = useState(null); // instruction object or null
  // BUGFIX: dulu tombol "← Persiapan" langsung pindah stage tanpa peringatan apa pun selagi
  // permainan berjalan — beda dengan Word Search (BackConfirmModal) & Card Rush ("Akhiri
  // Permainan" pakai window.confirm). Risikonya: progres OTOMATIS tersimpan (lihat efek
  // "bk-progress" di bawah), TAPI kalau guru balik ke Persiapan lalu klik "Mulai Permainan"
  // lagi, papan diacak ulang & semua kotak yang sudah dibuka ikut ter-reset (lihat startGame()).
  // showBackConfirm dipakai untuk menampilkan peringatan itu dulu sebelum benar-benar pindah.
  const [showBackConfirm, setShowBackConfirm] = useState(false);
  // FITUR BARU (elemen "Mystery"): sekitar 15% kotak ditandai "spesial" secara ACAK setiap kali
  // "Mulai Permainan" diklik (bukan ditetapkan tetap dari setup) — disimpan sebagai Set berisi id
  // kotak. Ditaruh terpisah dari `opened`/`activeBox` supaya urutan buka kotak siswa TIDAK
  // membocorkan yang mana spesial (kotak spesial terlihat identik dengan kotak biasa sebelum
  // dibuka), dan supaya papan yang sama bisa dapat kejutan di posisi berbeda tiap sesi.
  const [mysteryBoxIds, setMysteryBoxIds] = useState(() => new Set());
  // FITUR BARU: kejutan kotak spesial & frekuensinya sekarang bisa diatur guru sendiri di layar
  // Persiapan (dulu tetap: pesan dari MYSTERY_BOX_SURPRISES, 15% kotak). Disimpan terpisah dari
  // dataByMateri karena ini preferensi guru yang berlaku untuk SEMUA tema, bukan per-tema.
  const [surprises, setSurprises] = useState(MYSTERY_BOX_SURPRISES);
  const [mysteryChance, setMysteryChance] = useState(0.15);
  const [previewSurprise, setPreviewSurprise] = useState(null); // teks kejutan yang lagi di-preview di layar Persiapan, atau null
  const [confetti, setConfetti] = useState(null);
  const confettiTimerRef = useRef(null);
  useEffect(() => () => { if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current); }, []);
  // BUGFIX: `items` (dipakai persis di bawah ini, di dependency array useEffect konfeti) dulu
  // baru dideklarasikan JAUH di bawah — mengevaluasi `items.length` di sini, SEBELUM baris
  // `const items = ...`-nya sendiri sempat dijalankan, melanggar temporal dead zone JavaScript.
  // Ini bukan cuma peringatan: benar-benar melempar "ReferenceError: Cannot access 'items'
  // before initialization" setiap kali fungsi ini dijalankan — makanya Game 2 langsung blank
  // total, tanpa terkecuali. Dipindah ke sini (sebelum dipakai) supaya urutannya benar.
  const items = dataByMateri[selectedMateri] || [];
  // FITUR BARU: dulu urutan kotak saat main SELALU persis sama dengan urutan di Persiapan —
  // gampang ditebak siswa yang sudah pernah lihat urutannya (mis. tahu kotak nomor 5 selalu
  // perintah yang sama). playOrder menyimpan urutan ACAK khusus untuk sesi bermain kali ini,
  // dibuat ulang tiap kali "Mulai Permainan"/"Reset Papan" diklik — `items` sendiri (urutan asli
  // di Persiapan) tidak pernah diubah, cuma dipakai sebagai sumber untuk diacak.
  const [playOrder, setPlayOrder] = useState([]);
  function shuffleForPlay() {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    setPlayOrder(copy);
  }
  // FITUR BARU: dulu tidak ada perayaan sama sekali begitu SEMUA kotak sudah dibuka — cuma progress
  // bar diam di 100%. celebratedRef mencegah confetti ini meledak berkali-kali tiap re-render
  // selama masih di kondisi 100% (cuma sekali per sesi papan ini) — direset lagi begitu papan
  // dimulai ulang lewat resetBoard()/startGame().
  const celebratedRef = useRef(false);
  useEffect(() => {
    const openedCount = Object.keys(opened).length;
    if (items.length > 0 && openedCount === items.length && !celebratedRef.current) {
      celebratedRef.current = true;
      setConfetti(makeConfettiBurst("#F2879E"));
      if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current);
      confettiTimerRef.current = setTimeout(() => setConfetti(null), 1600);
    }
  }, [opened, items.length]);

  useEffect(() => {
    let localSavedAt = 0;
    try {
      const raw = localStorage.getItem(migrateLegacyKey("bk-setup-data", teacher.uid));
      if (raw) {
        const parsed = JSON.parse(raw);
        // FIX (bug): lihat catatan panjang di Word Search — field `theme` di blob ini sisa dari
        // sebelum tema disatukan jadi satu state global, dan kalau masih dipakai (setTheme(parsed.theme))
        // bisa menimpa balik tema global dengan nilai basi. Diabaikan sepenuhnya sekarang.
        if (parsed.dataByMateri) setDataByMateri(parsed.dataByMateri);
        if (parsed.selectedMateri) setSelectedMateri(parsed.selectedMateri);
        if (Array.isArray(parsed.surprises) && parsed.surprises.length > 0) setSurprises(parsed.surprises);
        if (typeof parsed.mysteryChance === "number") setMysteryChance(parsed.mysteryChance);
        localSavedAt = parsed.savedAt || 0;
      }
    } catch (e) { /* belum ada data tersimpan, atau data korup */ }
    try {
      const rawP = localStorage.getItem(migrateLegacyKey("bk-progress", teacher.uid));
      if (rawP) {
        const p = JSON.parse(rawP);
        if (p.stage) setStage(p.stage);
        if (p.opened) setOpened(p.opened);
        // BUGFIX (refresh di tengah permainan mengacak ulang tampilan & menghapus kotak spesial):
        // dulu cuma {stage, opened} yang disimpan/dipulihkan — playOrder (urutan kotak yang sudah
        // diacak lewat shuffleForPlay() saat "Mulai Permainan") dan mysteryBoxIds (~15% kotak yang
        // ditandai "kejutan" lewat pickMysteryBoxes()) TIDAK ikut tersimpan sama sekali. Progres
        // "kotak mana yang sudah dibuka" memang tetap aman, tapi begitu halaman di-refresh di
        // tengah sesi (mis. laptop guru ke-refresh tidak sengaja saat kelas berlangsung),
        // playOrder & mysteryBoxIds balik ke kosong: urutan kotak yang belum dibuka mendadak
        // berubah total di layar (jatuh ke urutan asli Persiapan, lihat fallback di render papan),
        // DAN kotak yang sudah/akan jadi kejutan diam-diam kehilangan status spesialnya tanpa
        // pesan apa pun. Sekarang keduanya ikut disimpan (lihat efek penyimpan progres di bawah)
        // & dipulihkan di sini — playOrder disimpan sebagai array ITEM UTUH (bukan cuma id) sama
        // seperti pola saveCardsProgress() di Card Rush, supaya tidak perlu mencocokkan ulang ke
        // `items`/dataByMateri yang state-nya baru terisi belakangan (di luar urutan effect ini).
        if (Array.isArray(p.playOrder) && p.playOrder.length > 0) setPlayOrder(p.playOrder);
        if (Array.isArray(p.mysteryBoxIds)) setMysteryBoxIds(new Set(p.mysteryBoxIds));
      }
    } catch (e) { /* belum ada progres tersimpan, atau data korup */ }
    setLoaded(true);
    // FITUR BARU: sama seperti Word Search — pulihkan dari cadangan cloud kalau lebih baru
    // daripada localStorage (atau localStorage-nya kosong sama sekali).
    loadSetupFromCloud(teacher.uid, "mysteryBox").then((cloud) => {
      if (!cloud) return;
      if ((cloud.savedAt || 0) > localSavedAt) {
        if (cloud.dataByMateri) setDataByMateri(cloud.dataByMateri);
        if (cloud.selectedMateri) setSelectedMateri(cloud.selectedMateri);
        if (Array.isArray(cloud.surprises) && cloud.surprises.length > 0) setSurprises(cloud.surprises);
        if (typeof cloud.mysteryChance === "number") setMysteryChance(cloud.mysteryChance);
        setImportMsg({ ok: true, text: "Perintah dipulihkan dari cadangan cloud (localStorage browser ini kosong/lebih basi)." });
      }
    });
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const payload = { dataByMateri, selectedMateri, surprises, mysteryChance };
      const res = safeSetItem(scopedKey("bk-setup-data", teacher.uid), JSON.stringify({ ...payload, savedAt: Date.now() }));
      setStorageWarning(res.ok ? null : res.message);
      cloudSave.track(saveSetupToCloud(teacher.uid, "mysteryBox", payload));
    }, 500);
    return () => clearTimeout(tm);
  }, [dataByMateri, selectedMateri, surprises, mysteryChance, loaded]);
  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const res = safeSetItem(scopedKey("bk-progress", teacher.uid), JSON.stringify({ stage, opened, playOrder, mysteryBoxIds: Array.from(mysteryBoxIds) }));
      setStorageWarning(res.ok ? null : res.message);
    }, 500);
    return () => clearTimeout(tm);
  }, [stage, opened, playOrder, mysteryBoxIds, loaded]);

  function endGame() {
    if (!window.confirm("Akhiri permainan ini? Progres kotak yang sudah dibuka akan dihapus.")) return;
    try { localStorage.removeItem(scopedKey("bk-progress", teacher.uid)); } catch (e) {}
    setOpened({}); setActiveBox(null); setStage("setup");
  }

  const canStart = items.some((it) => it.text.trim());

  function updateItem(id, value) {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: (prev[selectedMateri] || []).map((it) => it.id === id ? { ...it, text: value } : it) }));
  }
  function removeItem(id) {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: (prev[selectedMateri] || []).filter((it) => it.id !== id) }));
  }
  function addItem() {
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: [...(prev[selectedMateri] || []), { id: uid(), text: "" }] }));
  }
  // FITUR BARU: tambah banyak perintah sekaligus, satu perintah per baris — tidak perlu format
  // khusus karena tiap baris memang cuma satu kalimat perintah utuh.
  function addItemsBulk(text) {
    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return 0;
    setDataByMateri((prev) => ({ ...prev, [selectedMateri]: [...(prev[selectedMateri] || []), ...lines.map((line) => ({ id: uid(), text: line }))] }));
    return lines.length;
  }
  // Dipakai bareng oleh startGame() & resetBoard() — supaya logika "pilih sebagian kotak jadi
  // spesial" tidak diketik ulang dua kali. Persentasenya sekarang dari mysteryChance (bisa
  // diatur guru), bukan angka 0.15 tetap lagi.
  function pickMysteryBoxes(list) {
    const specialCount = list.length >= 3 && mysteryChance > 0 ? Math.max(1, Math.round(list.length * mysteryChance)) : 0;
    const shuffled = [...list].sort(() => Math.random() - 0.5);
    return new Set(shuffled.slice(0, specialCount).map((it) => it.id));
  }
  function startGame() {
    setOpened({}); setActiveBox(null);
    setMysteryBoxIds(pickMysteryBoxes(items));
    shuffleForPlay();
    celebratedRef.current = false;
    setStage("play");
  }
  function openBox(item) {
    setOpened((o) => ({ ...o, [item.id]: true }));
    if (mysteryBoxIds.has(item.id)) {
      const filled = surprises.filter((s) => s.trim());
      const pool = filled.length > 0 ? filled : MYSTERY_BOX_SURPRISES;
      const surprise = pool[Math.floor(Math.random() * pool.length)];
      setActiveBox({ id: item.id, text: surprise, mystery: true });
      setConfetti(makeConfettiBurst("#F4B740"));
      playCorrectSound();
      if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current);
      confettiTimerRef.current = setTimeout(() => setConfetti(null), 1300);
    } else {
      setActiveBox(item);
      playPopSound();
    }
  }
  function resetBoard() {
    setOpened({}); setActiveBox(null);
    // Sama seperti startGame() — acak ulang posisi kotak spesial DAN urutan kotaknya biar tiap
    // main ulang dapat susunan yang beda, bukan selalu di kotak & urutan yang sama.
    setMysteryBoxIds(pickMysteryBoxes(items));
    shuffleForPlay();
    celebratedRef.current = false;
  }

  /* ---- Kelola kejutan kotak spesial ---- */
  function updateSurprise(idx, value) {
    setSurprises((prev) => prev.map((s, i) => (i === idx ? value : s)));
  }
  function removeSurprise(idx) {
    setSurprises((prev) => (prev.length <= 1 ? prev : prev.filter((_, i) => i !== idx)));
  }
  function addSurprise() {
    setSurprises((prev) => [...prev, ""]);
  }
  function resetSurprisesToDefault() {
    if (!window.confirm("Kembalikan daftar kejutan ke bawaan? Kejutan custom yang sudah kamu tulis akan diganti.")) return;
    setSurprises(MYSTERY_BOX_SURPRISES);
  }
  // Coba acak: simulasikan siswa membuka kotak spesial, tanpa harus mulai permainan sungguhan.
  function previewRandomSurprise() {
    const filled = surprises.filter((s) => s.trim());
    const pool = filled.length > 0 ? filled : MYSTERY_BOX_SURPRISES;
    setPreviewSurprise(pool[Math.floor(Math.random() * pool.length)]);
  }

  /* ---- Cadangan perintah: ekspor ke file .json & impor kembali ---- */
  const { exportBackup, importBackup } = makeBackupHandlers({
    appId: "buka-kotak", appLabel: "Buka Kotak",
    buildPayload: (scope) => scope === "current"
      ? { selectedMateri, dataByMateri: { [selectedMateri]: dataByMateri[selectedMateri] } }
      : { selectedMateri, dataByMateri },
    applyPayload: (data) => {
      if (!data.dataByMateri) throw new Error("File ini bukan cadangan Buka Kotak.");
      const materiCount = Object.keys(data.dataByMateri).length;
      if (!window.confirm(`Muat cadangan ini? ${materiCount} materi di cadangan akan MENIMPA materi dengan nama sama yang ada sekarang. Materi lain tetap aman.`)) return;
      setDataByMateri((prev) => ({ ...prev, ...data.dataByMateri }));
      if (data.selectedMateri) setSelectedMateri(data.selectedMateri);
      setImportMsg({ ok: true, text: `Cadangan dimuat — ${materiCount} materi diperbarui.` });
    },
    setImportMsg,
  });
  const materiSlug = (selectedMateri || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

  if (stage === "setup") {
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
        <style>{fontImport}</style>
        <JapaneseBackdrop theme={theme} />
        {/* Konten dibungkus 1 wrapper ber-zIndex:1 di sini — persis pola yang sudah benar di
            Word Search & layar "Pilih Game" — supaya backdrop (position:fixed, zIndex:0) tidak
            malah menutupi panel-panel di bawahnya lewat urutan stacking CSS baku. */}
        <div style={{ position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 28, fontWeight: 700 }}>Persiapan — Mystery Box</div>
            <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Susun daftar perintah sebelum dimainkan. Individu, tanpa waktu, tanpa skor.</div>
            <div style={{ marginTop: 6 }}><CloudSaveBadge t={t} status={cloudSave.status} savedAt={cloudSave.savedAt} /></div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setGuideOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>
              <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📖</span> Panduan
            </button>
            <BackupExportButton t={t} currentLabel={selectedMateri}
              onExportCurrent={() => exportBackup("current", materiSlug)} onExportAll={() => exportBackup("all", "semua-materi")} />
            <label title="Muat cadangan dari file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>
              <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📂</span> Muat Cadangan
              <input type="file" accept="application/json,.json" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
            </label>
            <button onClick={onBack} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>← Pilih Game</button>
            <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
          </div>
        </div>

        <PageGuideModal open={guideOpen} onClose={() => setGuideOpen(false)} t={t} accent="#D98A2B"
          title="Panduan — Mystery Box" subtitle="Cara menyusun materi & cara game ini dimainkan"
          steps={[
            { icon: "📚", t: "Pilih Tema", d: "Pilih salah satu dari 14 tema (Kelas XI/XII), atau klik \"+ Tambah Tema\" untuk membuat tema sendiri." },
            { icon: "✏️", t: "Susun Daftar Perintah", d: "Isi teks perintah/pertanyaan untuk tiap nomor kotak. Bisa juga pakai \"Tambah Banyak Sekaligus\" untuk mengisi banyak baris sekaligus dari teks yang ditempel." },
            { icon: "🎁", t: "Kejutan Kotak Spesial", d: "Sebagian kotak bisa diisi \"kejutan\" acak (bonus/tantangan singkat) alih-alih perintah biasa — atur di bagian \"Kejutan Kotak Spesial\" sebelum mulai." },
            { icon: "▶️", t: "Mulai Permainan", d: "Setelah minimal 1 perintah terisi, klik \"Mulai Permainan\". Berbeda dari Word Search & Card Rush: game ini dimainkan langsung di SATU layar (biasanya diproyeksikan) — siswa tidak perlu scan QR atau join room sendiri." },
            { icon: "🙋", t: "Cara Bermain", d: "Siswa/kelompok maju bergiliran memilih satu nomor kotak yang belum dibuka. Guru klik nomornya untuk membuka & membacakan perintah/pertanyaan di dalamnya — permainan ini individu per giliran, tanpa papan skor dan tanpa batas waktu." },
          ]} />
        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 16, padding: "18px 20px", marginBottom: 20, boxShadow: t.shadowSm }}>

        </div>

        <div style={{ border: `1.5px solid ${perintahListOpen ? "#F4B740" : t.border}`, borderRadius: 14, overflow: "hidden", background: t.panel, transition: "border-color .2s ease", boxShadow: perintahListOpen ? "0 2px 12px rgba(244,183,64,0.15)" : t.shadowSm, marginBottom: 20 }}>
          <button onClick={() => setPerintahListOpen((o) => !o)} className="babak-acc-header"

        <div style={{ background: t.panel, borderRadius: 14, padding: 16, marginBottom: 20, boxShadow: t.shadowSm }}>

          <div style={{ fontSize: 14, color: t.dim, marginBottom: 14 }}>Sebagian kotak (diacak tiap main) berisi kejutan alih-alih perintah — kamu yang tentukan isinya.</div>

            </div>
          </div>

          {mysteryChance > 0 && (
            <div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>

                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {surprises.map((s, i) => (
                  <div key={i} className="list-row" style={{ display: "flex", gap: 8, alignItems: "center", background: t.panel2, borderRadius: 10, padding: "8px 10px" }}>
                    <span style={{ fontSize: 15 }}>🎁</span>
                    <input value={s} onChange={(e) => updateSurprise(i, e.target.value)} placeholder="Tulis pesan kejutan…"

                    <button onClick={() => removeSurprise(i)} disabled={surprises.length <= 1} title="Hapus kejutan ini" className="row-del" style={{ background: "transparent", border: "none", color: surprises.length <= 1 ? t.panel2 : t.faint, cursor: surprises.length <= 1 ? "default" : "pointer", padding: 8, borderRadius: 8 }}><span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>🗑</span></button>
                  </div>
                ))}
              </div>
              <button onClick={addSurprise} style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6, background: t.panel2, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 14 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>➕</span> Tambah Kejutan</button>
            </div>
          )}
        </div>

        {previewSurprise && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60 }} onClick={() => setPreviewSurprise(null)}>
            <div onClick={(e) => e.stopPropagation()} className="modal-pop" style={{ width: "min(520px, 90vw)", background: "linear-gradient(135deg,#F4B740,#F2A93B)", borderRadius: 20, padding: "36px 30px", boxShadow: "0 20px 60px rgba(0,0,0,.4)", position: "relative" }}>
              <button onClick={() => setPreviewSurprise(null)} style={{ position: "absolute", top: 12, right: 14, background: "none", border: "none", color: "#101B34", cursor: "pointer" }}><span style={{ fontSize: 20, lineHeight: 1, color: 'inherit' }}>✕</span></button>
              <div className="sgt" style={{ fontSize: 14, fontWeight: 700, color: "#101B34", textAlign: "center", marginBottom: 4, letterSpacing: 0.5, textTransform: "uppercase", opacity: 0.75 }}>Pratinjau — begini tampilannya ke siswa</div>
              <div className="sgt" style={{ fontSize: 14, fontWeight: 700, color: "#101B34", textAlign: "center", marginBottom: 10, letterSpacing: 0.5, textTransform: "uppercase" }}>🎁 Kotak Spesial!</div>
              <div className="sgt" style={{ fontSize: 20, fontWeight: 700, color: "#101B34", textAlign: "center", lineHeight: 1.5 }}>{previewSurprise}</div>
              <button onClick={previewRandomSurprise} style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "center", margin: "18px auto 0", background: "rgba(16,27,52,.12)", border: "none", color: "#101B34", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 14, fontWeight: 700 }}><span style={{ fontSize: 14, lineHeight: 1, color: 'inherit' }}>🔀</span> Acak Lagi</button>
            </div>
          </div>
        )}

        <BulkAddModal
          open={bulkAddOpen}
          onClose={() => setBulkAddOpen(false)}
          onAdd={addItemsBulk}
          title="Tambah Banyak Perintah Sekaligus"
          formatHint="Satu perintah per baris — tidak perlu tanda pemisah, tiap baris langsung jadi satu kotak."
          placeholder={"Sebutkan 3 kosakata benda elektronik di kelas!\nBuat 1 kalimat tanya kepemilikan barang menggunakan kata tanya dare"}
        />

        <button onClick={startGame} disabled={!canStart} style={{ display: "flex", alignItems: "center", gap: 8, background: canStart ? "#F4B740" : t.panel2, color: canStart ? "#101B34" : t.faint, border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: canStart ? "pointer" : "default" }}>Mulai Permainan <span style={{ fontSize: 17, lineHeight: 1, color: 'inherit' }}>➡</span></button>
        {!canStart && <div style={{ marginTop: 8, fontSize: 14, color: t.faint }}>Isi minimal satu perintah untuk mulai.</div>}
        </div>
      </div>
    );
  }

  const openedCount = Object.keys(opened).length;

  return (
    <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box", position: "relative" }}>
      <style>{fontImport}</style>

      {activeBox && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }} onClick={() => setActiveBox(null)}>
          <div onClick={(e) => e.stopPropagation()} className="modal-pop" style={{
            width: "min(520px, 90vw)",
            // FITUR BARU: kotak perintah biasa dulu warna flat "#F2879E" polos — sekarang dibuat
            // gradien juga (senada dengan kotak spesial yang sudah bergradien) supaya kedua jenis
            // modal ini terasa satu keluarga desain, bukan satu bergradien satu polos.

            {/* FITUR BARU: lingkaran dekoratif transparan di pojok, sekadar biar modalnya tidak

            <div style={{ position: "absolute", bottom: -50, left: -30, width: 110, height: 110, borderRadius: "50%", background: "rgba(255,255,255,.1)" }} />
            <button onClick={() => setActiveBox(null)} style={{ position: "absolute", top: 12, right: 14, width: 28, height: 28, borderRadius: "50%", background: "rgba(16,27,52,.12)", border: "none", color: "#101B34", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1 }}><span style={{ fontSize: 16, lineHeight: 1, color: 'inherit' }}>✕</span></button>
            <div className="sgt" style={{ position: "relative", fontSize: 14, fontWeight: 700, color: "#101B34", textAlign: "center", marginBottom: activeBox.mystery ? 12 : 14, letterSpacing: 0.5, textTransform: "uppercase", opacity: 0.7 }}>{activeBox.mystery ? "🎁 Kotak Spesial!" : "📋 Perintah"}</div>
            <div className="sgt" style={{ position: "relative", fontSize: 20, fontWeight: 700, color: "#101B34", textAlign: "center", lineHeight: 1.5 }}>{activeBox.text}</div>
