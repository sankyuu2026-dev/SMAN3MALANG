            <span>Progres</span><span>{openedCount}/{items.length} kotak dibuka{items.length ? ` (${Math.round((openedCount / items.length) * 100)}%)` : ""}</span>
          </div>
          <div style={{ height: 10, borderRadius: 999, background: t.panel, overflow: "hidden", boxShadow: "inset 0 1px 3px rgba(0,0,0,.12)" }}>
            <div style={{ height: "100%", width: `${items.length ? (openedCount / items.length) * 100 : 0}%`, background: "linear-gradient(90deg, #F4B740, #F2879E)", borderRadius: 999, transition: "width .3s ease" }} />
          </div>
          {/* FITUR BARU: dulu tidak ada penanda khusus saat SEMUA kotak sudah dibuka — progres cuma
              diam di 100% tanpa ada yang menyambut. Sekarang muncul lencana ucapan selamat kecil
              begitu openedCount menyentuh total kotaknya. */}
          {items.length > 0 && openedCount === items.length && (
            <div style={{ marginTop: 10, textAlign: "center", background: "linear-gradient(90deg, #FFF3D6, #FDE4EC)", color: "#8A6412", borderRadius: 10, padding: "8px 14px", fontSize: 14, fontWeight: 700, animation: "celebrateBadge .4s ease both" }}>
              🎉 Semua kotak sudah dibuka!
            </div>
          )}
        </div>

        <div style={{ background: t.panel, borderRadius: 20, padding: 20, boxShadow: t.shadowSm }}>
          {/* FIX (UX): dulu pakai CSS Grid (gridTemplateColumns: repeat(auto-fill, ...)) — kalau
              jumlah kotak tidak pas habis dibagi jumlah kolom (mis. 36 kotak dengan 8 kolom
              menyisakan 4 kotak di baris terakhir), baris terakhir itu jatuhnya rata KIRI dengan
              ruang kosong lebar di kanan, karena Grid menempatkan sel di posisi kolom yang tetap
              walau tidak terisi penuh. Sekarang pakai Flexbox (flexWrap + justifyContent:center)
              — tiap baris, termasuk baris terakhir yang tidak penuh, otomatis dirapikan ke
              TENGAH sesuai jumlah kotak yang benar-benar ada di baris itu, bukan menyisakan
              celah kosong di salah satu sisi. */}
          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 12 }}>
            {(playOrder.length ? playOrder : items).map((it, i) => {
              const isOpen = opened[it.id];
              // Cuma dicek/dipakai untuk gaya SETELAH kotak dibuka — sebelum diklik, kotak spesial
              // tampil identik dengan kotak biasa (lihat catatan di deklarasi mysteryBoxIds), jadi
              // tidak membocorkan yang mana spesial sebelum waktunya.
              const wasMystery = isOpen && mysteryBoxIds.has(it.id);
              const baseColor = BOX_COLORS[i % BOX_COLORS.length];
              return (
                <button key={it.id} onClick={() => openBox(it)} className={`sgt${!isOpen ? " mbox-tile" : ""}`} style={{
                  // BUGFIX (ukuran kotak beda-beda): dulu flex: "1 1 84px" (flex-grow: 1) — tiap
                  // kotak meregang mengisi SISA ruang kosong di barisnya SENDIRI. Baris yang penuh
                  // (mis. 8 kotak) jadi lebih kecil, sedangkan baris terakhir yang tidak penuh
                  // (mis. cuma 4 kotak) meregang jauh lebih besar sampai mentok maxWidth. Diganti
                  // flex-grow: 0 (ukuran tetap, tidak meregang) — justifyContent:"center" di
                  // container tetap merapikan baris terakhir yang tidak penuh ke tengah, tapi
                  // ukuran tiap kotak sekarang konsisten di semua baris.
                  flex: "0 0 90px", width: 90, maxWidth: 90, aspectRatio: "1 / 1", borderRadius: 16, cursor: isOpen ? "default" : "pointer", border: "none",
                  // FITUR BARU: dulu warna kotak flat satu lapis — sekarang gradien miring dari
                  // warna aslinya ke versi sedikit lebih gelap (shadeColor), dipadukan dengan
                  // bayangan dua lapis (garis gelap solid di bawah untuk kesan "chunky button" +
                  // bayangan lembut menyebar) supaya kotak terasa lebih tebal/berbentuk, bukan
                  // stiker warna datar di atas kertas.
                  background: isOpen
                    ? (wasMystery ? "linear-gradient(160deg, #FFF3D6, #FBE3A6)" : t.panel2)
                    : `linear-gradient(160deg, ${shadeColor(baseColor, 12)}, ${shadeColor(baseColor, -14)})`,
                  color: isOpen ? (wasMystery ? "#8A6412" : t.faint) : "#101B34",
                  fontWeight: 800, fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center",
                  opacity: isOpen ? (wasMystery ? 1 : 0.5) : 1,
                  boxShadow: isOpen
                    ? (wasMystery ? "0 0 0 2px #F4B740, 0 4px 14px rgba(244,183,64,.35)" : "inset 0 0 0 1px rgba(0,0,0,.04)")
                    : `0 4px 0 ${shadeColor(baseColor, -28)}, 0 8px 18px rgba(28,32,51,.18)`,
                  textShadow: isOpen ? "none" : "0 1px 0 rgba(255,255,255,.35), 0 -1px 0 rgba(0,0,0,.12)",
                  transform: isOpen ? "scale(.94)" : "scale(1)", transition: "transform .15s ease, opacity .15s ease, box-shadow .15s ease",
                  animation: isOpen ? "boxPop .5s cubic-bezier(.3,1.5,.4,1) both" : "none",
                }}>{isOpen ? <span style={{ fontSize: 22, lineHeight: 1, color: 'inherit', position: "relative", zIndex: 1 }}>{wasMystery ? "🎁" : "✓"}</span> : <span style={{ position: "relative", zIndex: 1 }}>{i + 1}</span>}</button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===========================================================
   GAME 3 — COCOKKAN KARTU
   Kartu gambar dipasangkan dengan kata (romaji/hiragana). Tiap
   kelompok balapan di papannya sendiri-sendiri (isi pasangan
   SAMA, susunan acak beda per HP). Kelompok tercepat dapat
   poin terbanyak; babaknya bisa berapa pun, minimal 5
   pasangan per babak.
=========================================================== */
// FITUR BARU: tiap babak sekarang punya batas waktu sendiri (timeLimitSec, default 3 menit) —
// guru bisa atur di layar Persiapan, dipakai buat hitung mundur ronde saat "play" (lihat
// startRound() & CardsPlayArea) supaya guru bisa memaksa akhiri babak begitu waktu kelas habis.
function makeBabak(n) { return { id: uid(), label: `Babak ${n}`, pairs: [], timeLimitSec: 180 }; }

// FITUR BARU: pratinjau papan Card Rush di layar Persiapan — grid statis (tidak bisa diklik)
// yang menampilkan campuran acak kartu gambar & kata, meniru tampilan yang akan dilihat siswa
// nanti (lihat CardTile di CardsPlayArea). Didefinisikan di level atas (bukan di dalam
// CocokkanKartuGame) supaya tidak ikut kena masalah "komponen didefinisikan ulang tiap render
// induknya" seperti beberapa kasus sebelumnya (lihat renderGrid dkk. di Word Search) — di sini
// justru SEBALIKNYA yang diinginkan: acakan barunya sengaja muncul tiap komponen ini dipasang
// ulang (toggle pratinjau dimatikan lalu dinyalakan lagi), bukan tiap kali guru mengetik apa pun
// di tempat lain saat pratinjau ini terbuka.
function CardPreviewGrid({ pairs, t }) {
  const [deck] = useState(() => {
    const cards = pairs.flatMap((p) => [
      { key: p.id + "-img", kind: "image", content: p.image },
      { key: p.id + "-word", kind: "word", content: p.word },
    ]);
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    return cards;
  });
  const cols = Math.min(6, Math.max(3, Math.ceil(Math.sqrt(deck.length))));
  return (
    <div style={{ background: t.panel2, borderRadius: 14, padding: 16, marginBottom: 16 }}>
      <div style={{ fontSize: 14, color: t.faint, marginBottom: 10 }}>Contoh susunan acak — tiap kelompok siswa nanti dapat susunan berbeda-beda, ini cuma gambaran umumnya.</div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: 8, maxWidth: 480 }}>
        {deck.map((c) => (
          <div key={c.key} style={{
            aspectRatio: "1 / 1", borderRadius: 10, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center",
            background: "#FFFFFF", boxShadow: "0 2px 6px rgba(28,32,51,.12)", padding: c.kind === "word" ? 6 : 0, boxSizing: "border-box",
          }}>
            {c.kind === "image" ? (
              c.content ? <img src={c.content} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} /> : <span style={{ fontSize: 14, color: "#999" }}>?</span>
            ) : (
              <span className="sgt" style={{ fontSize: 14, fontWeight: 700, color: "#1E2233", textAlign: "center", wordBreak: "break-word", lineHeight: 1.2 }}>{c.content}</span>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function CocokkanKartuGame({ onBack, theme, setTheme, teacher }) {
  const isMobile = useIsMobile();
  const t = THEMES[theme];
  const cloudSave = useCloudSaveStatus();

  const [stage, setStage] = useState("setup"); // 'setup' | 'play'
  // FITUR BARU: babak sekarang disimpan PER TEMA (dataByMateri), bukan satu daftar datar lagi —
  // menyusul Word Search & Mystery Box supaya ketiga game konsisten punya "14 Tema". `babaks` &
  // `setBabaks` di bawah tetap dipertahankan sebagai alias tipis ke tema yang sedang dipilih,
  // supaya semua fungsi lain di komponen ini (addBabak, addPair, dst — total >10 tempat pakai
  // setBabaks) tidak perlu ditulis ulang satu-satu.
  const [selectedMateri, setSelectedMateri] = useState("Aisatsu"); // FIX: default dulu selalu ke tema 3 "Gakkou no Seikatsu" — diubah jadi tema 1 sesuai permintaan guru, berlaku sama di ketiga game
  const [dataByMateri, setDataByMateri] = useState(() => ensureCardMateri({}, "Gakkou no Seikatsu"));
  const babaks = dataByMateri[selectedMateri] || [makeBabak(1)];
  function setBabaks(updater) {
    setDataByMateri((prev) => {
      const current = prev[selectedMateri] || [makeBabak(1)];
      const next = typeof updater === "function" ? updater(current) : updater;
      return { ...prev, [selectedMateri]: next };
    });
  }
  const [babakIdx, setBabakIdx] = useState(0);
  const [babakPanelOpen, setBabakPanelOpen] = useState(true); // panel accordion babak yang sedang terbuka
  const [loaded, setLoaded] = useState(false);
  const [storageWarning, setStorageWarning] = useState(null); // pesan kalau localStorage gagal menyimpan
  const [importMsg, setImportMsg] = useState(null); // { ok, text } hasil ekspor/impor cadangan
  const [roomCode, setRoomCode] = useState(makeRoomCode());
  const [scores, setScores] = useState({}); // { [group]: total poin }
  const [uploadingImage, setUploadingImage] = useState({});
  const [imageUploadError, setImageUploadError] = useState({});
  const [qrOpen, setQrOpen] = useState(false);
  const [guideOpen, setGuideOpen] = useState(false);
  const [bulkAddOpen, setBulkAddOpen] = useState(false);
  const [showCardPreview, setShowCardPreview] = useState(false);
  const [joinedGroups, setJoinedGroups] = useState({});
  const [cardsRoundId, setCardsRoundId] = useState(null);
  const [finishers, setFinishers] = useState([]);
  // FITUR BARU (Langkah 3): progres langsung tiap kelompok SELAGI babak masih berjalan — bukan
  // cuma tahu siapa yang sudah SELESAI (finishers) seperti sebelumnya. Diisi oleh HP tiap siswa
  // sendiri-sendiri lewat field cardsProgress di dokumen room (lihat CardsPlayArea), guru cukup
  // dengar lewat onSnapshot yang sama seperti field lain di bawah ini.
  const [cardsProgress, setCardsProgress] = useState({});
  const [scored, setScored] = useState(false);
  const [publishing, setPublishing] = useState(false);
  // FITUR BARU: batas waktu per babak (lihat makeBabak/startRound) — cardsRoundEndsAt disimpan
  // di dokumen room (bukan state lokal) supaya panel guru DAN layar siswa (CardsPlayArea)
  // sama-sama melihat hitung mundur yang identik, bukan jam yang berjalan sendiri-sendiri di
  // tiap perangkat. nowTick cuma dipakai untuk memaksa komponen ini re-render tiap detik selama
  // babak berjalan (Date.now() sendiri bukan state, jadi tidak akan memicu render kalau tidak
  // "dipancing" seperti ini).
  const [cardsRoundEndsAt, setCardsRoundEndsAt] = useState(null);
  const [nowTick, setNowTick] = useState(Date.now());
  // FITUR BARU: koreksi skor manual — kadang guru perlu membetulkan skor (mis. kelompok curang,
  // salah pencet, atau ingin memberi bonus/pengurangan di luar hasil otomatis). Dulu skor MURNI
  // hasil applyScores() dan sama sekali tidak bisa diubah tangan.
  const [correctingScore, setCorrectingScore] = useState(false);
  function adjustScore(g, delta) {
    setScores((prev) => ({ ...prev, [g]: Math.max(0, (prev[g] || 0) + delta) }));
  }

  useEffect(() => {
    let localSavedAt = 0;
    let migrated = false;
    try {
      const raw = localStorage.getItem(migrateLegacyKey("cck-setup-data", teacher.uid));
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.dataByMateri) {
          setDataByMateri((prev) => ({ ...prev, ...parsed.dataByMateri }));
          if (parsed.selectedMateri) setSelectedMateri(parsed.selectedMateri);
        } else if (Array.isArray(parsed.babaks) && parsed.babaks.length > 0) {
          // MIGRASI: format lama (sebelum ada konsep Tema) cuma simpan satu daftar babak datar.
          // Supaya kartu yang sudah dibuat guru sebelumnya tidak hilang, dipindah jadi isi tema
          // default "Gakkou no Seikatsu" — bisa dipindah manual nanti kalau ternyata itu bukan tema
          // yang dimaksud aslinya (dulu memang tidak ada pengelompokan tema sama sekali).
          setDataByMateri((prev) => ({ ...prev, "Gakkou no Seikatsu": parsed.babaks }));
          setSelectedMateri("Gakkou no Seikatsu");
          migrated = true;
        }
        localSavedAt = parsed.savedAt || 0;
      }
    } catch (e) { /* belum ada data tersimpan, atau data korup — mulai dari kosong */ }
    setLoaded(true);
    cleanupStaleRooms();
    if (migrated) setImportMsg({ ok: true, text: "Kartu dari sebelum fitur Tema ditambahkan sudah dipindah otomatis ke tema \"Gakkou no Seikatsu\" — pindahkan manual kalau perlu." });
    // FITUR BARU: sama seperti Word Search — pulihkan dari cadangan cloud kalau lebih baru
    // daripada localStorage (atau localStorage-nya kosong sama sekali).
    loadCardRushSetupFromCloud(teacher.uid).then((cloud) => {
      if (!cloud) return;
      if ((cloud.savedAt || 0) > localSavedAt) {
        if (cloud.dataByMateri) {
          setDataByMateri((prev) => ({ ...prev, ...cloud.dataByMateri }));
          if (cloud.selectedMateri) setSelectedMateri(cloud.selectedMateri);
          setImportMsg({ ok: true, text: "Kartu dipulihkan dari cadangan cloud (localStorage browser ini kosong/lebih basi)." });
        } else if (Array.isArray(cloud.babaks) && cloud.babaks.length > 0) {
          setDataByMateri((prev) => ({ ...prev, "Gakkou no Seikatsu": cloud.babaks }));
          setSelectedMateri("Gakkou no Seikatsu");
          setImportMsg({ ok: true, text: "Kartu dipulihkan dari cadangan cloud lama (sebelum fitur Tema) ke tema \"Gakkou no Seikatsu\"." });
        }
      }
    });
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const tm = setTimeout(() => {
      const payload = { dataByMateri, selectedMateri };
      const res = safeSetItem(scopedKey("cck-setup-data", teacher.uid), JSON.stringify({ ...payload, savedAt: Date.now() }));
      setStorageWarning(res.ok ? null : res.message);
      cloudSave.track(saveCardRushSetupToCloud(teacher.uid, payload));
    }, 500);
    return () => clearTimeout(tm);
  }, [dataByMateri, selectedMateri, loaded]);

  const babak = babaks[babakIdx] || babaks[0];

  function addBabak() {
    const newIdx = babaks.length;
    setBabaks((prev) => [...prev, makeBabak(prev.length + 1)]);
    setBabakIdx(newIdx);
    setBabakPanelOpen(true);
  }
  function removeBabak(idx) {
    if (babaks.length <= 1) return;
    if (!window.confirm("Hapus babak ini beserta semua pasangan kartunya?")) return;
    // FIX: dulu setelah menghapus babak, sisa babak lain tetap pakai label lamanya (mis. hapus
    // Babak 2 dari [Babak 1, Babak 2, Babak 3] hasilnya [Babak 1, Babak 3] — meloncat, bukan
    // [Babak 1, Babak 2]). Sekarang label seluruh babak yang tersisa dinomori ulang berurutan
    // sesuai posisi barunya.
    setBabaks((prev) => prev.filter((_, i) => i !== idx).map((b, i) => ({ ...b, label: `Babak ${i + 1}` })));
    setBabakIdx((i) => Math.max(0, Math.min(i, babaks.length - 2)));
  }
  // FITUR BARU: batas waktu babak ini (detik) — dipakai startRound() untuk menghitung
  // cardsRoundEndsAt. Dibatasi 30 detik–20 menit supaya tidak sengaja ter-set jadi 0/negatif
  // (babak langsung "habis waktu" begitu dimulai) atau kelewat panjang tanpa sadar.
  function setBabakTimeLimit(idx, sec) {
    const clamped = Math.max(30, Math.min(1200, sec));
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, timeLimitSec: clamped } : b));
  }
  function addPair(idx) {
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: [...b.pairs, { id: uid(), word: "", image: null }] } : b));
  }
  // FITUR BARU: tambah banyak kata sekaligus, satu kata per baris. Cuma isi teksnya — gambar
  // TIDAK bisa ikut ditempel lewat cara ini (harus diunggah manual per kartu satu-satu lewat
  // tombol unggah gambar seperti biasa), jadi kartu-kartu baru ini akan muncul dulu tanpa gambar.
  function addPairsBulk(idx, text) {
    const words = text.split("\n").map((l) => l.trim()).filter(Boolean).map((w) => w.toUpperCase());
    if (words.length === 0) return 0;
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: [...b.pairs, ...words.map((word) => ({ id: uid(), word, image: null }))] } : b));
    return words.length;
  }
  function removePair(idx, pairId) {
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.filter((p) => p.id !== pairId) } : b));
  }
  function updatePairWord(idx, pairId, value) {
    const finalValue = value.toUpperCase(); // konsisten dgn gaya kata Game 1; aman utk hiragana
    setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.map((p) => p.id === pairId ? { ...p, word: finalValue } : p) } : b));
  }
  function uploadImage(idx, pairId, file) {
    if (!file) return;
    setImageUploadError((e) => { const n = { ...e }; delete n[pairId]; return n; });
    setUploadingImage((u) => ({ ...u, [pairId]: true }));
    compressImageFile(file)
      .then((dataUrl) => {
        // Base64 kira-kira 4/3 kali lebih besar dari data biner aslinya — dihitung dari panjang
        // string data URL-nya (bukan file.size asli, karena itu sudah bukan ukuran final setelah
        // dikompres). Ambang 250KB dipertahankan sebagai jaga-jaga terakhir; dalam praktiknya nyaris
        // selalu lolos jauh di bawah itu berkat compressImageFile() di atas.
        const approxBytes = Math.round((dataUrl.length * 3) / 4);
        if (approxBytes > 250 * 1024) {
          setImageUploadError((e) => ({ ...e, [pairId]: "Gambar masih terlalu besar walau sudah dikompres otomatis — coba foto lain." }));
          return;
        }
        setBabaks((prev) => prev.map((b, i) => i === idx ? { ...b, pairs: b.pairs.map((p) => p.id === pairId ? { ...p, image: dataUrl } : p) } : b));
      })
      .catch(() => setImageUploadError((e) => ({ ...e, [pairId]: "Gagal memproses gambar, coba lagi." })))
      .finally(() => setUploadingImage((u) => { const n = { ...u }; delete n[pairId]; return n; }));
  }

  function validPairs(b) { return b.pairs.filter((p) => p.word.trim() && p.image); }
  const canStart = babaks.length > 0 && babaks.every((b) => validPairs(b).length >= 5);

  const [startingGame, setStartingGame] = useState(false);
  // FIX (UX): sama seperti Word Search — startSession() memanggil Firestore (cek kode room)
  // yang bisa terasa "diam saja" tanpa reaksi kalau koneksinya lambat. Tambah state loading
  // supaya tombol langsung kasih tanda begitu diklik.
  async function startSession() {
    if (startingGame) return;
    setStartingGame(true);
    try {
      // Sama seperti Word Search: pastikan roomCode belum dipakai kelas lain sebelum dipakai QR join.
      const uniqueCode = await ensureUniqueRoomCode(roomCode);
      if (uniqueCode !== roomCode) setRoomCode(uniqueCode);
      setScores({}); setBabakIdx(0); setStage("play");
    } finally {
      setStartingGame(false);
    }
  }

  useEffect(() => {
    if (stage !== "play") return;
    db.collection("rooms").doc(roomCode).set({
      mode: "cards", babakIdx, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true }).catch(() => {});
  }, [stage, roomCode, babakIdx]);

  useEffect(() => {
    if (stage !== "play") return;
    const ref = db.collection("rooms").doc(roomCode);
    const unsub = ref.onSnapshot((snap) => {
      const data = snap.data();
      if (!data) return;
      setJoinedGroups(data.groups || {});
      setCardsRoundId(data.cardsRoundId || null);
      setFinishers(Array.isArray(data.cardsFinishers) ? data.cardsFinishers : []);
      setCardsProgress(data.cardsProgress || {});
      setCardsRoundEndsAt(data.cardsRoundEndsAt || null);
    });
    return () => unsub();
  }, [stage, roomCode]);

  // Detak jam hitung mundur — cuma jalan selagi ada babak aktif & belum dinilai, supaya tidak
  // terus-menerus re-render tanpa alasan saat guru masih di layar Persiapan atau menunggu join.
  useEffect(() => {
    if (stage !== "play" || !cardsRoundId || !cardsRoundEndsAt || scored) return;
    const iv = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(iv);
  }, [stage, cardsRoundId, cardsRoundEndsAt, scored]);
  const remainingSec = cardsRoundEndsAt ? Math.max(0, Math.round((cardsRoundEndsAt - nowTick) / 1000)) : null;
  const timeUp = remainingSec === 0;

  // FITUR BARU (perubahan sistem skor atas permintaan guru): dulu juara-1 dapat `totalGroups`
  // poin, lalu tiap peringkat di bawahnya turun 1 poin (n, n-1, n-2, ...) dengan lantai minimal
  // 1 poin, dan kelompok yang belum sempat selesai tetap dapat 1 poin flat. Sekarang diganti:
  // - Juara 1 tetap dapat `totalGroups` poin (mis. 6 kelompok join → juara 1 dapat 6).
  // - Mulai juara 2 dan seterusnya turun 1 poin per peringkat (BUKAN patokan dari totalGroups
  //   lagi, tapi dari "totalGroups - 1" ke bawah), sampai juara paling akhir dapat PERSIS 0 —
  //   jadi selisih juara 1 ke juara 2 sengaja 2 poin (satu kali saja di paling atas), baru
  //   turun 1 poin rata tiap peringkat setelahnya. Contoh 6 kelompok: 6, 4, 3, 2, 1, 0.
  // - Kelompok yang sudah join tapi TIDAK sempat menyelesaikan babak ini sekarang dapat 0 poin
  //   (disamakan dengan finis paling akhir), bukan 1 poin flat seperti sebelumnya.
  function applyScores(finalFinishers) {
    const totalGroups = Object.keys(joinedGroups).length || finalFinishers.length;
    if (totalGroups === 0) { setScored(true); return; }
    setScores((prev) => {
      const next = { ...prev };
      finalFinishers.forEach((f, i) => {
        const points = i === 0 ? totalGroups : Math.max(totalGroups - 1 - i, 0);
        next[f.group] = (next[f.group] || 0) + points;
      });
      // Kelompok yang sudah join tapi belum menyelesaikan babak ini dapat 0 poin (tidak ada
      // penambahan sama sekali) — disamakan dengan finis paling akhir.
      return next;
    });
    setScored(true);
  }

  // Penilaian otomatis begitu SEMUA kelompok yang join sudah menyelesaikan babak ini.
  useEffect(() => {
    if (stage !== "play" || !cardsRoundId || scored) return;
    const totalGroups = Object.keys(joinedGroups).length;
    if (totalGroups > 0 && finishers.length >= totalGroups) applyScores(finishers);
  }, [finishers, joinedGroups, cardsRoundId, scored, stage]);

  async function startRound() {
    setPublishing(true);
    try {
      const col = db.collection("rooms").doc(roomCode).collection("cardPairs");
      const existing = await col.get();
      // FITUR BARU (perbaikan kinerja): dulu SEMUA dokumen kartu lama dihapus lalu SEMUA kartu
      // baru ditulis ulang dari nol tiap kali "Mulai Babak Ini" ditekan — padahal kalau guru
      // menekannya lagi untuk babak yang SAMA tanpa mengedit apa pun (mis. mengulang sesi ini
      // untuk rombongan kelas berikutnya di hari yang sama), isinya persis sama dengan yang
      // sudah ada di Firestore, jadi menghapus lalu mengunggah ulang semuanya cuma buang-buang
      // waktu & kuota. Sekarang dibandingkan dulu: dokumen lama yang datanya SAMA PERSIS (kata +
      // gambar) dibiarkan saja (tidak disentuh sama sekali), yang ditulis ulang cuma yang benar-
      // benar baru atau berubah, dan yang dihapus cuma yang sudah tidak dipakai lagi.
      const existingById = new Map(existing.docs.map((d) => [d.id, d.data()]));
      const nextPairs = validPairs(babak).map((p) => ({ id: p.id, word: p.word.trim(), image: p.image }));
      const nextIds = new Set(nextPairs.map((p) => p.id));
      const batch = db.batch();
      let changedCount = 0;
      existing.docs.forEach((d) => { if (!nextIds.has(d.id)) { batch.delete(d.ref); changedCount++; } });
      nextPairs.forEach((p) => {
        const old = existingById.get(p.id);
        if (old && old.word === p.word && old.image === p.image) return; // identik — tidak perlu ditulis ulang
        batch.set(col.doc(p.id), { word: p.word, image: p.image });
        changedCount++;
      });
      if (changedCount > 0) await batch.commit();
      const newRoundId = uid();
      // FITUR BARU: batas waktu babak ini (timeLimitSec, diatur guru di layar Bermain sesaat
      // sebelum babak dimulai — lihat kontrol "Waktu babak" di sebelah tombol ini) diubah jadi
      // TIMESTAMP absolut (bukan cuma "180 detik" yang disimpan mentah) supaya panel guru dan
      // layar tiap siswa menghitung mundur ke titik akhir yang PERSIS SAMA, tidak peduli kapan
      // masing-masing perangkat memuat/membaca datanya.
      const roundEndsAt = Date.now() + (babak.timeLimitSec || 180) * 1000;
      await db.collection("rooms").doc(roomCode).set({ cardsRoundId: newRoundId, cardsFinishers: [], cardsProgress: {}, cardsRoundEndsAt: roundEndsAt }, { merge: true });
      setScored(false);
    } catch (e) {
      alert("Gagal memulai babak, coba lagi.");
    } finally {
      setPublishing(false);
    }
  }

  function endRoundNow() {
    if (scored) return;
    // FITUR BARU: kalau waktu babak memang sudah habis, tidak perlu tanya konfirmasi lagi —
    // itulah justru fungsi tombol ini (paksa akhiri babak begitu waktu kelas habis).
    // BUGFIX: teks ini dulu bilang "tetap dapat 1 poin" — sisa dari sistem skor LAMA sebelum
    // diubah (lihat catatan di applyScores) jadi kelompok yang belum selesai sekarang dapat 0 poin,
    // bukan 1. Teksnya ketinggalan tidak ikut diperbarui saat sistem skornya diubah, jadi guru bisa
    // salah kira kelompok itu masih dapat sesuatu.
    if (!timeUp && finishers.length < Object.keys(joinedGroups).length) {
      if (!window.confirm("Masih ada kelompok yang belum selesai. Akhiri babak sekarang? Kelompok yang belum selesai dapat 0 poin.")) return;
    }
    applyScores(finishers);
  }

  function nextBabak() {
    if (babakIdx >= babaks.length - 1) return;
    const nextIdx = babakIdx + 1;
    setBabakIdx(nextIdx);
    db.collection("rooms").doc(roomCode).set({ babakIdx: nextIdx, cardsRoundId: null, cardsFinishers: [], cardsProgress: {}, cardsRoundEndsAt: null }, { merge: true }).catch(() => {});
    setFinishers([]); setCardsRoundId(null); setCardsRoundEndsAt(null); setScored(false);
  }

  function endGame() {
    if (!window.confirm("Akhiri permainan ini? Skor akan dihapus.")) return;
    // BUGFIX: dulu cuma db.collection("rooms").doc(roomCode).delete() — subcollection "cardPairs"
    // (gambar-gambar kartu babak terakhir) tidak ikut terhapus & jadi sampah permanen di Firestore.
    deleteRoomWithSubcollections(db.collection("rooms").doc(roomCode)).catch(() => {});
    setScores({}); setStage("setup"); setBabakIdx(0); setCardsRoundEndsAt(null); setCorrectingScore(false);
  }

  /* ---- Cadangan pasangan kartu: ekspor ke file .json & impor kembali ---- */
  const { exportBackup, importBackup } = makeBackupHandlers({
    appId: "card-rush", appLabel: "Card Rush",
    buildPayload: (scope) => scope === "all" ? { dataByMateri } : { dataByMateri: { [selectedMateri]: babaks }, selectedMateri },
    applyPayload: (data) => {
      // Terima juga file cadangan format lama (sebelum ada Tema): { babaks: [...] } tanpa dataByMateri.
      const incoming = data.dataByMateri
        ? data.dataByMateri
        : Array.isArray(data.babaks) ? { "Gakkou no Seikatsu": data.babaks } : null;
      if (!incoming) throw new Error("File ini bukan cadangan Card Rush.");
      const materiCount = Object.keys(incoming).length;
      if (!window.confirm(`Muat cadangan ini? ${materiCount} tema di cadangan akan MENIMPA tema dengan nama sama yang ada sekarang. Tema lain tetap aman.`)) return;
      setDataByMateri((prev) => ({ ...prev, ...incoming }));
      if (data.selectedMateri) setSelectedMateri(data.selectedMateri);
      setBabakIdx(0);
      setImportMsg({ ok: true, text: `Cadangan dimuat — ${materiCount} tema diperbarui.` });
    },
    setImportMsg,
  });
  const materiSlug = (selectedMateri || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

  const sortedGroups = [...GROUP_NAMES].sort((a, b) => (scores[b] || 0) - (scores[a] || 0));

  if (stage === "setup") {
    const fieldLabelStyle = { fontSize: 14, color: t.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 };
    return (
      <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
        <style>{fontImport}</style>
        <JapaneseBackdrop theme={theme} />
        {/* Konten dibungkus 1 wrapper ber-zIndex:1 di sini — persis pola yang sudah benar di
            Word Search & layar "Pilih Game" — supaya backdrop (position:fixed, zIndex:0) tidak
            malah menutupi panel-panel di bawahnya lewat urutan stacking CSS baku. */}
        <div style={{ position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 26, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div className="sgt page-title" style={{ fontSize: 28, fontWeight: 700 }}>Persiapan — Card Rush</div>
            {!isMobile && <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Kartu gambar dipasangkan dengan kata (romaji/hiragana). Minimal 5 pasang per babak.</div>}
            <div style={{ marginTop: 6 }}><CloudSaveBadge t={t} status={cloudSave.status} savedAt={cloudSave.savedAt} /></div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setGuideOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>
              <span style={{ fontSize: 15, lineHeight: 1, color: 'inherit' }}>📖</span> Panduan
            </button>
            <BackupExportButton t={t} currentLabel={selectedMateri}
              onExportCurrent={() => exportBackup("current", materiSlug)} onExportAll={() => exportBackup("all", "semua-tema")} />
            <label title="Muat cadangan dari file .json" style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>

            <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
          </div>
        </div>

        <PageGuideModal open={guideOpen} onClose={() => setGuideOpen(false)} t={t} accent="#C45B5B"
          title="Panduan — Card Rush" subtitle="Cara menyusun materi & cara game ini dimainkan"
          steps={[
            { icon: "📚", t: "Pilih Tema", d: "Pilih salah satu dari 14 tema (Kelas XI/XII), atau klik \"+ Tambah Tema\" untuk membuat tema sendiri." },
            { icon: "🃏", t: "Susun Babak & Pasangan Kartu", d: "Babak bisa ditambah/dihapus bebas, minimal 5 pasangan kartu per babak. Tiap pasangan berisi: kata (romaji/hiragana) + gambar yang diunggah. Bisa pakai \"Tambah Banyak Sekaligus\" untuk mengisi banyak kata teksnya sekaligus (gambar tetap perlu diunggah satu-satu)." },
            { icon: "⏱️", t: "Atur Batas Waktu Babak", d: "Tiap babak punya batas waktu sendiri (default 3 menit) — atur di layar Main sesaat sebelum menekan \"Mulai Babak Ini\"." },
            { icon: "▶️", t: "Mulai Permainan", d: "Setelah tiap babak minimal punya 5 pasangan lengkap, klik \"Mulai Permainan\" — kode Room dan QR untuk siswa join per kelompok otomatis dibuat." },
            { icon: "🙋", t: "Cara Bermain", d: "Kelompok scan QR lalu pilih nomor kelompoknya, lalu menunggu guru menekan \"Mulai Babak Ini\". Begitu dimulai, tiap kelompok balapan mencocokkan kartu gambar dengan kata yang tepat di papannya sendiri-sendiri (susunan acak beda tiap HP, isi pasangan sama). Progres tiap kelompok terlihat langsung di layar guru selagi berjalan." },
            { icon: "🏆", t: "Penilaian", d: "Kelompok yang selesai lebih dulu dapat poin lebih banyak (urutan selesai menentukan poin) — otomatis dihitung begitu semua kelompok selesai, atau saat waktu babak habis." },
          ]} />
        <StorageWarningBanner t={t} message={storageWarning} />
        <ImportMessageBanner t={t} msg={importMsg} onDismiss={() => setImportMsg(null)} />

        <div style={{ background: t.panel, borderRadius: 18, padding: "22px 24px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={1} faint={t.faint} hint={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontWeight: 700, color: "#D98A2B", background: "rgba(244,183,64,.16)", padding: "2px 9px", borderRadius: 999, fontSize: 14 }}>14 Tema</span>
              <span style={{ color: t.dim, fontSize: 14 }}>(sesuai Prota Bahasa Jepang kelas XI &amp; XII Fase F)</span>
            </span>
          }>Pilih Tema</SectionLabel>
          <MateriPicker t={t} selected={selectedMateri} teacher={teacher}
            onSelect={(name) => { setSelectedMateri(name); setDataByMateri((prev) => ensureCardMateri(prev, name)); setBabakIdx(0); setBabakPanelOpen(true); }} />
        </div>

        <div style={{ background: t.panel, borderRadius: 18, padding: "22px 24px", marginBottom: 20, boxShadow: t.shadowSm }}>
          <SectionLabel n={2} faint={t.faint} hint="— pasangan kartu & pratinjau papan">Kartu per Babak</SectionLabel>
          {/* FIX (UX, sama seperti Word Search): dulu babak berupa tab yang saling
              menggantikan konten di tempat yang sama, dan "Pratinjau Papan" selalu tampil penuh
              di bawahnya terus-menerus — kalau kartunya banyak halaman jadi sangat panjang.
              Sekarang tiap babak jadi panel accordion sendiri (ringkasan selalu kelihatan meski
              tertutup), dan pratinjau papannya ikut masuk ke DALAM panel babak yang sedang
              dibuka — otomatis ikut tersembunyi saat babaknya ditutup, tidak perlu tombol
              sembunyi terpisah. babakIdx dipakai sebagai "yang sedang terbuka", sama seperti
              dulu dipakai sebagai "tab aktif", jadi tidak perlu state baru untuk itu. */}
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {babaks.map((b, i) => {
              const isOpen = babakIdx === i && babakPanelOpen;
              const readyCount = validPairs(b).length;
              return (
                <div key={b.id} style={{ border: `1.5px solid ${isOpen ? "#F4B740" : t.border}`, borderRadius: 14, overflow: "hidden", background: t.panel2, transition: "border-color .2s ease", boxShadow: isOpen ? "0 2px 12px rgba(244,183,64,0.15)" : t.shadowSm }}>
                  <button
                    onClick={() => {
                      if (babakIdx === i && babakPanelOpen) setBabakPanelOpen(false);
                      else { setBabakIdx(i); setBabakPanelOpen(true); }
                    }}
                    className="babak-acc-header"
                    style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "16px 20px", background: "transparent", border: "none", cursor: "pointer", textAlign: "left" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                      <div style={{ width: 28, height: 28, borderRadius: "50%", background: isOpen ? "#F4B740" : t.panel, border: isOpen ? "none" : `1px solid ${t.border}`, color: isOpen ? "#101B34" : t.dim, fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</div>
                      <div style={{ minWidth: 0 }}>
                        <div className="sgt" style={{ fontWeight: 700, fontSize: 14, color: t.text }}>{b.label}</div>
                        <div style={{ fontSize: 14, color: readyCount >= 5 ? "#3FBFAD" : t.dim, marginTop: 1 }}>{readyCount} / {b.pairs.length} pasangan siap</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                      {babaks.length > 1 && (
                        <span onClick={(e) => { e.stopPropagation(); removeBabak(i); }} title="Hapus babak ini" style={{ width: 26, height: 26, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center", color: t.faint, cursor: "pointer", fontSize: 14 }}>🗑</span>
                      )}
                      <span style={{ width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: isOpen ? "#101B34" : t.dim, background: isOpen ? "#F4B740" : "transparent", transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .15s ease, background .15s ease" }}>▾</span>
                    </div>
                  </button>

                  {isOpen && (
                    <div className="babak-acc-body" style={{ padding: "0 16px 16px", borderTop: `1px solid ${t.border}` }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 10, flexWrap: "wrap", margin: "14px 0" }}>
                        {/* FITUR BARU: pratinjau papan — sebelumnya guru cuma lihat daftar
                            kata+gambar berbentuk baris, tidak ada gambaran seperti apa papan
                            ACAK-nya nanti dilihat siswa (gambar & kata tercampur satu grid).
                            Susunan acaknya sengaja baru tiap kali tombol ini diklik ulang (lihat
                            CardPreviewGrid) — cuma disable kalau pasangannya belum cukup
                            (minimal 5, sama seperti syarat mulai). */}
                        <button onClick={() => setShowCardPreview((s) => !s)} disabled={readyCount < 5} style={{ display: "flex", alignItems: "center", gap: 6, background: showCardPreview ? "#F4B740" : "transparent", color: showCardPreview ? "#101B34" : readyCount < 5 ? t.faint : t.dim, border: showCardPreview ? "none" : `1px solid ${t.border}`, borderRadius: 8, padding: "10px 14px", cursor: readyCount < 5 ? "default" : "pointer", fontSize: 14, fontWeight: showCardPreview ? 700 : 400, opacity: readyCount < 5 ? 0.5 : 1 }}>👁 {showCardPreview ? "Sembunyikan Pratinjau" : "Pratinjau Papan"}</button>
                        <button onClick={() => setBulkAddOpen(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: t.panel, border: `1.5px dashed ${t.accent || "#F4B740"}`, color: t.text, borderRadius: 10, padding: "10px 18px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}><span style={{ fontSize: 16, lineHeight: 1 }}>📋</span> Tambah Banyak Sekaligus</button>
                      </div>

                      {showCardPreview && <CardPreviewGrid pairs={validPairs(b)} t={t} />}

                      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                        {b.pairs.map((p, idx) => (
                          <div key={p.id} className="list-row" style={{ display: "flex", gap: 12, alignItems: "center", background: t.panel, borderRadius: 12, padding: "10px 14px", flexWrap: "wrap" }}>
                            <div style={{ width: 26, height: 26, borderRadius: "50%", background: t.panel2, color: t.faint, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{idx + 1}</div>
                            <label title={p.image ? "Klik untuk ganti gambar" : "Unggah gambar (otomatis dikompres, tidak perlu diperkecil dulu)"} style={{ width: 56, height: 56, borderRadius: 8, background: t.panel2, flexShrink: 0, cursor: "pointer", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
                              {uploadingImage[p.id] ? "⏳" : p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 15, color: t.dim }}>⬆</span>}
                              <input type="file" accept="image/*" disabled={uploadingImage[p.id]} onChange={(e) => uploadImage(i, p.id, e.target.files[0])} style={{ display: "none" }} />
                            </label>
                            <div style={{ display: "flex", flexDirection: "column", gap: 5, flex: 1, minWidth: 160 }}>
                              {!isMobile && <label style={fieldLabelStyle}>Kata (romaji/hiragana)</label>}
                              <input value={p.word} onChange={(e) => updatePairWord(i, p.id, e.target.value)} placeholder={isMobile ? "Kata (romaji/hiragana)" : "mis. ねこ"}
                                style={{ padding: "9px 10px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel2, color: t.text, fontSize: 14 }} />
                              {imageUploadError[p.id] && <div style={{ fontSize: 14, color: "#EF5B5B" }}>{imageUploadError[p.id]}</div>}
                            </div>
                            <button onClick={() => removePair(i, p.id)} title="Hapus pasangan ini" className="row-del" style={{ background: "transparent", border: "none", color: t.faint, cursor: "pointer", padding: 8, borderRadius: 8 }}>🗑</button>
                          </div>
                        ))}
                      </div>
                      <button onClick={() => addPair(i)} style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6, background: t.panel, border: "none", color: t.text, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontSize: 14 }}>➕ Tambah Pasangan</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <button onClick={addBabak} style={{ marginTop: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", background: "transparent", border: `1.5px dashed ${t.border}`, color: t.dim, borderRadius: 12, padding: "12px 0", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>➕ Tambah Babak</button>

          <BulkAddModal
            open={bulkAddOpen}
            onClose={() => setBulkAddOpen(false)}
            onAdd={(text) => addPairsBulk(babakIdx, text)}
            title={`Tambah Banyak Kata Sekaligus — ${babak.label}`}
            formatHint="Satu kata per baris — hanya teksnya yang ikut ditambahkan. Gambar tetap harus diunggah manual satu per satu untuk tiap kartu baru di bawah."
            placeholder={"GOMIBAKO\nKARENDAA"}
          />
        </div>

        <button onClick={startSession} disabled={!canStart || startingGame} style={{
          display: "flex", alignItems: "center", gap: 8, background: canStart ? "#F4B740" : t.panel2, color: canStart ? "#101B34" : t.faint,
          border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: canStart && !startingGame ? "pointer" : "default",
          opacity: startingGame ? 0.75 : 1,
        }}>
          {startingGame
            ? (<><span className="spin-icon" style={{ fontSize: 16, lineHeight: 1 }}>🔄</span> Memulai…</>)
            : (<>Mulai Permainan ➡</>)}
        </button>
        {!canStart && !isMobile && <div style={{ marginTop: 8, fontSize: 14, color: t.faint }}>Setiap babak butuh minimal 5 pasangan lengkap (kata + gambar) sebelum bisa dimulai.</div>}
        </div>
      </div>
    );
  }

  const totalGroups = Object.keys(joinedGroups).length;
  const totalPairsThisRound = validPairs(babak).length;

  return (
    <div className="app-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: t.bg, color: t.text, minHeight: "100vh", padding: 28, boxSizing: "border-box" }}>
      <style>{fontImport}</style>
      <QrJoinModal open={qrOpen} onClose={() => setQrOpen(false)} roomCode={roomCode} joinedCount={totalGroups} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16, marginBottom: 20 }}>
        <div>
          <div className="sgt page-title" style={{ fontSize: 26, fontWeight: 700 }}>Card Rush — {babak.label}</div>
          <div style={{ fontSize: 14, color: t.dim, marginTop: 2 }}>Kode Room: <b>{roomCode}</b> · {totalGroups} kelompok sudah join</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {/* FITUR BARU: hitung mundur babak berjalan — timestamp akhirnya (cardsRoundEndsAt)
              disimpan di dokumen room supaya guru & SEMUA siswa melihat angka yang sama persis
              (lihat startRound() & CardsPlayArea), bukan jam yang berjalan sendiri-sendiri di
              tiap perangkat. Berubah merah & berkedip begitu ≤10 detik atau sudah 0, supaya
              langsung kelihatan kapan saatnya menekan "Akhiri Babak Sekarang". */}
          {cardsRoundId && !scored && remainingSec !== null && (
            <div title="Sisa waktu babak ini" style={{
              display: "flex", alignItems: "center", gap: 8,
              background: timeUp ? "#EF5B5B" : remainingSec <= 10 ? "rgba(239,91,91,.14)" : t.panel,
              border: `1px solid ${(timeUp || remainingSec <= 10) ? "#EF5B5B" : t.border}`,
              boxShadow: t.shadowSm, color: timeUp ? "#fff" : remainingSec <= 10 ? "#EF5B5B" : t.text,
              padding: "10px 16px", borderRadius: 10, fontWeight: 700, fontSize: 15,
              animation: (timeUp || remainingSec <= 10) ? "timerPulse 1s ease-in-out infinite" : "none",
            }}>
              <span className="sgt" style={{ fontSize: 15, lineHeight: 1 }}>⏱</span> {timeUp ? "Waktu Habis!" : formatDuration(remainingSec)}
            </div>
          )}
          <button onClick={() => setQrOpen(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14 }}>🔗 QR Join</button>
          <button onClick={endGame} style={{ display: "flex", alignItems: "center", gap: 6, background: t.panel, border: "1px solid #EF5B5B", color: "#EF5B5B", padding: "10px 14px", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 700 }}>⏹ Akhiri Permainan</button>
          <ThemeToggleButton theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadowSm, color: t.text, padding: 10, borderRadius: 10, cursor: "pointer" }} />
        </div>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 20, alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 380px", background: t.panel, borderRadius: 16, padding: 20, boxSizing: "border-box", boxShadow: t.shadowSm }}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Kelompok yang sudah join</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
            {GROUP_NAMES.map((g) => {
              const joined = !!joinedGroups[g];
              return (
                <div key={g} style={{ padding: "8px 14px", borderRadius: 10, background: joined ? GROUP_COLORS[g - 1] : t.panel2, color: joined ? "#101B34" : t.faint, fontWeight: 700, fontSize: 14, opacity: joined ? 1 : 0.5 }}>
                  {(joinedGroups[g] && joinedGroups[g].name) || `Kelompok ${g}`}{joined ? " ✓" : ""}
                </div>
              );
            })}
          </div>

          {!cardsRoundId ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              {/* FITUR BARU: kontrol "Waktu babak" dipindah ke sini dari layar Persiapan —
                  supaya guru bisa mengoreksinya langsung sesaat sebelum tiap babak dimulai,
                  tergantung situasi kelas saat itu (mis. waktu jam pelajaran mau habis), bukan
                  cuma ditentukan jauh-jauh hari saat menyusun materi. Cuma tampil SEBELUM babak
                  ini dimulai (!cardsRoundId) — begitu sudah berjalan, area ini digantikan hitung
                  mundur beneran di pojok kanan atas yang tidak bisa diubah tengah jalan. */}
              <div title="Batas waktu babak ini saat dimainkan" style={{ display: "flex", alignItems: "center", gap: 10, background: t.panel2, borderRadius: 10, padding: "8px 12px" }}>
                <span style={{ fontSize: 14, color: t.dim }}>⏱ Waktu babak</span>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <button onClick={() => setBabakTimeLimit(babakIdx, (babak.timeLimitSec || 180) - 30)} title="Kurangi 30 detik" style={{ width: 26, height: 26, borderRadius: 7, border: "none", background: t.panel, color: t.text, fontSize: 15, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>−</button>
                  <span className="sgt" style={{ minWidth: 42, textAlign: "center", fontWeight: 700, fontSize: 14, color: t.text }}>{formatDuration(babak.timeLimitSec || 180)}</span>
                  <button onClick={() => setBabakTimeLimit(babakIdx, (babak.timeLimitSec || 180) + 30)} title="Tambah 30 detik" style={{ width: 26, height: 26, borderRadius: 7, border: "none", background: t.panel, color: t.text, fontSize: 15, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>+</button>
                </div>
              </div>
              <button onClick={startRound} disabled={publishing || totalGroups === 0} style={{
                display: "flex", alignItems: "center", gap: 8, background: totalGroups === 0 ? t.panel2 : "#F4B740", color: totalGroups === 0 ? t.faint : "#101B34",
                border: "none", borderRadius: 12, padding: "14px 22px", fontWeight: 700, fontSize: 15, cursor: totalGroups === 0 ? "default" : "pointer",
              }}>{publishing ? "Menyiapkan papan…" : "▶ Mulai Babak Ini"}</button>
            </div>
          ) : (
            <React.Fragment>
              {/* FITUR BARU (Langkah 3): progres langsung kelompok yang MASIH mengerjakan (belum
                  masuk daftar finishers di bawah) — data matchedCount dikirim tiap HP siswa
                  sendiri-sendiri lewat cardsProgress (lihat CardsPlayArea & onSnapshot di atas).
                  Disembunyikan otomatis kalau semua yang join sudah selesai (list-nya kosong),
                  supaya tidak ada judul seksi kosong tanpa isi. */}
              {GROUP_NAMES.some((g) => joinedGroups[g] && !finishers.some((f) => f.group === g)) && (
                <div style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Progres kelompok</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {GROUP_NAMES.filter((g) => joinedGroups[g] && !finishers.some((f) => f.group === g)).map((g) => {
                      const done = Math.min(cardsProgress[g] || 0, totalPairsThisRound);
                      const pct = totalPairsThisRound > 0 ? Math.round((done / totalPairsThisRound) * 100) : 0;
                      return (
                        <div key={g} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ width: 20, height: 20, borderRadius: "50%", background: GROUP_COLORS[g - 1], flexShrink: 0 }} />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 3 }}>
                              <span style={{ fontWeight: 600 }}>{(joinedGroups[g] && joinedGroups[g].name) || `Kelompok ${g}`}</span>
                              <span style={{ color: t.dim }}>{done}/{totalPairsThisRound} pasangan ketemu</span>
                            </div>
                            <div style={{ height: 6, borderRadius: 999, background: t.panel2, overflow: "hidden" }}>
                              <div style={{ height: "100%", width: `${pct}%`, background: GROUP_COLORS[g - 1], borderRadius: 999, transition: "width .35s ease" }} />
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Urutan kelompok selesai</div>
              {finishers.length === 0 ? (
                <div style={{ fontSize: 14, color: t.dim, marginBottom: 14 }}>Belum ada yang selesai…</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
                  {finishers.map((f, i) => (
                    <div key={f.group} style={{ display: "flex", alignItems: "center", gap: 10, background: t.panel2, borderRadius: 10, padding: "8px 14px" }}>
                      <span style={{ width: 26, height: 26, borderRadius: "50%", background: GROUP_COLORS[f.group - 1], color: "#101B34", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
                      <span className="sgt" style={{ fontWeight: 700, fontSize: 14 }}>{f.name || `Kelompok ${f.group}`}</span>
                    </div>
                  ))}
                </div>
              )}
              {!scored ? (
                <button onClick={endRoundNow} style={{
                  display: "flex", alignItems: "center", gap: 8,
                  background: timeUp ? "#EF5B5B" : t.panel2, border: "none", color: timeUp ? "#fff" : t.text,
                  borderRadius: 10, padding: "10px 16px", cursor: "pointer", fontSize: 14, fontWeight: 700,
                  animation: timeUp ? "timerPulse 1s ease-in-out infinite" : "none",
                }}>{timeUp ? "⏹ Waktu Habis — Akhiri Babak Sekarang" : "⏹ Akhiri Babak Sekarang"}</button>
              ) : (
                <button onClick={babakIdx < babaks.length - 1 ? nextBabak : endGame} style={{ display: "flex", alignItems: "center", gap: 8, background: "#F4B740", border: "none", color: "#101B34", borderRadius: 10, padding: "10px 16px", cursor: "pointer", fontSize: 14, fontWeight: 700 }}>
                  {babakIdx < babaks.length - 1 ? "Lanjut Babak Berikutnya ➡" : "Selesaikan Sesi"}
                </button>
              )}
            </React.Fragment>
          )}
        </div>

        <div style={{ flex: "1 1 260px", background: t.panel, borderRadius: 16, padding: 20, boxSizing: "border-box", boxShadow: t.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>🏆 Papan Skor</div>
            {/* FITUR BARU: koreksi skor manual — untuk kasus di luar hasil otomatis (mis. kelompok
                curang, salah pencet saat join, atau guru ingin memberi bonus/pengurangan). */}
            <button onClick={() => setCorrectingScore((c) => !c)} style={{ display: "flex", alignItems: "center", gap: 5, background: correctingScore ? "#F4B740" : "transparent", color: correctingScore ? "#101B34" : t.dim, border: correctingScore ? "none" : `1px solid ${t.border}`, borderRadius: 8, padding: "5px 10px", cursor: "pointer", fontSize: 14, fontWeight: 600 }}>
              ✏️ {correctingScore ? "Selesai Koreksi" : "Koreksi Skor"}
            </button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {sortedGroups.filter((g) => (scores[g] || 0) > 0 || joinedGroups[g] || correctingScore).map((g, i) => (
              <div key={g} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: t.panel2, borderRadius: 10, padding: "8px 12px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 3, background: GROUP_COLORS[g - 1] }} />
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{(joinedGroups[g] && joinedGroups[g].name) || `Kelompok ${g}`}{!correctingScore && i === 0 && (scores[g] || 0) > 0 ? " 👑" : ""}</span>
                </div>
                {correctingScore ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <button onClick={() => adjustScore(g, -1)} title="Kurangi 1 poin" style={{ width: 24, height: 24, borderRadius: 6, border: "none", background: t.panel, color: t.text, fontSize: 14, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>−</button>
                    <span className="sgt" style={{ minWidth: 20, textAlign: "center", fontWeight: 700 }}>{scores[g] || 0}</span>
                    <button onClick={() => adjustScore(g, 1)} title="Tambah 1 poin" style={{ width: 24, height: 24, borderRadius: 6, border: "none", background: t.panel, color: t.text, fontSize: 14, fontWeight: 700, cursor: "pointer", lineHeight: 1 }}>+</button>
                  </div>
                ) : (
                  <span className="sgt" style={{ fontWeight: 700 }}>{scores[g] || 0}</span>
                )}
              </div>
            ))}
            {correctingScore && sortedGroups.filter((g) => (scores[g] || 0) > 0 || joinedGroups[g]).length === 0 && (
              <div style={{ fontSize: 14, color: t.faint, textAlign: "center", padding: "6px 0" }}>Belum ada kelompok yang join.</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// FITUR BARU: tab "Akun" — guru yang sedang login bisa menambahkan email guru lain (mis. guru
// pamong) supaya ikut bisa login dengan akun Google-nya sendiri, tanpa perlu edit kode/deploy
// ulang. Lihat catatan keamanan panjang di dekat isEmailAllowedForTeacher() — fitur ini di sisi
// tampilan saja, pembatasan sesungguhnya HARUS ditegakkan lewat Firestore Security Rules.
function AccountsTab({ t, teacher }) {
  const [emails, setEmails] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [newEmail, setNewEmail] = useState("");
  const [adding, setAdding] = useState(false);
  const [formError, setFormError] = useState("");

  // FIX (bug): dulu SEMUA jenis error (gagal baca ATAUpun gagal simpan) langsung ditampilkan
  // sebagai "cek koneksi internet" — padahal penyebab paling umum di sini justru BUKAN koneksi,
  // melainkan Firestore Security Rules yang belum mengizinkan koleksi "teacherAllowlist" (lihat
  // catatan di isEmailAllowedForTeacher()), yang errornya berkode "permission-denied". Pesan
  // "cek koneksi" jelas menyesatkan kalau internetnya baik-baik saja — guru jadi bingung mencari
  // masalah di tempat yang salah. Sekarang errornya dibedakan berdasarkan kodenya.
  //
  // FIX LAGI: pesan yang "dibedakan" itu ternyata masih belum cukup — kalau ternyata BUKAN
  // permission-denied ataupun soal koneksi (mis. Firestore/database belum benar-benar dibuat di
  // Firebase Console, salah region, dsb.), guru tetap kebingungan karena pesannya jatuh ke
  // fallback "cek koneksi internet" yang sama menyesatkannya. Sekarang kode & pesan error ASLI
  // dari Firestore selalu ditampilkan juga di layar (bukan cuma disimpan di console), supaya
  // penyebab sebenarnya langsung kelihatan tanpa perlu buka DevTools.
  function describeFirestoreError(err) {
    console.error("teacherAllowlist error:", err);
    const raw = err ? ` [kode: ${err.code || "tidak diketahui"}${err.message ? " — " + err.message : ""}]` : "";
    if (err && err.code === "permission-denied") {
      return "Ditolak oleh Firestore (permission-denied) — koleksi \"teacherAllowlist\" belum diizinkan di Security Rules Firebase Console. Ini bukan soal koneksi internet." + raw;
    }
    return "Gagal terhubung ke server." + raw;
  }

  useEffect(() => {
    const unsub = db.collection("teacherAllowlist").onSnapshot(
      (snap) => {
        setEmails(snap.docs.map((d) => ({ email: d.id, ...d.data() })).sort((a, b) => a.email.localeCompare(b.email)));
        setLoaded(true); setLoadError("");
      },
      (err) => { setLoaded(true); setLoadError(describeFirestoreError(err)); }
    );
    return () => unsub();
  }, []);

  function addEmail() {
    const lower = newEmail.trim().toLowerCase();
    setFormError("");
    if (!lower) return;
    // Validasi format ringan saja (bukan verifikasi email sungguhan ada) — cukup untuk
    // menyaring salah ketik jelas sebelum tersimpan.
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lower)) { setFormError("Format email tidak valid."); return; }
    if (lower.endsWith("@student.ub.ac.id")) { setFormError("Email @student.ub.ac.id sudah otomatis diizinkan, tidak perlu ditambahkan."); return; }
    if (emails.some((e) => e.email === lower)) { setFormError("Email ini sudah ada di daftar."); return; }
    setAdding(true);
    db.collection("teacherAllowlist").doc(lower).set({
      addedBy: teacher.email || null,
      addedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(() => setNewEmail(""))
      .catch((err) => setFormError(describeFirestoreError(err)))
      .finally(() => setAdding(false));
  }
  function removeEmail(email) {
    if (!window.confirm(`Hapus akses login untuk ${email}?`)) return;
    db.collection("teacherAllowlist").doc(email).delete().catch((err) => alert(describeFirestoreError(err)));
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ fontSize: 14, color: t.dim, lineHeight: 1.6 }}>
        Email @student.ub.ac.id selalu otomatis boleh login. Tambahkan di sini kalau ada guru lain (mis. guru pamong) yang perlu login pakai akun Google-nya sendiri di luar domain itu.
      </div>

      <div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={newEmail} onChange={(e) => setNewEmail(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") addEmail(); }}
            placeholder="email.gurupamong@contoh.com" disabled={adding}
            style={{ flex: 1, padding: "9px 12px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.panel, color: t.text, fontSize: 14, boxSizing: "border-box" }} />
          <button onClick={addEmail} disabled={adding || !newEmail.trim()} style={{ background: newEmail.trim() ? "#F4B740" : t.panel2, color: newEmail.trim() ? "#101B34" : t.faint, border: "none", padding: "9px 16px", borderRadius: 8, cursor: newEmail.trim() ? "pointer" : "default", fontSize: 14, fontWeight: 700, whiteSpace: "nowrap" }}>{adding ? "Menyimpan…" : "+ Tambah"}</button>
        </div>
        {formError && <div style={{ marginTop: 6, fontSize: 14, color: "#EF5B5B" }}>{formError}</div>}
      </div>

      {!loaded ? (
        <div style={{ padding: "16px 0", textAlign: "center", color: t.faint, fontSize: 14 }}>Memuat daftar…</div>
      ) : loadError ? (
        <div style={{ padding: "16px 0", textAlign: "center", color: "#EF5B5B", fontSize: 14, lineHeight: 1.5 }}>{loadError}</div>
      ) : emails.length === 0 ? (
        <div style={{ padding: "16px 0", textAlign: "center", color: t.faint, fontSize: 14 }}>Belum ada email tambahan yang ditambahkan.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {emails.map((e) => (

function App() {
  const [activeGame, setActiveGame] = useState(() => {
    try { return localStorage.getItem("app-active-game") || null; } catch (e) { return null; }
  });
  // Tema khusus halaman Pilih Game — terpisah dari tema masing-masing game (tiap game simpan
  // preferensinya sendiri). Disimpan supaya pilihan guru diingat tiap kali buka halaman ini lagi.
  const [pickerTheme, setPickerTheme] = useState(() => {
    try { return localStorage.getItem("app-theme") || "light"; } catch (e) { return "light"; }
  });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [backupMsg, setBackupMsg] = useState(null);
  function handleExportAllGames() {
    const result = exportAllGamesBackup(authUser.uid);
    if (!result.saved) {
      setBackupMsg({ ok: false, text: result.skipped >= 3 ? "Belum ada data tersimpan di game manapun untuk dicadangkan." : "Gagal mengunduh cadangan — coba lagi." });
    } else {
      setBackupMsg({ ok: true, text: `1 file cadangan (berisi ${result.gameCount} game) berhasil diunduh${result.skipped > 0 ? ` (${result.skipped} game dilewati, belum ada data)` : ""}. Cek folder Downloads.` });
    }
    setTimeout(() => setBackupMsg(null), 6000);
  }
  function handleImportAllGames(file) {
    if (!file) return;
    if (!window.confirm("Muat cadangan ini? Materi/tema dengan nama sama di tiap game akan MENIMPA yang ada sekarang — materi/tema lain tetap aman.")) return;
    importAllGamesBackup(authUser.uid, file).then(({ updated, skipped, failed }) => {
      setBackupMsg({
        ok: updated > 0 && failed === 0,
        text: updated === 0
          ? "File ini tidak dikenali sebagai cadangan aplikasi ini."
          : `${updated} game berhasil dimuat dari cadangan${failed > 0 ? `, ${failed} gagal` : ""}. Buka game terkait untuk lihat perubahannya.`,
      });
      setTimeout(() => setBackupMsg(null), 6000);
    });
  }
  useEffect(() => {
    try { localStorage.setItem("app-theme", pickerTheme); } catch (e) {}
  }, [pickerTheme]);
  // undefined = status login belum diketahui (baru buka web), null = sudah tahu tapi belum login
  const [authUser, setAuthUser] = useState(undefined);
  const [signingIn, setSigningIn] = useState(false);
  const [loginError, setLoginError] = useState("");
  const joinCode = getJoinCodeFromUrl();

  useEffect(() => {
    try {
      if (activeGame) localStorage.setItem("app-active-game", activeGame);
      else localStorage.removeItem("app-active-game");
    } catch (e) {}
  }, [activeGame]);

  // Pantau status login. Untuk siswa (buka lewat ?join=...), sesi ANONIM dibuat otomatis di
  // background — tidak perlu tombol login. Untuk guru, sesi anonim TIDAK dianggap "sudah login":
  // guru wajib klik "Masuk dengan Google" di TeacherLoginScreen sebelum masuk layar Persiapan.
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => setAuthUser(user));
    if (joinCode) ensureAnonymousAuth();
    return unsub;
  }, [joinCode]);

  function handleTeacherSignIn() {
    setSigningIn(true); setLoginError("");
    signInTeacherWithGoogle()
      .catch((err) => {
        console.error("Gagal login Google:", err);
        const code = err && err.code;
        // BUGFIX: pesan generik "Gagal masuk. Coba lagi." tidak membantu diagnosa —
        // kode error Firebase Auth biasanya langsung menunjuk penyebab pastinya
        // (domain belum diizinkan, provider belum diaktifkan, popup diblokir browser, dst).
        const messages = {
          "auth/popup-closed-by-user": "Login dibatalkan.",
          "auth/unauthorized-domain": "Domain website ini belum diizinkan di Firebase Console (Authentication → Settings → Authorized domains).",
          "auth/operation-not-allowed": "Login Google belum diaktifkan di Firebase Console (Authentication → Sign-in method).",
          "auth/popup-blocked": "Jendela popup login diblokir browser. Izinkan popup untuk situs ini lalu coba lagi.",
          "auth/network-request-failed": "Gagal terhubung ke internet. Cek koneksi lalu coba lagi.",
          "auth/email-not-allowed": "Email ini belum diizinkan untuk login. Minta guru yang sudah punya akses menambahkannya lewat halaman Pengaturan → Akun.",
        };
        setLoginError(messages[code] || `Gagal masuk${code ? ` (${code})` : ""}. Coba lagi.`);
      })
      .finally(() => setSigningIn(false));
  }

  const stillConnecting = authUser === undefined || (joinCode && !authUser);
  if (stillConnecting) {
    return (
      <div style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: THEMES.light.bg, color: THEMES.light.dim, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>
        Menghubungkan…
      </div>
    );
  }

  if (joinCode) return <StudentJoinScreen roomCode={joinCode} />;

  // Dari sini ke bawah khusus guru — sesi anonim (mis. bekas siswa join di device yang sama)
  // tidak dianggap login guru yang valid.
  if (!authUser || authUser.isAnonymous) {
    return <TeacherLoginScreen onSignIn={handleTeacherSignIn} busy={signingIn} error={loginError} />;
  }

  if (activeGame === "g1") return <TebakCariKataGame onBack={() => setActiveGame(null)} teacher={authUser} theme={pickerTheme} setTheme={setPickerTheme} />;
  if (activeGame === "g2") return <BukaKotakGame onBack={() => setActiveGame(null)} theme={pickerTheme} setTheme={setPickerTheme} teacher={authUser} />;
  if (activeGame === "g3") return <CocokkanKartuGame onBack={() => setActiveGame(null)} theme={pickerTheme} setTheme={setPickerTheme} teacher={authUser} />;

  const initial = (authUser.displayName || authUser.email || "?").trim().charAt(0).toUpperCase();
  const firstName = (authUser.displayName || authUser.email || "Guru").split("@")[0].split(" ")[0];
  const pt = THEMES[pickerTheme];
  return (
    <div className="pilih-game-screen" style={{ fontFamily: "'Work Sans', system-ui, sans-serif", background: pt.bg, color: pt.text, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, boxSizing: "border-box", position: "relative", overflow: "hidden" }}>
      <style>{fontImport}</style>
      <JapaneseBackdrop theme={pickerTheme} />
      <div style={{ width: "100%", maxWidth: 1080, position: "relative", zIndex: 1 }}>
        <div className="pilih-game-header" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 6 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <div className="sgt pilih-game-avatar" style={{ width: 56, height: 56, borderRadius: "50%", background: "linear-gradient(135deg,#F4B740,#D98A2B)", color: "#101B34", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 700, boxShadow: "0 3px 10px rgba(217,138,43,.35)", flexShrink: 0 }}>{initial}</div>
            <div>
              {/* Nama produk "SanKyuu" (san = 3, kyuu = 9) = 3 game yang bisa dimainkan &
                  9 materi kelas XI yang dipelajari — dijadikan judul utama, "Pilih Game" turun
                  jadi overline kecil di atasnya, dan artinya dijelaskan lewat chip singkat +
                  kalimat deskripsi di bawah supaya guru yang baru pertama buka langsung paham. */}
              <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", color: pt.faint }}>Pilih Game</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
                <div className="sgt pilih-game-title" style={{ fontSize: 38, fontWeight: 700, letterSpacing: -0.4 }}>SanKyuu</div>
                <span style={{ fontSize: 14, fontWeight: 700, color: "#D98A2B", background: "rgba(244,183,64,.16)", padding: "4px 12px", borderRadius: 999, letterSpacing: 0.2 }}>3 Game · 14 Tema</span>
              </div>
              <div style={{ fontSize: 15, color: pt.dim, marginTop: 3 }}>{greetingByHour()}, {firstName} 👋</div>
            </div>
          </div>
          <div className="pilih-game-actions" style={{ display: "flex", gap: 8 }}>
            {/* FITUR BARU (ringkas): dulu "Simpan Semua Data" tombol lebar berlabel teks —
                sekarang ikon saja (konsisten dengan tombol ⚙️/🌙 di sebelahnya), keterangannya

            {backupMsg.ok ? "✅" : "⚠️"} {backupMsg.text}
          </div>
        )}
        <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} t={pt} teacher={authUser} />
        <div className="game-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 300px))", gap: 28, justifyContent: "center", perspective: 1200 }}>
          {GAMES.map((g, i) => (
            <button
              key={g.id}
              className="game-card"
              onClick={() => g.available && setActiveGame(g.id)}
              disabled={!g.available}
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center",
                background: pt.panel, border: `1px solid ${pt.border}`, borderRadius: 24, padding: "34px 26px 28px", color: pt.text,
                cursor: g.available ? "pointer" : "default", opacity: g.available ? 1 : 0.45,
                boxShadow: pickerTheme === "dark" ? "0 2px 10px rgba(0,0,0,.3)" : "0 2px 10px rgba(28,32,51,.06)",
                animationDelay: `${i * 110}ms`, "--shimmer-delay": `${450 + i * 110}ms`,
                "--accent": g.accent, "--accent-soft": g.accentSoft, "--accent-shadow": g.accent + "40",
              }}
            >
              <div className="icon-badge" style={{ width: 68, height: 68, borderRadius: 18, background: g.accentSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, marginBottom: 18, flexShrink: 0 }}>{g.icon}</div>
              <div className="sgt" style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}>{g.name}</div>
              <div style={{ display: "inline-block", fontSize: 14, fontWeight: 600, color: g.accent, background: g.accentSoft, padding: "4px 12px", borderRadius: 999, marginBottom: 15, letterSpacing: 0.2 }}>{g.tag}</div>
              <div style={{ fontSize: 14, color: pt.dim, lineHeight: 1.55, marginBottom: 24 }}>{g.desc}{!g.available ? " · segera" : ""}</div>
              <div className="arrow-chip sgt" style={{ fontSize: 14, fontWeight: 700, color: g.accent, background: g.accentSoft, padding: "9px 20px", borderRadius: 999, marginTop: "auto" }}>Mulai →</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
